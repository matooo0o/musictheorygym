name: Build iOS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'scripts/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'ios/**'
      - 'version.json'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: {node-version: 20}

      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods -q

      - run: npm install

      - name: Add iOS platform (if not exists)
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          else
            echo "iOS platform already exists"
          fi

      - name: Stamp the version
        run: |
          node scripts/set-version.js
          VERSION=$(node -e "console.log(JSON.parse(fs.readFileSync('version.json')).version)")
          IOS_BUILD=$(node -e "console.log(JSON.parse(fs.readFileSync('version.json')).ios.buildNumber)")
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $IOS_BUILD" ios/App/App/Info.plist
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - run: npx cap sync ios

      - name: Draw the launcher icon
        run: node scripts/brand-ios.js

      - name: Build iOS App
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Export IPA (unsigned, for sideloading)
        run: |
          cd ios/App
          # Create export options for ad-hoc/unsigned build
          cat > exportOptions.plist << 'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>method</key>
    <string>ad-hoc</string>
    <key>teamID</key>
    <string></string>
    <key>compileBitcode</key>
    <false/>
    <key>stripSwiftSymbols</key>
    <true/>
    <key>thinning</key>
    <string><none></string>
</dict>
</plist>
EOF
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist exportOptions.plist \
            2>&1 | tail -20

      - name: Rename IPA with version
        run: |
          VERSION=$(node -e "console.log(JSON.parse(fs.readFileSync('version.json')).version)")
          IPA_SRC="ios/App/build/export/App.ipa"
          IPA_DST="ToniKa-iOS-${VERSION}.ipa"
          if [ -f "$IPA_SRC" ]; then
            cp "$IPA_SRC" "$IPA_DST"
            echo "IPA created: $IPA_DST"
            echo "IPA size: $(wc -c < "$IPA_DST") bytes"
          else
            echo "ERROR: IPA not found at $IPA_SRC"
            ls -la ios/App/build/export/
            exit 1
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToniKa-iOS-${{ env.VERSION }}
          path: ToniKa-iOS-*.ipa

      - name: Create GitHub Release (iOS)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -e "console.log(JSON.parse(fs.readFileSync('version.json')).version)")
          IPA="ToniKa-iOS-${VERSION}.ipa"
          if [ -f "$IPA" ]; then
            if gh release view "v${VERSION}-ios" >/dev/null 2>&1; then
              gh release upload "v${VERSION}-ios" "$IPA" --clobber
            else
              gh release create "v${VERSION}-ios" "$IPA" \
                --title "ToniKa iOS v${VERSION}" \
                --notes "iOS build (unsigned, install via AltStore/Sideloadly/Xcode)"
            fi
          else
            echo "IPA not found"
            exit 1
          fi