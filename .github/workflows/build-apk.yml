name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
      APP_CERT_SHA256: ebde8b1d4da7bfea4f3ccaa2ff0c2d76b269c4ee98520b1846912e39100fd289
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: npx cap add android
      - name: Stamp the version
        run: node scripts/set-version.js
      - run: npx cap sync android
      - name: Draw the launcher icon
        run: node scripts/brand.js
      - name: Declare microphone permission
        run: node scripts/android-permissions.js
      - name: Sign with the app key
        run: |
          ls -la signing/
          node scripts/android-signing.js
          echo "=== build.gradle after signing ==="
          cat android/app/build.gradle
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Name the APK after the version
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "ToniKa-${APP_VERSION}.apk"
      - name: Check that updates will install
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK/build-tools" -name apksigner -type f 2>/dev/null | sort | tail -n1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found in the Android SDK"
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "ToniKa-${APP_VERSION}.apk" | tee certs.txt
          echo "=== Full certs output ==="
          cat certs.txt
          echo "=== Normalized for grep ==="
          tr -d ':' < certs.txt | tr '[:upper:]' '[:lower:]' | grep -i "sha-256" || true
          if ! tr -d ':' < certs.txt | tr '[:upper:]' '[:lower:]' | grep -q "sha-256 digest: ${APP_CERT_SHA256}"; then
            echo "::error::This APK is not signed with the ToniKa key, so Android would refuse to install it over the previous version."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ToniKa-${{ env.APP_VERSION }}
          path: ToniKa-${APP_VERSION}.apk
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${APP_VERSION}" >/dev/null 2>&1; then
            gh release upload "v${APP_VERSION}" "ToniKa-${APP_VERSION}.apk" --clobber
          else
            gh release create "v${APP_VERSION}" "ToniKa-${APP_VERSION}.apk" \
              --title "ToniKa v${APP_VERSION}" --generate-notes
          fi
      - name: Keep the version in Settings equal to the release
        run: |
          if git diff --quiet -- www/index.html; then
            echo "Settings already shows ${APP_VERSION}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/index.html
          git commit -m "Set the app version to ${APP_VERSION} [skip ci]"
          git push origin HEAD:main