name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: npx cap add android
      - name: Stamp the version
        run: node scripts/set-version.js
      - run: npx cap sync android
      - name: Draw the launcher icon
        run: node scripts/brand.js
      - name: Declare microphone permission
        run: node scripts/android-permissions.js
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Name the APK after the version
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "ToniKa-${APP_VERSION}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ToniKa-${{ env.APP_VERSION }}
          path: ToniKa-${{ env.APP_VERSION }}.apk
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${APP_VERSION}" >/dev/null 2>&1; then
            gh release upload "v${APP_VERSION}" "ToniKa-${APP_VERSION}.apk" --clobber
          else
            gh release create "v${APP_VERSION}" "ToniKa-${APP_VERSION}.apk" \
              --title "ToniKa v${APP_VERSION}" --generate-notes
          fi
