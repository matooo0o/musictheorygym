name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'scripts/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'ios/**'
      - 'version.json'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: write

# One iOS build at a time per branch, so two pushes cannot race to publish the
# same release tag.
concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Pinned on purpose: Capacitor 6 is built and tested against the Xcode 16
    # toolchain shipped with the macOS 15 image. "macos-latest" can move to a
    # newer Xcode without warning and break the build.
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install CocoaPods
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            echo "CocoaPods not preinstalled, installing with Homebrew"
            HOMEBREW_NO_AUTO_UPDATE=1 brew install cocoapods
          fi
          pod --version

      - name: Cache CocoaPods specs
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('ios/App/Podfile', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Add the iOS platform if it is missing
        run: |
          if [ ! -d "ios/App/App.xcodeproj" ]; then
            npx cap add ios
          fi

      - name: Stamp the version
        run: |
          node scripts/set-version.js
          VERSION=$(node -p "require('./version.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building ToniKa iOS $VERSION"

      - name: Sync web assets and install pods
        run: npx cap sync ios

      - name: Declare the privacy usage descriptions
        run: node scripts/ios-permissions.js

      - name: Draw the launcher icon
        run: node scripts/brand-ios.js

      - name: Build the archive (unsigned)
        # The archive is deliberately unsigned: no Apple certificate is needed
        # to compile the app. Signing happens later, on the machine or with the
        # sideloading tool that installs it.
        run: |
          set -o pipefail
          xcodebuild -version
          cd ios/App
          mkdir -p build
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tee build/xcodebuild.log

      - name: Package the unsigned IPA
        # xcodebuild -exportArchive refuses to run without a signing identity,
        # so the .ipa is assembled by hand: an .ipa is just a zip with a
        # Payload/ directory that contains the .app bundle.
        run: |
          set -euo pipefail
          APP="ios/App/build/App.xcarchive/Products/Applications/App.app"
          IPA="ToniKa-iOS-${VERSION}.ipa"

          if [ ! -d "$APP" ]; then
            echo "::error::App.app was not found in the archive"
            find ios/App/build -maxdepth 5 -print || true
            exit 1
          fi

          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/App.app

          # Remove any leftover signature so the sideloading tool re-signs the
          # bundle cleanly with the user's own certificate.
          rm -rf build/ipa/Payload/App.app/_CodeSignature
          find build/ipa/Payload/App.app -name "embedded.mobileprovision" -delete

          # ditto keeps permissions, symlinks and extended attributes intact.
          ditto -c -k --sequesterRsrc --keepParent build/ipa/Payload "$IPA"

          # An .ipa must have Payload/App.app at the very top level, not nested
          # inside another directory.
          unzip -Z1 "$IPA" > build/ipa-list.txt
          if ! grep -Fqx "Payload/App.app/App" build/ipa-list.txt; then
            echo "::error::The IPA does not contain Payload/App.app/App"
            sed -n '1,20p' build/ipa-list.txt
            exit 1
          fi

          echo "IPA: $IPA ($(wc -c < "$IPA") bytes)"
          unzip -l "$IPA" | sed -n '1,15p'
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" build/ipa/Payload/App.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" build/ipa/Payload/App.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" build/ipa/Payload/App.app/Info.plist
          lipo -info build/ipa/Payload/App.app/App

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToniKa-iOS-${{ env.VERSION }}
          path: ToniKa-iOS-${{ env.VERSION }}.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (iOS)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IPA="ToniKa-iOS-${VERSION}.ipa"
          TAG="v${VERSION}-ios"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" --clobber
          else
            gh release create "$TAG" "$IPA" \
              --title "ToniKa iOS v${VERSION}" \
              --notes "iOS build (unsigned). Install by re-signing with AltStore, Sideloadly or Xcode."
          fi

      - name: Summary
        run: |
          {
            echo "### iOS build succeeded"
            echo ""
            echo "- Version: \`${VERSION}\`"
            echo "- IPA: \`ToniKa-iOS-${VERSION}.ipa\`"
            echo "- Bundle: \`com.theorygym.app\`"
            echo ""
            echo "The IPA is unsigned. It must be signed for the target device"
            echo "with AltStore, Sideloadly, Xcode or Apple Configurator."
          } >> "$GITHUB_STEP_SUMMARY"
