name: Build iOS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'scripts/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'ios/**'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
      IOS_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: {node-version: 20}

      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods -q

      - run: npm install

      - name: Add iOS platform (if not exists)
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          else
            echo "iOS platform already exists"
          fi

      - name: Stamp the version
        run: |
          node scripts/set-version.js
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $IOS_BUILD_NUMBER" ios/App/App/Info.plist

      - run: npx cap sync ios

      - name: Draw the launcher icon
        run: node scripts/brand-ios.js

      - name: Build iOS App
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Export IPA
        run: |
          cd ios/App
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist exportOptions.plist

      - name: Verify IPA
        run: |
          IPA="ios/App/build/export/App.ipa"
          echo "IPA size: $(wc -c < "$IPA") bytes"
          unzip -l "$IPA" | head -20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ToniKa-iOS-${{ env.APP_VERSION }}
          path: ios/App/build/export/App.ipa

      - name: Create GitHub Release (iOS)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPA="ios/App/build/export/App.ipa"
          if gh release view "v${APP_VERSION}-ios" >/dev/null 2>&1; then
            gh release upload "v${APP_VERSION}-ios" "$IPA" --clobber
          else
            gh release create "v${APP_VERSION}-ios" "$IPA" \
              --title "ToniKa iOS v${APP_VERSION}" \
              --notes "iOS build ${{ github.run_number }}"
          fi