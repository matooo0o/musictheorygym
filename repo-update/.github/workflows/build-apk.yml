name: Build APK
on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'scripts/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'android/**'
      - 'signing/**'
      - 'version.json'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_CERT_SHA256: ebde8b1d4da7bfea4f3ccaa2ff0c2d76b269c4ee98520b1846912e39100fd289
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: npx cap add android
      - name: Stamp the version
        run: node scripts/set-version.js
      - run: npx cap sync android
      - name: Draw the launcher icon
        run: node scripts/brand.js
      - name: Declare microphone permission
        run: node scripts/android-permissions.js
      - name: Sign with the app key
        run: |
          ls -la signing/
          node scripts/android-signing.js
          echo "=== build.gradle after signing ==="
          cat android/app/build.gradle
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Name the APK after the version
        run: |
          VERSION=$(node -e "console.log(JSON.parse(fs.readFileSync('version.json')).version)")
          cp android/app/build/outputs/apk/debug/app-debug.apk "ToniKa-${VERSION}.apk"
      - name: Check that updates will install
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(find "$SDK/build-tools" -name apksigner -type f 2>/dev/null | sort | tail -n1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner was not found in the Android SDK"
            exit 1
          fi
          VERSION=$(node -e "console.log(JSON.parse(fs.readFileSync('version.json')).version)")
          "$APKSIGNER" verify --print-certs "ToniKa-${VERSION}.apk" | tee certs.txt
          echo "=== Full certs output ==="
          cat certs.txt
          if ! grep -i "sha-256 digest:" certs.txt | grep -q "$(node -e "console.log(JSON.parse(fs.readFileSync('version.json')).android_cert_sha256 || 'ebde8b1d4da7bfea4f3ccaa2ff0c2d76b269c4ee98520b1846912e39100fd289')")"; then
            echo "::error::This APK is not signed with the ToniKa key, so Android would refuse to install it over the previous version."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ToniKa-${{ env.VERSION }}
          path: ToniKa-${{ env.VERSION }}.apk
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -e "console.log(JSON.parse(fs.readFileSync('version.json')).version)")
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" "ToniKa-${VERSION}.apk" --clobber
          else
            gh release create "v${VERSION}" "ToniKa-${VERSION}.apk" \
              --title "ToniKa v${VERSION}" --generate-notes
          fi
      - name: Keep the version in Settings equal to the release
        run: |
          if git diff --quiet -- www/index.html; then
            echo "Settings already shows ${VERSION}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/index.html
          git commit -m "Set the app version to ${VERSION} [skip ci]"
          git push origin HEAD:main