html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Georgia,"Times New Roman",serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:26px;margin:0 0 2px}
.sub{color:var(--mut);margin:0 0 18px;font-family:system-ui,sans-serif;font-size:14px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;font-family:system-ui,sans-serif}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 12px;border-radius:999px;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.lesson h2{font-size:17px;margin:0 0 6px}
.lesson p{margin:6px 0;font-size:15px}
.lesson summary{cursor:pointer;font-family:system-ui,sans-serif;font-weight:600;font-size:14px;color:var(--acc)}
.q{font-size:19px;margin:0 0 12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-family:system-ui,sans-serif}
.opts button{padding:12px 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:15px;cursor:pointer}
.opts button:hover:not(:disabled){border-color:var(--acc)}
.opts button.ok{background:var(--okb);border-color:var(--ok);color:var(--ok)}
.opts button.no{background:var(--nob);border-color:var(--no);color:var(--no)}
.fb{margin-top:12px;padding:12px;border-radius:10px;font-size:15px}
.fb.ok{background:var(--okb)}.fb.no{background:var(--nob)}
.fb b{font-family:system-ui,sans-serif}
.row{display:flex;gap:8px;margin-top:12px;font-family:system-ui,sans-serif;align-items:center;flex-wrap:wrap}
.btn{border:0;background:var(--acc);color:#fff;padding:10px 16px;border-radius:10px;font-size:15px;cursor:pointer}
.btn.alt{background:transparent;border:1px solid var(--line);color:var(--ink)}
.stat{color:var(--mut);font-size:13px;margin-left:auto}
.big{font-size:30px;letter-spacing:.04em}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opts svg{width:100%;height:auto;display:block}
.opts.w1{grid-template-columns:1fr}
.opts button small{display:block;margin-top:4px}
.sg .big{font-size:26px}
/*SIDE*/
:root{padding-top:0}
body{font-size:17px}
#bar{position:fixed;top:0;left:0;right:0;z-index:7;display:flex;align-items:center;gap:12px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;background:var(--card);border-bottom:1px solid var(--line)}
#tg{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-size:20px}
#ttl{font:600 18px system-ui,sans-serif}
#side{position:fixed;top:0;left:0;bottom:0;width:80%;max-width:300px;padding:calc(76px + env(safe-area-inset-top,0px)) 14px 14px;background:var(--card);border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .2s;z-index:9;overflow-y:auto;font-family:system-ui,sans-serif}
body.open #side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:8}
body.open #scrim{opacity:1;pointer-events:auto}
#side .nh{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:0 0 10px 4px}
#side .tabs{display:flex;flex-direction:column;gap:8px;overflow:visible}
#side .tabs button{width:100%;text-align:left;border-radius:12px;padding:14px;font-size:16px}
main{padding:calc(72px + env(safe-area-inset-top,0px)) 12px calc(32px + env(safe-area-inset-bottom,0px))}
h1,.sub{display:none}
.card{border-radius:16px;padding:14px}
.q{font-size:20px}
.big{font-size:26px}
.sg .big{font-size:22px}
.opts{grid-template-columns:1fr;gap:10px}
.opts button{min-height:56px;font-size:17px;border-radius:14px}
.btn{min-height:48px;padding:12px 18px;font-size:16px}
.fb+.row{flex-wrap:nowrap}
.fb+.row .btn{flex:1}
.ht{font-size:30px;margin:8px 0 4px}
.hs{color:var(--mut);font:15px system-ui,sans-serif;margin:0 0 8px}
.hcard,.tcard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:12px;color:var(--ink);cursor:pointer;font-family:inherit;font-size:16px}
.hcard b{display:block;font-size:21px}.tcard b{font-size:17px}
.hcard span,.tcard span{display:block;color:var(--mut);font:14px system-ui,sans-serif;margin-top:4px}
.hcard:hover,.tcard:hover{border-color:var(--acc)}
body:not(.v-ex.navon):not(.v-prac.navon) #tg,body:not(.v-ex.navon):not(.v-prac.navon) #side{display:none}
body.v-home #hm{display:none}
#hm{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-size:20px}
body.v-home #bar{display:none}
body.v-home main{padding-top:calc(16px + env(safe-area-inset-top,0px))}
/*HOME*/
.hero{position:relative;text-align:center;padding:10px 8px 22px}
.hero::before{content:"";position:absolute;left:-8px;right:-8px;top:-14px;height:170px;background:radial-gradient(120% 100% at 50% 0%,var(--acc),transparent 70%);opacity:.13;border-radius:26px;pointer-events:none}
.hero>*{position:relative}
.hero .logo{font-size:42px;line-height:1;margin-bottom:6px}
.hero .ht{font-size:28px;margin:0 0 6px;letter-spacing:-.01em}
.hero .hs{max-width:34ch;margin:0 auto}
.hcard{position:relative;overflow:hidden;transition:transform .15s,border-color .15s,box-shadow .15s}
.hcard b{display:flex;align-items:center;gap:10px;font-size:21px}
.hcard .ic{font-size:26px;line-height:1}
.hcard:active{transform:scale(.985)}
.hcard::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:4px;border-radius:0 4px 4px 0;background:var(--acc)}
/*PRAC*/
.pcard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:12px;color:var(--ink);cursor:pointer;font-family:inherit;font-size:17px;position:relative;overflow:hidden;transition:transform .15s,border-color .15s,box-shadow .15s}
.pcard b{display:flex;align-items:center;gap:10px;font-size:20px}
.pcard .ic{font-size:24px;line-height:1}
.pcard span{display:block;color:var(--mut);font:14px system-ui,sans-serif;margin-top:4px}
.pcard:active{transform:scale(.985)}
.adv{display:inline-block;margin-top:10px;font:600 11px system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);border:1px solid var(--acc);border-radius:999px;padding:2px 8px;font-style:normal}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chip{font:600 14px system-ui,sans-serif;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:44px;text-align:center}
.chip.now{border-color:var(--acc);box-shadow:0 0 0 2px rgba(194,65,12,.18)}
.chip.ok{background:var(--okb);border-color:var(--ok);color:var(--ok)}
.chip.bad{background:var(--nob);border-color:var(--no);color:var(--no)}
.chip.skip{opacity:.55;text-decoration:line-through}
.micbox{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-family:system-ui,sans-serif}
.micnote{font:600 34px system-ui,sans-serif}
.miccents{color:var(--mut);font-size:13px;min-height:18px}
.micbar{position:relative;height:6px;border-radius:999px;background:var(--line);margin:10px auto 4px;max-width:260px}
.micbar span{position:absolute;top:-3px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--acc);transition:left .08s linear}
.micro{font:13px system-ui,sans-serif;color:var(--mut);min-height:18px;margin:8px 0 0}
.neck{overflow-x:auto;margin:14px 0 0;padding-bottom:2px}
.neckcap{font:12px system-ui,sans-serif;color:var(--mut);text-align:center;margin:8px 0 0}
/*SET*/
#se{position:fixed;top:calc(9px + env(safe-area-inset-top,0px));right:12px;z-index:6;width:42px;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:19px;cursor:pointer;padding:0}
body.v-home #se{display:none}
.gear{position:absolute;top:0;right:0;width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-size:19px;cursor:pointer;z-index:2}
#setp{position:fixed;inset:0;z-index:30;display:none;background:rgba(0,0,0,.45);overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 14px 40px}
#setp.on{display:block}
#setbox{max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
#setbox h2{font-size:21px;margin:0 0 2px}
.setrow{margin-top:18px}
.setrow>b{font:600 12px system-ui,sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);display:block;margin-bottom:8px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:10px 14px;font:15px system-ui,sans-serif;cursor:pointer}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid var(--line);cursor:pointer;padding:0}
.sw.on{border-color:var(--ink)}
.tune{display:flex;align-items:center;gap:10px}
.tune input[type=range]{flex:1;min-width:0;accent-color:var(--acc)}
.tune input[type=number]{width:84px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif}
.tune .hz{color:var(--mut);font:14px system-ui,sans-serif}
.tunehint{font:12px system-ui,sans-serif;color:var(--mut);margin:8px 0 0}
.ver{font:12px system-ui,sans-serif;color:var(--mut);margin:20px 0 0;text-align:center}

const TIPS=[
[/relative minor of/,'<h2>Relative minor</h2><p>The relative minor starts on the <b>6th note</b> of the major scale and uses exactly the same notes. Write the major scale out, count to the 6th note, and that is your answer.</p>'],
[/relative major of/,'<h2>Relative major</h2><p>The relative major starts on the <b>3rd note</b> of the minor scale, 3 semitones above its root. Write the minor scale out and take the 3rd note.</p>'],
[/Which diagram shows the .* scale/,'<h2>Reading a fretboard diagram</h2><p>The bottom line is the low E string, the top line the high E, and the numbers underneath are frets (0 is the open string). Every dot is a note of the scale and orange dots are the root.</p><p>Find the orange root first, then check the notes around it against the pattern: a major scale has a natural 3rd, 6th and 7th, a minor scale has them lowered.</p>'],
[/Which diagram shows/,'<h2>A mode on the fretboard</h2><p>Locate the orange root, then look for the note that gives the mode its character: the \u266d2 of Phrygian, the \u266f4 of Lydian, the \u266d7 of Mixolydian. All the wrong diagrams share the same root, so only those characteristic notes tell them apart.</p>'],
[/What are the notes of \S+ (major|minor)\?/,'<h2>Spelling a scale</h2><p>Use each letter name once, in order, and add # or b only where the step pattern needs it. Major is W-W-H-W-W-W-H and minor is W-H-W-W-H-W-W. The wrong answers usually change one or two of the 3rd, 6th and 7th, so check those first.</p>'],
[/What are the notes of/,'<h2>Spelling a mode</h2><p>Take the parent major scale and start from the mode\u2019s root. The wrong options usually have one or two notes shifted by a semitone, so compare each option with the mode\u2019s formula.</p>'],
[/note of the .* major/,'<h2>Major scale pattern</h2><p>Count up from the root using <b>W-W-H-W-W-W-H</b> (W = 2 semitones, H = 1). Each letter name appears once, so the sharp or flat you meet is the note the pattern forces.</p>'],
[/note of the .* minor/,'<h2>Natural minor pattern</h2><p>Count up from the root using <b>W-H-W-W-H-W-W</b>. Compared with the major scale on the same root, the 3rd, 6th and 7th are lowered by a semitone.</p>'],
[/What interval is/,'<h2>Counting an interval</h2><p>Count the semitones between the two notes (every piano key, black ones too), then match the number: 1 minor 2nd, 2 major 2nd, 3 minor 3rd, 4 major 3rd, 5 perfect 4th, 6 tritone, 7 perfect 5th, 8 minor 6th, 9 major 6th, 10 minor 7th, 11 major 7th, 12 octave.</p>'],
[/first note is/,'<h2>Hearing an interval</h2><p>Sing the first note in your head and listen for how far the second one jumps. Tie each size to a song: m2 Jaws, M2 Happy Birthday, m3 Greensleeves, M3 When the Saints, P4 Here Comes the Bride, P5 Star Wars, octave Somewhere Over the Rainbow. Tap the options after answering to compare them.</p>'],
[/Which chord has the degrees/,'<h2>Chords as degrees</h2><p>Major 1-3-5, minor 1-\u266d3-5, diminished 1-\u266d3-\u266d5, augmented 1-3-\u266f5. Look at what happens to the third and the fifth: that is the whole difference between the four chords.</p>'],
[/Which notes make the/,'<h2>Building a triad</h2><p>Stack root, third and fifth. Major is 0-4-7 semitones above the root, minor 0-3-7, diminished 0-3-6, augmented 0-4-8. Find the third first: 4 semitones is major, 3 is minor.</p>'],
[/what is the chord/,'<h2>Chords in a key</h2><p>Stack thirds using only the notes of the scale. In every major key the qualities are I major, ii minor, iii minor, IV major, V major, vi minor and vii\u00b0 diminished. Spell the three notes, then measure the thirds between them.</p>'],
[/What mode do you get/,'<h2>Modes as rotations</h2><p>Start the major scale on its 1st, 2nd, 3rd... note and you get Ionian, Dorian, Phrygian, Lydian, Mixolydian, Aeolian and Locrian, in that order. Same notes, different home.</p>'],
[/same notes as/,'<h2>Finding the parent key</h2><p>Work out which degree of a major scale the mode\u2019s root is (Dorian is the 2nd, Phrygian the 3rd, Lydian the 4th, Mixolydian the 5th, Aeolian the 6th, Locrian the 7th), then count back to that major key.</p>'],
[/Which degrees define/,'<h2>Mode formulas</h2><p>Compare each mode with a major scale on the same root:</p>'+MODES.map(M=>'<p style="margin:2px 0"><b>'+M.n+'</b> '+M.d+'</p>').join('')],
[/Listen to this scale/,'<h2>Hearing a mode</h2><p>First decide whether the 3rd sounds major (bright) or minor (dark). Then listen for the one note that colours it: raised 4th for Lydian, lowered 7th for Mixolydian, raised 6th for Dorian, lowered 2nd for Phrygian.</p>'],
[/Which mode is/,'<h2>Telling modes apart</h2><p>Sort them by colour. Major-sounding: Lydian (\u266f4), Ionian, Mixolydian (\u266d7). Minor-sounding: Dorian (raised 6th), Aeolian, Phrygian (\u266d2), Locrian (\u266d2 and \u266d5).</p>'],[/fret|standard tuning/,'<h2>Notes on the guitar</h2><p>Standard tuning, low to high, is E A D G B E. Each fret is one semitone, so to name a note start from the open string and count up. The low E string is the easiest place to find a root.</p>'],[/Which mode of .* fits/,'<h2>Matching a mode to a chord</h2><p>A mode that shares the chord key will fit it. A minor 7 chord takes Dorian, a dominant 7 takes Mixolydian, and a major 7 takes Ionian or Lydian.</p>']],
tipFor=x=>{const t=x.q.replace(/<[^>]+>/g,''),h=TIPS.find(r=>r[0].test(t));return h?h[1]:MODS[cur].lesson},
THEORY={
intervals:'<h3>Why count semitones</h3><p>Letter names alone mislead: C to E and C to F\u266d are both a kind of 3rd, but they are different sizes. Semitones are exact. From C going up: C\u266f 1, D 2, E\u266d 3, E 4, F 5, F\u266f 6, G 7, A\u266d 8, A 9, B\u266d 10, B 11, C 12.</p><h3>Where the names come from</h3><p>The number counts letters (C D E is a 3rd). The quality gives the exact size: 2nds, 3rds, 6ths and 7ths are major or minor; 4ths, 5ths and octaves are perfect; the tritone splits the octave in half.</p>',
ear:'<h3>Training your ear</h3><p>Choose one anchor song for every interval and sing the first note before the jump. Ascending intervals are the easiest place to start. Short, regular sessions beat one long one.</p><p>Notice the character too: seconds are tense, thirds sound sweet, fourths and fifths sound open and stable, sevenths want to resolve.</p>',
keys:'<h3>Building a major scale</h3><p>Start on any note and climb W-W-H-W-W-W-H. For G major that gives G A B C D E F\u266f: the F\u266f is forced, because the 7th note has to sit a half step under the octave G. This is why every key has its own sharps or flats.</p><h3>Minor and relative keys</h3><p>Natural minor climbs W-H-W-W-H-W-W. A major key and its relative minor share every note: C major and A minor have no sharps or flats, G major and E minor both have one F\u266f. The relative minor is the 6th note of the major scale.</p><h3>On the guitar</h3><p>A scale shape is the same step pattern on every string, shifted along the neck. Learn where the root sits inside a shape and you can move it to any key.</p>',
triads:'<h3>Three notes, four colours</h3><p>A triad is a root, a third and a fifth. The third decides major or minor (4 or 3 semitones above the root). The fifth is usually perfect (7); lower it and you get diminished, raise it and you get augmented.</p><p>Major and minor are stable and make up most of what you will meet. Diminished is tense and wants to resolve; augmented sounds suspended and unresolved.</p>',
harmony:'<h3>One chord per scale note</h3><p>Stack thirds using only the notes of the scale and every degree gets a triad. In major the pattern never changes: I, IV and V are major, ii, iii and vi are minor, and vii\u00b0 is diminished. In C that is C, Dm, Em, F, G, Am, B\u00b0.</p><h3>Why it matters</h3><p>Those chords belong together because they share the scale\u2019s notes, which is why I-IV-V and I-V-vi-IV progressions work in every key.</p>',
modes:'<h3>Rotating the major scale</h3><p>Play C major (C D E F G A B) but make D the home note and you hear D Dorian. Each of the seven rotations is a mode with its own colour. Always compare a mode with the major or minor scale on the same root and notice which notes change.</p><h3>Using them</h3><p>Dorian works over minor chords with a lighter sound, Mixolydian over dominant chords, Lydian over major chords for a floating feel, Phrygian for a dark, Spanish sound.</p>',practice:'<h3>Why practical exercises</h3><p>Knowing a scale or a chord in theory is not the same as finding it under your fingers. These drills join the two: locating notes and roots on the fretboard, and choosing a mode that fits a chord. The hands-on tasks ask you to play, listen, then check yourself.</p>'},
BLURB={intervals:'Distances between notes, counted in semitones.',ear:'Recognising intervals by sound.',keys:'Major, minor and relative scales, and how to spell them.',triads:'Major, minor, diminished and augmented chords.',harmony:'Which chord sits on each note of a key.',modes:'The seven modes as rotations of the major scale.',practice:'Applied drills plus hands-on tasks to play on your instrument.'};

 else if(pq.mic){body='<p class="q">'+pq.q+'</p><p class="hs">'+(pq.hint||'')+'</p>'+(pq.noChips?'':'<div class="chips" id="mChips">'+pq.labels.map((l,i)=>'<span class="chip" data-i="'+i+'">'+T(l)+'</span>').join('')+'</div>')+'<div class="micbox"><div class="micnote" id="mNote">—</div><div class="miccents" id="mCents">'+T('mic.pressstart')+'</div><div class="micbar"><span id="mNeedle"></span></div></div><div class="row"><button class="btn" onclick="micStartSeq()">'+T('btn.start')+'</button>'+(pq.replay?'<button class="btn alt" onclick="hearPrac()">'+T(pq.replay)+'</button>':'')+'<button class="btn alt" onclick="stopMic()">'+T('btn.stop')+'</button><span class="stat" id="mStat">'+T('score',{c:0,t:pq.seq.length})+'</span></div><p class="micro" id="mMsg"></p>'}
 else{body='<p class="q">'+pq.q+'</p><div class="opts'+(pq.wide?' w1':'')+'">'+pq.opts.map((o,i)=>'<button class="'+(pdone?(o==pq.ans?'ok':(o==pdone?'no':'')):'')+'" onclick="'+(pdone?'':'pickPrac('+i+')')+'">'+o+(pdone&&pq.labels?'<br><small>'+pq.labels[o]+'</small>':'')+'</button>').join('')+'</div>'+(pdone?'<div class="fb '+(pdone==pq.ans?'ok':'no')+'"><b>'+(pdone==pq.ans?T('correct'):T('notquite'))+'</b> '+pq.why+(pq.extra?'<div style="margin-top:8px">'+pq.extra+'</div>':'')+'</div>':'')+nx}
 $('pracRun').innerHTML='<button class="btn alt" onclick="closeCat()">\u2190 '+T('btn.back')+'</button><h2 class="ht">'+c.n+'</h2>'+body+'<div class="row"><button class="btn" onclick="nextPrac()">'+T('btn.another')+'</button><span class="stat">'+T('score',{c:pst.c,t:pst.t})+'</span></div>'}
function micFreeBox(){return '<div class="micbox"><div class="micnote" id="mNote">—</div><div class="miccents" id="mCents">'+T('mic.pressstart')+'</div><div class="micbar"><span id="mNeedle"></span></div></div><div class="row"><button class="btn" onclick="micFree()">'+T('btn.start')+'</button><button class="btn alt" onclick="stopMic()">'+T('btn.stop')+'</button></div><p class="micro" id="mMsg"></p>'}
function renderFree(){$('pracRun').innerHTML='<button class="btn alt" onclick="closeCat()">\u2190 '+T('btn.back')+'</button><h2 class="ht">'+T('prac.free')+'</h2><p class="hs">'+T('free.sub')+'</p>'+micFreeBox()}
/* ===== microphone listening ===== */
let mCtx=null,mStream=null,mAn=null,mBuf=null,mRAF=0,mTick=0,micMode=null,mSeq=[],mLabels=[],mI=0,mOk=[],mWrong=0,mLast=null,mStable=0;
function micMsg(t){const e=$('mMsg');if(e)e.innerHTML=t}
async function micOn(){if(typeof navigator==='undefined'||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){micMsg(T('mic.nosupport'));return false}
 micOff();
 try{mStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}catch(e){micMsg(T('mic.blocked'));return false}
 mCtx=mCtx||new (window.AudioContext||window.webkitAudioContext)();
 if(mCtx.state=='suspended')await mCtx.resume();
 const src=mCtx.createMediaStreamSource(mStream);mAn=mCtx.createAnalyser();mAn.fftSize=2048;mBuf=new Float32Array(mAn.fftSize);src.connect(mAn);
 if(typeof requestAnimationFrame!=='undefined')mRAF=requestAnimationFrame(micLoop);
 return true}
function micFree(){micMode='free';mSeq=[];mLabels=[];mI=0;mOk=[];mWrong=0;mLast=null;mStable=0;micOn().then(ok=>{if(ok)micMsg(T('mic.listen'))})}
function micStartSeq(){micMode='seq';mSeq=pq.seq.slice();mLabels=pq.labels.slice();mI=0;mOk=[];mWrong=0;mLast=null;mStable=0;chipUpdate();micOn().then(ok=>{if(ok)micMsg(T('mic.listenSeq'))})}
function hearPrac(){stopMic();mSeq=pq.seq.slice();mLabels=pq.labels.slice();mI=0;mOk=[];mWrong=0;chipUpdate();playSeq(pq.seq);micMsg(T('mic.hear'))}
function micOff(){if(mRAF&&typeof cancelAnimationFrame!=='undefined')cancelAnimationFrame(mRAF);mRAF=0;if(mStream){try{mStream.getTracks().forEach(t=>t.stop())}catch(e){}mStream=null}mAn=null}
function stopMic(){micOff();micMode=null;const n=$('mNote'),c=$('mCents');if(n)n.textContent='—';if(c)c.textContent=T('mic.stopped')}
let mYin=null,mCmnd=null;
function detectPitch(buf,sr){const L=buf.length;
 let rms=0;for(let i=0;i<L;i++)rms+=buf[i]*buf[i];rms=Math.sqrt(rms/L);if(rms<0.008)return 0;
 const tauMax=Math.min(Math.floor(sr/70),L-2);
 if(!mYin||mYin.length<tauMax+1){mYin=new Float32Array(tauMax+1);mCmnd=new Float32Array(tauMax+1)}
 const y=mYin,c=mCmnd;
 for(let tau=1;tau<=tauMax;tau++){let s=0;for(let i=0;i<L-tau;i++){const d=buf[i]-buf[i+tau];s+=d*d}y[tau]=s}
 let run=0;c[0]=1;
 for(let tau=1;tau<=tauMax;tau++){run+=y[tau];c[tau]=run?y[tau]*tau/run:1}
 let tau=-1;const thr=0.12;
 for(let t=2;t<tauMax;t++){if(c[t]<thr){while(t+1<tauMax&&c[t+1]<c[t])t++;tau=t;break}}
 if(tau<0){let m=Infinity;for(let t=2;t<tauMax;t++)if(c[t]<m){m=c[t];tau=t}if(m>0.6)return 0}
 const x0=c[tau-1]||c[tau],x2=c[tau+1]||c[tau],den=x0+x2-2*c[tau];let T=tau;if(den)T=tau-(x2-x0)/(2*den);
 const f=sr/T;return(f>=65&&f<=1500)?f:0}
function micLoop(){if(typeof requestAnimationFrame!=='undefined')mRAF=requestAnimationFrame(micLoop);if(!mAn||!mBuf||!mCtx)return;
 if((mTick=(mTick||0)+1)%2)return;
 mAn.getFloatTimeDomainData(mBuf);const f=detectPitch(mBuf,mCtx.sampleRate);const nEl=$('mNote'),cEl=$('mCents'),nd=$('mNeedle');
 if(!f){if(nEl)nEl.textContent='—';if(cEl)cEl.textContent=T('mic.waiting');mLast=null;mStable=0;return}
 const rf=refHz(),midi=Math.round(69+12*Math.log2(f/rf)),dev=1200*Math.log2(f/(rf*Math.pow(2,(midi-69)/12)));
 if(nEl)nEl.textContent=N[((midi%12)+12)%12]+(Math.floor(midi/12)-1);
 if(cEl)cEl.textContent=(dev>0?'+':'')+dev.toFixed(0)+T('mic.cents')+(Math.abs(dev)<=15?' \u00b7 '+T('mic.intune')+'':'');
 if(nd)nd.style.left=(50+Math.max(-45,Math.min(45,dev*0.9)))+'%';
 if(midi===mLast)mStable++;else{mLast=midi;mStable=1}
 if(micMode==='seq'&&mStable===4)registerNote(midi)}
function chipUpdate(){const c=$('mChips');if(c&&c.querySelectorAll)c.querySelectorAll('.chip').forEach((el,i)=>{el.className='chip'+(mOk[i]?' '+mOk[i]:'')+(i===mI&&mI<mSeq.length?' now':'')});const st=$('mStat');if(st)st.textContent=T('score',{c:mI,t:mSeq.length})}
function registerNote(midi){if(mI>=mSeq.length)return;const p=((midi%12)+12)%12,tgt=((mSeq[mI]%12)+12)%12;
 if(p===tgt){mOk[mI]='ok';mI++;chipUpdate();if(mI>=mSeq.length)finishSeq();return}
 if(!(pq&&pq.strict))for(let j=mI+1;j<mSeq.length;j++)if(((mSeq[j]%12)+12)%12===p){for(let z=mI;z<j;z++)if(!mOk[z])mOk[z]='skip';mOk[j]='ok';mI=j+1;chipUpdate();if(mI>=mSeq.length)finishSeq();return}
 mWrong++;if(!mOk[mI])mOk[mI]='bad';chipUpdate();micMsg(T('mic.wrong',{n:N[p],want:T(mLabels[mI])}))}
function finishSeq(){micMode='done';micMsg((mWrong?(mWrong>1?T('mic.donen',{n:mWrong}):T('mic.done1')):T('mic.done'))+(pq&&pq.doneMsg?'<br>'+pq.doneMsg:''))}
let cur='intervals',st={},q=null,done=false,exPicked=false;
const EXIC={intervals:'🎵',ear:'👂',keys:'🎼',triads:'🎹',harmony:'🔗',modes:'✨'};
const $=id=>document.getElementById(id);
function tabs(){const h=$('nh');
 if(view=='prac'){if(h)h.textContent=T('nav.categories');$('tabs').innerHTML=Object.keys(PRAC).map(k=>'<button class="'+(k==pcat?'on':'')+'" onclick="openCat(\''+k+'\')">'+cn(k)+'</button>').join('');return}
 if(h)h.textContent=T('nav.sections');
 $('tabs').innerHTML=Object.keys(MODS).map(k=>'<button class="'+((exPicked&&k==cur)?'on':'')+'" onclick="go(\''+k+'\')">'+mn(k)+'</button>').join('')}
function drawEx(){const c=$('exCats'),r=$('exRun');if(!c||!r)return;document.body.classList.toggle('navon',exPicked);
 if(exPicked){c.style.display='none';r.style.display=''}
 else{r.style.display='none';c.style.display='';
  c.innerHTML='<h2 class="ht">'+T('ex.title')+'</h2><p class="hs">'+T('ex.sub')+'</p>'+Object.keys(MODS).map(k=>'<button class="pcard" onclick="openEx(\''+k+'\')"><b><span class="ic">'+(EXIC[k]||'🎵')+'</span>'+mn(k)+'</b><span>'+blurb(k)+'</span></button>').join('')}}
function openEx(k){show('ex');go(k)}
function go(k){cur=k;exPicked=true;tabs();document.body.classList.remove('open');$('ttl').textContent=MODS[k].name;next();drawEx()}
function tog(){document.body.classList.toggle('open')}
function next(){q=MODS[cur].gen();done=false;$('lesson').innerHTML=tipFor(q);draw()}
function reveal(){done=true;draw()}
function draw(){if(q.task){$('quiz').innerHTML=`<p class="q">${q.q}</p>${done?`<div class="fb ok"><b>${T('check')}</b> ${q.reveal}</div><div class="row"><button class="btn" onclick="next()">${T('btn.next')}</button><span class="stat">${T('hands')}</span></div>`:`<div class="row"><button class="btn" onclick="reveal()">${T('btn.reveal')}</button><span class="stat">${T('tryfirst')}</span></div>`}`;return}const s=st[cur]||{c:0,t:0};
$('quiz').innerHTML=`<p class="q">${q.q}</p>${q.audio?`<div class="row" style="margin:0 0 12px"><button class="btn" onclick="play(${q.audio[0]},${q.audio[1]},false)">${T('btn.play')}</button><button class="btn alt" onclick="play(${q.audio[0]},${q.audio[1]},true)">${T('btn.together')}</button></div>`:''}
${q.seq?'<div class="row" style="margin:0 0 12px"><button class="btn" onclick="playSeq(['+q.seq+'])">\u25b6 '+T('btn.playscale')+'</button></div>':''}<div class="opts${q.wide?' w1':''}">${q.opts.map((o,i)=>`<button ${done&&!q.labels?'disabled':''} class="${done?(o==q.ans?'ok':(o==done?'no':'')):''}" onclick="${done?'hear('+i+')':'pick('+i+')'}">${o}${done&&q.labels?'<br><small>'+q.labels[o]+(q.pl?' · tap to hear':'')+'</small>':''}</button>`).join('')}</div>
${done?`<div class="fb ${done==q.ans?'ok':'no'}"><b>${done==q.ans?T('correct'):T('notquite')}</b> ${q.why}${q.extra?'<div style="margin-top:8px">'+q.extra+'</div>':''}</div><div class="row"><button class="btn" onclick="next()">${T('btn.nextq')}</button><span class="stat">${T('score',{c:s.c,t:s.t})}</span></div>`:`<div class="row"><span class="stat">${T('score',{c:s.c,t:s.t})}</span></div>`}`}
function pick(i){if(done)return;done=q.opts[i];const s=st[cur]=st[cur]||{c:0,t:0};s.t++;if(done==q.ans)s.c++;record(done==q.ans);draw()}
function hear(i){const p=q.pl&&q.pl[q.opts[i]];if(p)play(p[0],p[1],false)}
const KEY='theorygym.v1',ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let store={days:{},cust:{c:0,t:0,since:ds(new Date())}},ses={c:0,t:0},canSave=true;
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.days&&s.cust){store=s;if(!store.cust.since)store.cust.since=ds(new Date())}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));canSave=true}catch(e){canSave=false}}
function record(ok){const d=ds(new Date()),b=store.days[d]=store.days[d]||{c:0,t:0};b.t++;store.cust.t++;ses.t++;if(ok){b.c++;store.cust.c++;ses.c++}
const cut=ds(new Date(Date.now()-60*864e5));Object.keys(store.days).forEach(k=>{if(k<cut)delete store.days[k]});save();renderStats()}
function month(){const cut=ds(new Date(Date.now()-29*864e5));let c=0,t=0;Object.entries(store.days).forEach(([k,v])=>{if(k>=cut){c+=v.c;t+=v.t}});return{c,t}}
const pct=(c,t)=>t?Math.round(100*c/t)+'%':'–';
const box=(l,c,t)=>'<div style="text-align:center"><div style="font:12px system-ui;color:var(--mut)">'+l+'</div><div class="big">'+pct(c,t)+'</div><div style="font:12px system-ui;color:var(--mut)">'+c+' / '+t+'</div></div>';
function renderStats(){const m=month();$('stats').innerHTML='<div class="sg">'+box(T('stat.session'),ses.c,ses.t)+box(T('stat.month'),m.c,m.t)+box(T('stat.since'),store.cust.c,store.cust.t)+'</div><div class="row"><span class="stat" style="margin-left:0">'+T('stat.sinceV',{d:store.cust.since})+'</span><button class="btn alt" style="margin-left:auto" onclick="resetCustom()">'+T('stat.reset')+'</button></div>'+(canSave?'':'<p style="font:12px system-ui;color:var(--mut);margin:8px 0 0">'+T('stat.nosave')+'</p>')}
function resetCustom(){store.cust={c:0,t:0,since:ds(new Date())};save();renderStats()}
load();applySet();drawHome();renderStats();go('intervals');show('home');
</script></body></html>
