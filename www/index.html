"l.intervals":`<h2>Intervalos: la distancia entre dos notas</h2><p>Un intervalo se mide en <b>semitonos</b> (el paso más pequeño en un piano, de una tecla a la siguiente). Cada intervalo tiene nombre porque cada uno tiene su propio carácter. Conocerlos te permite leer melodías, construir acordes y ver patrones en lugar de memorizar notas.</p><details><summary>Chuleta</summary><p>{cheat}</p></details>`,
"l.ear":`<h2>Oír los intervalos</h2><p>La teoría solo sirve si la puedes oír. Cada intervalo tiene un sonido propio. El truco es asociar cada uno a una canción que ya conozcas, para reconocer la <i>forma</i> del salto y no las notas exactas.</p><p>Te damos la primera nota. Dale a reproducir (con auriculares es más fácil) y elige el intervalo. Al responder, cada opción muestra las notas que habría implicado (primera nota → segunda nota) y puedes tocar cualquiera para oírla.</p>`,
"l.scales":`<h2>La escala mayor</h2><p>Todas las escalas mayores usan el mismo patrón de pasos: <b>tono, tono, semitono, tono, tono, tono, semitono</b> (un tono = 2 semitonos, un semitono = 1). Empieza en cualquier nota, aplica el patrón y obtienes esa tonalidad. Los sostenidos y bemoles de una tonalidad no son aleatorios: los impone el patrón.</p><details><summary>Por qué importa</summary><p>Como el patrón es fijo, la escala suena «igual» en todas las tonalidades. Aprende el patrón una vez y podrás deducir cualquier armadura.</p></details>`,
"l.minor":`<h2>La escala menor natural</h2><p>El patrón de la menor natural es <b>tono, semitono, tono, tono, semitono, tono, tono</b>. Frente a la escala mayor sobre la misma tónica, la 3ª, la 6ª y la 7ª están un semitono más bajas (♭3, ♭6, ♭7). Esa tercera bajada es la que da a la menor su color más oscuro.</p><details><summary>Menor armónica y melódica</summary><p>A menudo los compositores suben la 7ª (menor armónica) para crear más atracción hacia la tónica. Este entrenador usa la menor natural.</p></details>`,
"l.relative":`<h2>Relativos mayor y menor</h2><p>Cada tonalidad mayor comparte todas sus notas con una tonalidad menor, su <b>relativo menor</b>. El relativo menor empieza en la <b>6ª nota</b> de la escala mayor (3 semitonos por debajo de la tónica mayor). Al revés, el relativo mayor de una tonalidad menor empieza en la <b>3ª nota</b> de la escala menor (3 semitonos por encima).</p><p>Ejemplo: do mayor y la menor usan exactamente las mismas notas, sin sostenidos ni bemoles. Suenan distinto solo porque cambia la nota de reposo.</p>`,
"l.triads":`<h2>Construir tríadas</h2><p>Una tríada son tres notas superpuestas en terceras: fundamental, tercera y quinta. El tamaño de esas terceras fija la calidad:</p><p><b>{vmaj}</b> 0-4-7 · <b>{vmin}</b> 0-3-7 · <b>{vdim}</b> 0-3-6 · <b>{vaug}</b> 0-4-8 <span style="color:var(--mut)">(semitonos sobre la fundamental)</span></p><p>Los mismos acordes como <b>grados de la escala</b> (contados sobre una escala mayor desde la fundamental): <b>{vmaj}</b> 1 – 3 – 5 · <b>{vmin}</b> 1 – ♭3 – 5 · <b>{vdim}</b> 1 – ♭3 – ♭5 · <b>{vaug}</b> 1 – 3 – ♯5. Aquí 1 es la fundamental, 3 la tercera y 5 la quinta; ♭ baja un semitono y ♯ lo sube.</p><p>Solo cambian la tercera y la quinta, y ese pequeño cambio es toda la diferencia entre brillante, triste, tenso e irresuelto.</p>`,
"l.harmony":`<h2>¿Qué acorde vive dónde?</h2><p>Superpón terceras usando solo las notas de la escala y tendrás una tríada sobre cada grado. En cualquier tonalidad mayor las calidades son siempre las mismas: <b>I mayor · ii menor · iii menor · IV mayor · V mayor · vi menor · vii° disminuido</b>.</p><p>Así saben los compositores qué acordes «encajan» juntos, y por eso I–IV–V–vi funciona en todas las tonalidades.</p>`,
"l.modes":`<h2>Los siete modos</h2><p>Un modo es una escala mayor empezada desde otra nota. Toma do mayor (do re mi fa sol la si) y empieza en re: eso es re dórico. Mismas notas, otra tónica, otro sonido. La forma más fácil de pensar en cada modo es cómo se diferencia de la escala mayor sobre la misma tónica.</p><details><summary>Fórmulas y carácter</summary>{list}</details>`,
"l.keys":`<h2>Escalas: mayor, menor y relativas</h2><p>Una tonalidad es una nota de reposo más la escala construida sobre ella. <b>Mayor:</b> T-T-S-T-T-T-S. <b>Menor natural:</b> T-S-T-T-S-T-T. Cada tonalidad mayor comparte sus notas con un relativo menor (la 6ª nota de la escala mayor).</p><p>Esta sección mezcla todo sobre las notas de una tonalidad: la enésima nota de una escala, el conjunto completo de notas, diagramas del mástil y relativas.</p>`,
"th.intervals":`<h3>Por qué contar semitonos</h3><p>Los nombres de las notas engañan: de do a mi y de do a fa♭ hay una tercera en ambos casos, pero de distinto tamaño. Los semitonos son exactos. Desde do hacia arriba: do♯ 1, re 2, mi♭ 3, mi 4, fa 5, fa♯ 6, sol 7, la♭ 8, la 9, si♭ 10, si 11, do 12.</p><h3>De dónde vienen los nombres</h3><p>El número cuenta letras (do re mi es una tercera). La calidad da el tamaño exacto: las 2ª, 3ª, 6ª y 7ª son mayores o menores; las 4ª, 5ª y la octava son justas; el tritono parte la octava en dos.</p>`,
"th.ear":`<h3>Entrenar el oído</h3><p>Elige una canción de referencia para cada intervalo y canta la primera nota antes del salto. Los intervalos ascendentes son el punto de partida más fácil. Sesiones cortas y frecuentes superan a una larga.</p><p>Fíjate también en el carácter: las segundas son tensas, las terceras suenan dulces, las cuartas y quintas suenan abiertas y estables, y las séptimas piden resolver.</p>`,
"th.keys":`<h3>Construir una escala mayor</h3><p>Empieza en cualquier nota y sube T-T-S-T-T-T-S. Para sol mayor sale sol la si do re mi fa♯: el fa♯ es obligatorio, porque la 7ª nota debe quedar a un semitono por debajo del sol de la octava. Por eso cada tonalidad tiene sus propios sostenidos o bemoles.</p><h3>Menor y relativas</h3><p>La menor natural sube T-S-T-T-S-T-T. Una tonalidad mayor y su relativo menor comparten todas las notas: do mayor y la menor no tienen sostenidos ni bemoles; sol mayor y mi menor tienen un fa♯. El relativo menor es la 6ª nota de la escala mayor.</p><h3>En la guitarra</h3><p>Una forma de escala es el mismo patrón de pasos en cada cuerda, desplazado a lo largo del mástil. Aprende dónde está la tónica dentro de la forma y podrás moverla a cualquier tonalidad.</p>`,
"th.triads":`<h3>Tres notas, cuatro colores</h3><p>Una tríada es fundamental, tercera y quinta. La tercera decide mayor o menor (4 o 3 semitonos sobre la fundamental). La quinta suele ser justa (7); si la bajas, tienes disminuido, y si la subes, aumentado.</p><p>Mayor y menor son estables y son la mayoría de lo que encontrarás. El disminuido es tenso y quiere resolver; el aumentado suena suspendido y sin resolver.</p>`,
"th.harmony":`<h3>Un acorde por nota de la escala</h3><p>Superpón terceras usando solo las notas de la escala y cada grado recibe una tríada. En mayor el patrón nunca cambia: I, IV y V son mayores; ii, iii y vi son menores; y vii° es disminuido. En do eso es do, rem, mim, fa, sol, lam, si°.</p><h3>Por qué importa</h3><p>Esos acordes encajan porque comparten las notas de la escala, y por eso las progresiones I-IV-V y I-V-vi-IV funcionan en todas las tonalidades.</p>`,
"th.modes":`<h3>Rotar la escala mayor</h3><p>Toca do mayor (do re mi fa sol la si) pero haz que re sea la tónica y oirás re dórico. Cada una de las siete rotaciones es un modo con su propio color. Compara siempre un modo con la escala mayor o menor sobre la misma tónica y fíjate en qué notas cambian.</p><h3>Cómo usarlos</h3><p>El dórico funciona sobre acordes menores con un sonido más ligero; el mixolidio sobre acordes de dominante; el lidio sobre acordes mayores para un aire flotante; el frigio para un sonido oscuro y español.</p>`,
"th.practice":`<h3>Por qué ejercicios prácticos</h3><p>Saber una escala o un acorde en teoría no es lo mismo que encontrarlo con los dedos. Estos ejercicios unen las dos cosas: localizar notas y tónicas en el mástil y elegir un modo que encaje con un acorde. Las tareas te piden tocar, escuchar y comprobarte.</p>`,
"blurb.practice":`Ejercicios aplicados y tareas para tocar con tu instrumento.`,
"tip.rel.min":`<h2>Relativo menor</h2><p>El relativo menor empieza en la <b>6ª nota</b> de la escala mayor y usa exactamente las mismas notas. Escribe la escala mayor, cuenta hasta la 6ª nota y esa es tu respuesta.</p>`,
"tip.rel.maj":`<h2>Relativo mayor</h2><p>El relativo mayor empieza en la <b>3ª nota</b> de la escala menor, 3 semitonos por encima de su tónica. Escribe la escala menor y toma la 3ª nota.</p>`,
"tip.diagram.scale":`<h2>Leer un diagrama del mástil</h2><p>La línea de abajo es la 6ª cuerda (mi grave), la de arriba la 1ª (mi agudo), y los números de debajo son los trastes (0 es la cuerda al aire). Cada punto es una nota de la escala y los puntos destacados son la tónica.</p><p>Localiza primero la tónica destacada y comprueba después las notas de alrededor con el patrón: la escala mayor tiene la 3ª, 6ª y 7ª naturales; la menor, bajadas.</p>`,
"tip.diagram.mode":`<h2>Un modo en el mástil</h2><p>Localiza la tónica destacada y busca la nota que da carácter al modo: la ♭2 del frigio, la ♯4 del lidio, la ♭7 del mixolidio. Todos los diagramas incorrectos comparten la misma tónica, así que solo esas notas características los distinguen.</p>`,
"tip.scale.notes":`<h2>Escribir una escala</h2><p>Usa cada nombre de nota una vez, en orden, y añade # o ♭ solo donde el patrón lo exija. Mayor es T-T-S-T-T-T-S y menor T-S-T-T-S-T-T. Las respuestas incorrectas suelen cambiar una o dos de la 3ª, 6ª y 7ª: míralas primero.</p>`,
"tip.mode.notes":`<h2>Escribir un modo</h2><p>Toma la escala mayor madre y empieza en la tónica del modo. Las opciones incorrectas suelen tener una o dos notas desplazadas un semitono: compara cada opción con la fórmula del modo.</p>`,
"tip.sc.major":`<h2>Patrón de la escala mayor</h2><p>Cuenta desde la tónica con <b>T-T-S-T-T-T-S</b> (T = 2 semitonos, S = 1). Cada nombre de nota aparece una vez, así que el sostenido o bemol que encuentres es el que impone el patrón.</p>`,
"tip.sc.minor":`<h2>Patrón de la menor natural</h2><p>Cuenta desde la tónica con <b>T-S-T-T-S-T-T</b>. Frente a la escala mayor sobre la misma tónica, la 3ª, la 6ª y la 7ª bajan un semitono.</p>`,
"tip.iv.semi":`<h2>Contar un intervalo</h2><p>Cuenta los semitonos entre las dos notas (todas las teclas del piano, también las negras) y busca el número: {cheat}.</p>`,
"tip.iv.ear":`<h2>Oír un intervalo</h2><p>Canta la primera nota mentalmente y escucha cuánto salta la segunda. Asocia cada tamaño a una canción: 2ª menor Tiburón, 2ª mayor Cumpleaños feliz, 3ª menor Greensleeves, 3ª mayor When the Saints, 4ª justa La marcha nupcial, 5ª justa Star Wars, octava Somewhere Over the Rainbow. Toca las opciones al responder para compararlas.</p>`,
"tip.tri.deg":`<h2>Acordes como grados</h2><p>Mayor 1-3-5, menor 1-♭3-5, disminuido 1-♭3-♭5, aumentado 1-3-♯5. Fíjate en lo que pasa con la tercera y la quinta: ahí está toda la diferencia entre los cuatro acordes.</p>`,
"tip.tri.notes":`<h2>Construir una tríada</h2><p>Superpón fundamental, tercera y quinta. Mayor es 0-4-7 semitonos sobre la fundamental, menor 0-3-7, disminuido 0-3-6 y aumentado 0-4-8. Encuentra primero la tercera: 4 semitonos es mayor, 3 es menor.</p>`,
"tip.harm":`<h2>Acordes de una tonalidad</h2><p>Superpón terceras usando solo las notas de la escala. En cualquier tonalidad mayor las calidades son I mayor, ii menor, iii menor, IV mayor, V mayor, vi menor y vii° disminuido. Escribe las tres notas y mide las terceras entre ellas.</p>`,
"tip.mode.deg":`<h2>Los modos como rotaciones</h2><p>Empieza la escala mayor en su 1ª, 2ª, 3ª... nota y obtienes {modes}, en ese orden. Mismas notas, distinta tónica.</p>`,
"tip.mode.parent":`<h2>Encontrar la tonalidad madre</h2><p>Averigua qué grado de una escala mayor es la tónica del modo (dórico es el 2º, frigio el 3º, lidio el 4º, mixolidio el 5º, eólico el 6º, locrio el 7º) y cuenta hasta esa tonalidad mayor.</p>`,
"tip.mode.formula":`<h2>Fórmulas de los modos</h2><p>Compara cada modo con una escala mayor sobre la misma tónica:</p>{list}`,
"tip.mode.ear":`<h2>Oír un modo</h2><p>Primero decide si la 3ª suena mayor (brillante) o menor (oscura). Después escucha la nota que lo colorea: 4ª elevada en el lidio, 7ª bajada en el mixolidio, 6ª elevada en el dórico, 2ª bajada en el frigio.</p>`,
"tip.mode.which":`<h2>Distinguir los modos</h2><p>Ordénalos por color. Suenan mayores: lidio (♯4), jónico, mixolidio (♭7). Suenan menores: dórico (6ª elevada), eólico, frigio (♭2), locrio (♭2 y ♭5).</p>`
},it:{
"l.intervals":`<h2>Intervalli: la distanza tra due note</h2><p>Un intervallo si misura in <b>semitoni</b> (il passo più piccolo al pianoforte, da un tasto all’altro). Ogni intervallo ha un nome perché ha un carattere proprio. Conoscerli ti permette di leggere melodie, costruire accordi e riconoscere schemi invece di imparare a memoria le note.</p><details><summary>Promemoria</summary><p>{cheat}</p></details>`,
"l.ear":`<h2>Sentire gli intervalli</h2><p>La teoria serve solo se la sai sentire. Ogni intervallo ha un suono distinto. Il trucco è legare ognuno a una canzone che già conosci, così riconosci la <i>forma</i> del salto invece delle altezze esatte.</p><p>Ti diamo la prima nota. Premi riproduci (con le cuffie è più facile), poi scegli l’intervallo. Dopo la risposta ogni opzione mostra le note che avrebbe implicato (prima nota → seconda nota) e puoi toccarne una per ascoltarla.</p>`,
"l.scales":`<h2>La scala maggiore</h2><p>Tutte le scale maggiori usano lo stesso schema di passi: <b>tono, tono, semitono, tono, tono, tono, semitono</b> (un tono = 2 semitoni, un semitono = 1). Parti da una nota qualsiasi, applica lo schema e ottieni quella tonalità. I diesis e i bemolli di una tonalità non sono casuali: li impone lo schema.</p><details><summary>Perché conta</summary><p>Poiché lo schema è fisso, la scala suona «uguale» in ogni tonalità. Impara lo schema una volta e potrai ricavare qualsiasi armatura di chiave.</p></details>`,
"l.minor":`<h2>La scala minore naturale</h2><p>Lo schema della minore naturale è <b>tono, semitono, tono, tono, semitono, tono, tono</b>. Rispetto alla scala maggiore sulla stessa tonica, la 3ª, la 6ª e la 7ª sono più basse di un semitono (♭3, ♭6, ♭7). È quella terza abbassata a dare al minore il suo colore più scuro.</p><details><summary>Minore armonica e melodica</summary><p>Spesso i compositori alzano la 7ª (minore armonica) per creare più attrazione verso la tonica. Questo trainer usa la minore naturale.</p></details>`,
"l.relative":`<h2>Relativa maggiore e minore</h2><p>Ogni tonalità maggiore condivide tutte le sue note con una tonalità minore, la sua <b>relativa minore</b>. La relativa minore parte dalla <b>6ª nota</b> della scala maggiore (3 semitoni sotto la tonica maggiore). Al contrario, la relativa maggiore di una tonalità minore parte dalla <b>3ª nota</b> della scala minore (3 semitoni sopra).</p><p>Esempio: do maggiore e la minore usano esattamente le stesse note, senza diesis né bemolli. Suonano diverse solo perché cambia la nota di riposo.</p>`,
"l.triads":`<h2>Costruire le triadi</h2><p>Una triade è formata da tre note sovrapposte per terze: fondamentale, terza e quinta. La grandezza di quelle terze determina la qualità:</p><p><b>{vmaj}</b> 0-4-7 · <b>{vmin}</b> 0-3-7 · <b>{vdim}</b> 0-3-6 · <b>{vaug}</b> 0-4-8 <span style="color:var(--mut)">(semitoni sopra la fondamentale)</span></p><p>Gli stessi accordi come <b>gradi della scala</b> (contati su una scala maggiore dalla fondamentale): <b>{vmaj}</b> 1 – 3 – 5 · <b>{vmin}</b> 1 – ♭3 – 5 · <b>{vdim}</b> 1 – ♭3 – ♭5 · <b>{vaug}</b> 1 – 3 – ♯5. Qui 1 è la fondamentale, 3 la terza, 5 la quinta; ♭ abbassa di un semitono e ♯ alza.</p><p>Cambiano solo la terza e la quinta, e quel piccolo spostamento è tutta la differenza tra brillante, triste, teso e irrisolto.</p>`,
"l.harmony":`<h2>Quale accordo vive dove?</h2><p>Sovrapponi le terze usando solo le note della scala e ottieni una triade su ogni grado. In ogni tonalità maggiore le qualità sono sempre le stesse: <b>I maggiore · ii minore · iii minore · IV maggiore · V maggiore · vi minore · vii° diminuito</b>.</p><p>È così che i compositori sanno quali accordi «stanno insieme», e perché I–IV–V–vi funziona in ogni tonalità.</p>`,
"l.modes":`<h2>I sette modi</h2><p>Un modo è una scala maggiore iniziata da un’altra nota. Prendi do maggiore (do re mi fa sol la si) e parti da re: quello è re dorico. Stesse note, nuova tonica, nuovo suono. Il modo più semplice di pensare a ciascun modo è come differisce dalla scala maggiore sulla stessa tonica.</p><details><summary>Formule e carattere</summary>{list}</details>`,
"l.keys":`<h2>Scala: maggiore, minore e relative</h2><p>Una tonalità è una nota di riposo più la scala costruita su di essa. <b>Maggiore:</b> T-T-S-T-T-T-S. <b>Minore naturale:</b> T-S-T-T-S-T-T. Ogni tonalità maggiore condivide le note con una relativa minore (la 6ª nota della scala maggiore).</p><p>Questa sezione mescola tutto sulle note di una tonalità: l’ennesima nota di una scala, l’insieme completo delle note, diagrammi del manico e relative.</p>`,
"th.intervals":`<h3>Perché contare i semitoni</h3><p>I soli nomi delle note ingannano: da do a mi e da do a fa♭ c’è una terza in entrambi i casi, ma di grandezza diversa. I semitoni sono esatti. Da do verso l’alto: do♯ 1, re 2, mi♭ 3, mi 4, fa 5, fa♯ 6, sol 7, la♭ 8, la 9, si♭ 10, si 11, do 12.</p><h3>Da dove vengono i nomi</h3><p>Il numero conta le lettere (do re mi è una terza). La qualità indica la grandezza esatta: le 2ª, 3ª, 6ª e 7ª sono maggiori o minori; le 4ª, 5ª e l’ottava sono giuste; il tritono divide l’ottava a metà.</p>`,
"th.ear":`<h3>Allenare l’orecchio</h3><p>Scegli una canzone di riferimento per ogni intervallo e canta la prima nota prima del salto. Gli intervalli ascendenti sono il punto di partenza più facile. Sessioni brevi e regolari battono una lunga.</p><p>Nota anche il carattere: le seconde sono tese, le terze suonano dolci, le quarte e le quinte aperte e stabili, le settime vogliono risolvere.</p>`,
"th.keys":`<h3>Costruire una scala maggiore</h3><p>Parti da una nota qualsiasi e sali T-T-S-T-T-T-S. Per sol maggiore viene sol la si do re mi fa♯: il fa♯ è obbligatorio, perché la 7ª nota deve stare un semitono sotto il sol dell’ottava. Per questo ogni tonalità ha i propri diesis o bemolli.</p><h3>Minore e relative</h3><p>La minore naturale sale T-S-T-T-S-T-T. Una tonalità maggiore e la sua relativa minore condividono tutte le note: do maggiore e la minore non hanno diesis né bemolli; sol maggiore e mi minore hanno un fa♯. La relativa minore è la 6ª nota della scala maggiore.</p><h3>Alla chitarra</h3><p>Una forma di scala è lo stesso schema di passi su ogni corda, spostato lungo il manico. Impara dove sta la tonica nella forma e potrai spostarla in ogni tonalità.</p>`,
"th.triads":`<h3>Tre note, quattro colori</h3><p>Una triade è fondamentale, terza e quinta. La terza decide maggiore o minore (4 o 3 semitoni sopra la fondamentale). La quinta di solito è giusta (7); abbassala e ottieni il diminuito, alzala e ottieni l’aumentato.</p><p>Maggiore e minore sono stabili e costituiscono quasi tutto ciò che incontrerai. Il diminuito è teso e vuole risolvere; l’aumentato suona sospeso e irrisolto.</p>`,
"th.harmony":`<h3>Un accordo per ogni nota della scala</h3><p>Sovrapponi le terze usando solo le note della scala e ogni grado riceve una triade. In maggiore lo schema non cambia mai: I, IV e V sono maggiori; ii, iii e vi minori; vii° diminuito. In do sono do, rem, mim, fa, sol, lam, si°.</p><h3>Perché conta</h3><p>Quegli accordi stanno bene insieme perché condividono le note della scala: è per questo che le progressioni I-IV-V e I-V-vi-IV funzionano in ogni tonalità.</p>`,
"th.modes":`<h3>Ruotare la scala maggiore</h3><p>Suona do maggiore (do re mi fa sol la si) ma prendi re come tonica e sentirai re dorico. Ognuna delle sette rotazioni è un modo con il suo colore. Confronta sempre un modo con la scala maggiore o minore sulla stessa tonica e nota quali note cambiano.</p><h3>Come usarli</h3><p>Il dorico funziona su accordi minori con un suono più leggero, il misolidio sugli accordi di dominante, il lidio sugli accordi maggiori per un’atmosfera sospesa, il frigio per un suono scuro e spagnolo.</p>`,
"th.practice":`<h3>Perché gli esercizi pratici</h3><p>Conoscere una scala o un accordo in teoria non è come trovarlo sotto le dita. Questi esercizi uniscono le due cose: individuare note e toniche sul manico e scegliere un modo che si adatta a un accordo. Le attività ti chiedono di suonare, ascoltare e verificarti.</p>`,
"blurb.practice":`Esercizi applicati e attività da suonare sul tuo strumento.`,
"tip.rel.min":`<h2>Relativa minore</h2><p>La relativa minore parte dalla <b>6ª nota</b> della scala maggiore e usa esattamente le stesse note. Scrivi la scala maggiore, conta fino alla 6ª nota ed è la tua risposta.</p>`,
"tip.rel.maj":`<h2>Relativa maggiore</h2><p>La relativa maggiore parte dalla <b>3ª nota</b> della scala minore, 3 semitoni sopra la sua tonica. Scrivi la scala minore e prendi la 3ª nota.</p>`,
"tip.diagram.scale":`<h2>Leggere un diagramma del manico</h2><p>La riga in basso è la 6ª corda (mi grave), quella in alto la 1ª (mi acuto), e i numeri sotto sono i tasti (0 è la corda a vuoto). Ogni punto è una nota della scala e i punti evidenziati sono la tonica.</p><p>Trova prima la tonica evidenziata e controlla poi le note intorno con lo schema: la maggiore ha 3ª, 6ª e 7ª naturali, la minore le ha abbassate.</p>`,
"tip.diagram.mode":`<h2>Un modo sul manico</h2><p>Individua la tonica evidenziata e cerca la nota che dà carattere al modo: la ♭2 del frigio, la ♯4 del lidio, la ♭7 del misolidio. Tutti i diagrammi sbagliati hanno la stessa tonica, quindi solo quelle note caratteristiche li distinguono.</p>`,
"tip.scale.notes":`<h2>Scrivere una scala</h2><p>Usa ogni nome di nota una volta, in ordine, e aggiungi # o ♭ solo dove lo schema lo richiede. Maggiore è T-T-S-T-T-T-S, minore T-S-T-T-S-T-T. Le risposte sbagliate di solito cambiano una o due tra 3ª, 6ª e 7ª: controlla prima quelle.</p>`,
"tip.mode.notes":`<h2>Scrivere un modo</h2><p>Prendi la scala maggiore madre e parti dalla tonica del modo. Le opzioni sbagliate di solito hanno una o due note spostate di un semitono: confronta ogni opzione con la formula del modo.</p>`,
"tip.sc.major":`<h2>Schema della scala maggiore</h2><p>Conta dalla tonica con <b>T-T-S-T-T-T-S</b> (T = 2 semitoni, S = 1). Ogni nome di nota compare una volta, quindi il diesis o il bemolle che incontri è quello imposto dallo schema.</p>`,
"tip.sc.minor":`<h2>Schema della minore naturale</h2><p>Conta dalla tonica con <b>T-S-T-T-S-T-T</b>. Rispetto alla scala maggiore sulla stessa tonica, la 3ª, la 6ª e la 7ª scendono di un semitono.</p>`,
"tip.iv.semi":`<h2>Contare un intervallo</h2><p>Conta i semitoni tra le due note (tutti i tasti del pianoforte, anche i neri) e cerca il numero: {cheat}.</p>`,
"tip.iv.ear":`<h2>Sentire un intervallo</h2><p>Canta la prima nota con la mente e ascolta quanto salta la seconda. Lega ogni grandezza a una canzone: 2ª minore Lo squalo, 2ª maggiore Tanti auguri, 3ª minore Greensleeves, 3ª maggiore When the Saints, 4ª giusta La marcia nuziale, 5ª giusta Star Wars, ottava Somewhere Over the Rainbow. Dopo la risposta tocca le opzioni per confrontarle.</p>`,
"tip.tri.deg":`<h2>Accordi come gradi</h2><p>Maggiore 1-3-5, minore 1-♭3-5, diminuito 1-♭3-♭5, aumentato 1-3-♯5. Guarda cosa succede alla terza e alla quinta: è tutta la differenza tra i quattro accordi.</p>`,
"tip.tri.notes":`<h2>Costruire una triade</h2><p>Sovrapponi fondamentale, terza e quinta. Maggiore è 0-4-7 semitoni sopra la fondamentale, minore 0-3-7, diminuito 0-3-6, aumentato 0-4-8. Trova prima la terza: 4 semitoni è maggiore, 3 è minore.</p>`,
"tip.harm":`<h2>Accordi di una tonalità</h2><p>Sovrapponi le terze usando solo le note della scala. In ogni tonalità maggiore le qualità sono I maggiore, ii minore, iii minore, IV maggiore, V maggiore, vi minore e vii° diminuito. Scrivi le tre note e misura le terze tra loro.</p>`,
"tip.mode.deg":`<h2>I modi come rotazioni</h2><p>Inizia la scala maggiore dalla sua 1ª, 2ª, 3ª... nota e ottieni {modes}, in quest’ordine. Stesse note, tonica diversa.</p>`,
"tip.mode.parent":`<h2>Trovare la tonalità madre</h2><p>Capisci quale grado di una scala maggiore è la tonica del modo (dorico è il 2º, frigio il 3º, lidio il 4º, misolidio il 5º, eolico il 6º, locrio il 7º) e conta fino a quella tonalità maggiore.</p>`,
"tip.mode.formula":`<h2>Formule dei modi</h2><p>Confronta ogni modo con una scala maggiore sulla stessa tonica:</p>{list}`,
"tip.mode.ear":`<h2>Sentire un modo</h2><p>Prima decidi se la 3ª suona maggiore (brillante) o minore (scura). Poi ascolta la nota che lo colora: 4ª alzata nel lidio, 7ª abbassata nel misolidio, 6ª alzata nel dorico, 2ª abbassata nel frigio.</p>`,
"tip.mode.which":`<h2>Distinguere i modi</h2><p>Ordinali per colore. Suonano maggiori: lidio (♯4), ionico, misolidio (♭7). Suonano minori: dorico (6ª alzata), eolico, frigio (♭2), locrio (♭2 e ♭5).</p>`

"l.intervals":`<h2>Intervalos: a distância entre duas notas</h2><p>Um intervalo mede-se em <b>semitons</b> (o passo mais pequeno no piano, de uma tecla para a seguinte). Cada intervalo tem nome porque tem o seu próprio caráter. Conhecê-los permite-te ler melodias, construir acordes e ver padrões em vez de decorar notas.</p><details><summary>Cábula</summary><p>{cheat}</p></details>`,
"l.ear":`<h2>Ouvir os intervalos</h2><p>A teoria só serve se a consegues ouvir. Cada intervalo tem um som próprio. O truque é ligar cada um a uma música que já conheces, para reconheceres a <i>forma</i> do salto e não as alturas exatas.</p><p>É-te dada a primeira nota. Carrega em reproduzir (com auscultadores é mais fácil) e escolhe o intervalo. Depois de responderes, cada opção mostra as notas que teria implicado (primeira nota → segunda nota) e podes tocar em qualquer uma para a ouvir.</p>`,
"l.scales":`<h2>A escala maior</h2><p>Todas as escalas maiores usam o mesmo padrão de passos: <b>tom, tom, semitom, tom, tom, tom, semitom</b> (um tom = 2 semitons, um semitom = 1). Começa em qualquer nota, aplica o padrão e obténs essa tonalidade. Os sustenidos e bemóis de uma tonalidade não são aleatórios: são impostos pelo padrão.</p><details><summary>Porque é importante</summary><p>Como o padrão é fixo, a escala soa «igual» em todas as tonalidades. Aprende o padrão uma vez e podes deduzir qualquer armadura.</p></details>`,
"l.minor":`<h2>A escala menor natural</h2><p>O padrão da menor natural é <b>tom, semitom, tom, tom, semitom, tom, tom</b>. Em relação à escala maior sobre a mesma tónica, a 3ª, a 6ª e a 7ª estão um semitom mais baixas (♭3, ♭6, ♭7). É essa terça baixada que dá à menor a sua cor mais escura.</p><details><summary>Menor harmónica e melódica</summary><p>Muitas vezes os compositores sobem a 7ª (menor harmónica) para criar mais atração para a tónica. Este treinador usa a menor natural.</p></details>`,
"l.relative":`<h2>Relativas maior e menor</h2><p>Cada tonalidade maior partilha todas as suas notas com uma tonalidade menor, a sua <b>relativa menor</b>. A relativa menor começa na <b>6ª nota</b> da escala maior (3 semitons abaixo da tónica maior). Ao contrário, a relativa maior de uma tonalidade menor começa na <b>3ª nota</b> da escala menor (3 semitons acima).</p><p>Exemplo: dó maior e lá menor usam exatamente as mesmas notas, sem sustenidos nem bemóis. Soam diferente só porque muda a nota de repouso.</p>`,
"l.triads":`<h2>Construir tríades</h2><p>Uma tríade são três notas sobrepostas em terças: fundamental, terça e quinta. O tamanho dessas terças define a qualidade:</p><p><b>{vmaj}</b> 0-4-7 · <b>{vmin}</b> 0-3-7 · <b>{vdim}</b> 0-3-6 · <b>{vaug}</b> 0-4-8 <span style="color:var(--mut)">(semitons acima da fundamental)</span></p><p>Os mesmos acordes como <b>graus da escala</b> (contados sobre uma escala maior a partir da fundamental): <b>{vmaj}</b> 1 – 3 – 5 · <b>{vmin}</b> 1 – ♭3 – 5 · <b>{vdim}</b> 1 – ♭3 – ♭5 · <b>{vaug}</b> 1 – 3 – ♯5. Aqui 1 é a fundamental, 3 a terça e 5 a quinta; ♭ baixa um semitom e ♯ sobe.</p><p>Só mudam a terça e a quinta, e esse pequeno desvio é toda a diferença entre brilhante, triste, tenso e por resolver.</p>`,
"l.harmony":`<h2>Que acorde vive onde?</h2><p>Sobrepõe terças usando só as notas da escala e tens uma tríade em cada grau. Em qualquer tonalidade maior as qualidades são sempre as mesmas: <b>I maior · ii menor · iii menor · IV maior · V maior · vi menor · vii° diminuto</b>.</p><p>É assim que os compositores sabem que acordes «combinam», e porque I–IV–V–vi funciona em todas as tonalidades.</p>`,
"l.modes":`<h2>Os sete modos</h2><p>Um modo é uma escala maior começada noutra nota. Toma dó maior (dó ré mi fá sol lá si) e começa em ré: isso é ré dórico. Mesmas notas, nova tónica, novo som. A forma mais simples de pensar em cada modo é como ele difere da escala maior sobre a mesma tónica.</p><details><summary>Fórmulas e caráter</summary>{list}</details>`,
"l.keys":`<h2>Escalas: maior, menor e relativas</h2><p>Uma tonalidade é uma nota de repouso mais a escala construída sobre ela. <b>Maior:</b> T-T-S-T-T-T-S. <b>Menor natural:</b> T-S-T-T-S-T-T. Cada tonalidade maior partilha as notas com uma relativa menor (a 6ª nota da escala maior).</p><p>Esta secção mistura tudo sobre as notas de uma tonalidade: a enésima nota de uma escala, o conjunto completo de notas, diagramas do braço e relativas.</p>`,
"th.intervals":`<h3>Porquê contar semitons</h3><p>Os nomes das notas enganam: de dó a mi e de dó a fá♭ há uma terça em ambos os casos, mas de tamanho diferente. Os semitons são exatos. De dó para cima: dó♯ 1, ré 2, mi♭ 3, mi 4, fá 5, fá♯ 6, sol 7, lá♭ 8, lá 9, si♭ 10, si 11, dó 12.</p><h3>De onde vêm os nomes</h3><p>O número conta as letras (dó ré mi é uma terça). A qualidade dá o tamanho exato: as 2ª, 3ª, 6ª e 7ª são maiores ou menores; as 4ª, 5ª e a oitava são justas; o trítono divide a oitava ao meio.</p>`,
"th.ear":`<h3>Treinar o ouvido</h3><p>Escolhe uma música de referência para cada intervalo e canta a primeira nota antes do salto. Os intervalos ascendentes são o ponto de partida mais fácil. Sessões curtas e regulares superam uma longa.</p><p>Repara também no caráter: as segundas são tensas, as terças soam doces, as quartas e quintas abertas e estáveis, as sétimas pedem resolução.</p>`,
"th.keys":`<h3>Construir uma escala maior</h3><p>Começa em qualquer nota e sobe T-T-S-T-T-T-S. Para sol maior sai sol lá si dó ré mi fá♯: o fá♯ é obrigatório, porque a 7ª nota tem de ficar um semitom abaixo do sol da oitava. É por isso que cada tonalidade tem os seus sustenidos ou bemóis.</p><h3>Menor e relativas</h3><p>A menor natural sobe T-S-T-T-S-T-T. Uma tonalidade maior e a sua relativa menor partilham todas as notas: dó maior e lá menor não têm sustenidos nem bemóis; sol maior e mi menor têm um fá♯. A relativa menor é a 6ª nota da escala maior.</p><h3>Na guitarra</h3><p>Uma forma de escala é o mesmo padrão de passos em cada corda, deslocado ao longo do braço. Aprende onde está a tónica dentro da forma e podes movê-la para qualquer tonalidade.</p>`,
"th.triads":`<h3>Três notas, quatro cores</h3><p>Uma tríade é fundamental, terça e quinta. A terça decide maior ou menor (4 ou 3 semitons acima da fundamental). A quinta costuma ser justa (7); baixa-a e tens diminuto, sobe-a e tens aumentado.</p><p>Maior e menor são estáveis e são a maioria do que vais encontrar. O diminuto é tenso e quer resolver; o aumentado soa suspenso e por resolver.</p>`,
"th.harmony":`<h3>Um acorde por nota da escala</h3><p>Sobrepõe terças usando só as notas da escala e cada grau recebe uma tríade. Em maior o padrão nunca muda: I, IV e V são maiores; ii, iii e vi menores; vii° é diminuto. Em dó: dó, ré menor, mi menor, fá, sol, lá menor e si diminuto.</p><h3>Porque é importante</h3><p>Esses acordes combinam porque partilham as notas da escala, e é por isso que as progressões I-IV-V e I-V-vi-IV funcionam em todas as tonalidades.</p>`,
"th.modes":`<h3>Rodar a escala maior</h3><p>Toca dó maior (dó ré mi fá sol lá si) mas faz de ré a tónica e ouves ré dórico. Cada uma das sete rotações é um modo com a sua cor. Compara sempre um modo com a escala maior ou menor sobre a mesma tónica e repara que notas mudam.</p><h3>Como usá-los</h3><p>O dórico funciona sobre acordes menores com um som mais leve, o mixolídio sobre acordes de dominante, o lídio sobre acordes maiores para um ar flutuante, o frígio para um som escuro e espanhol.</p>`,
"th.practice":`<h3>Porquê exercícios práticos</h3><p>Saber uma escala ou um acorde na teoria não é o mesmo que encontrá-lo debaixo dos dedos. Estes exercícios juntam as duas coisas: localizar notas e tónicas no braço e escolher um modo que se encaixe num acorde. As tarefas pedem-te para tocar, ouvir e verificar.</p>`,
"blurb.practice":`Exercícios aplicados e tarefas para tocar no teu instrumento.`,
"tip.rel.min":`<h2>Relativa menor</h2><p>A relativa menor começa na <b>6ª nota</b> da escala maior e usa exatamente as mesmas notas. Escreve a escala maior, conta até à 6ª nota e essa é a tua resposta.</p>`,
"tip.rel.maj":`<h2>Relativa maior</h2><p>A relativa maior começa na <b>3ª nota</b> da escala menor, 3 semitons acima da sua tónica. Escreve a escala menor e toma a 3ª nota.</p>`,
"tip.diagram.scale":`<h2>Ler um diagrama do braço</h2><p>A linha de baixo é a 6ª corda (mi grave), a de cima a 1ª (mi agudo), e os números por baixo são as casas (0 é a corda solta). Cada ponto é uma nota da escala e os pontos destacados são a tónica.</p><p>Localiza primeiro a tónica destacada e confere depois as notas em volta com o padrão: a maior tem 3ª, 6ª e 7ª naturais, a menor tem-nas baixadas.</p>`,
"tip.diagram.mode":`<h2>Um modo no braço</h2><p>Localiza a tónica destacada e procura a nota que dá carácter ao modo: a ♭2 do frígio, a ♯4 do lídio, a ♭7 do mixolídio. Todos os diagramas errados partilham a mesma tónica, por isso só essas notas características os distinguem.</p>`,
"tip.scale.notes":`<h2>Escrever uma escala</h2><p>Usa cada nome de nota uma vez, por ordem, e acrescenta # ou ♭ só onde o padrão exige. Maior é T-T-S-T-T-T-S e menor T-S-T-T-S-T-T. As respostas erradas costumam mudar uma ou duas entre a 3ª, a 6ª e a 7ª: vê essas primeiro.</p>`,
"tip.mode.notes":`<h2>Escrever um modo</h2><p>Toma a escala maior mãe e começa na tónica do modo. As opções erradas têm normalmente uma ou duas notas deslocadas um semitom: compara cada opção com a fórmula do modo.</p>`,
"tip.sc.major":`<h2>Padrão da escala maior</h2><p>Conta a partir da tónica com <b>T-T-S-T-T-T-S</b> (T = 2 semitons, S = 1). Cada nome de nota aparece uma vez, por isso o sustenido ou bemol que encontras é o que o padrão impõe.</p>`,
"tip.sc.minor":`<h2>Padrão da menor natural</h2><p>Conta a partir da tónica com <b>T-S-T-T-S-T-T</b>. Em relação à escala maior sobre a mesma tónica, a 3ª, a 6ª e a 7ª descem um semitom.</p>`,
"tip.iv.semi":`<h2>Contar um intervalo</h2><p>Conta os semitons entre as duas notas (todas as teclas do piano, incluindo as pretas) e procura o número: {cheat}.</p>`,
"tip.iv.ear":`<h2>Ouvir um intervalo</h2><p>Canta a primeira nota de cabeça e ouve quanto salta a segunda. Liga cada tamanho a uma música: 2ª menor Tubarão, 2ª maior Parabéns a você, 3ª menor Greensleeves, 3ª maior When the Saints, 4ª justa Marcha nupcial, 5ª justa Star Wars, oitava Somewhere Over the Rainbow. Toca nas opções depois de responder para as comparar.</p>`,
"tip.tri.deg":`<h2>Acordes como graus</h2><p>Maior 1-3-5, menor 1-♭3-5, diminuto 1-♭3-♭5, aumentado 1-3-♯5. Repara no que acontece à terça e à quinta: aí está toda a diferença entre os quatro acordes.</p>`,
"tip.tri.notes":`<h2>Construir uma tríade</h2><p>Sobrepõe fundamental, terça e quinta. Maior é 0-4-7 semitons acima da fundamental, menor 0-3-7, diminuto 0-3-6, aumentado 0-4-8. Encontra primeiro a terça: 4 semitons é maior, 3 é menor.</p>`,
"tip.harm":`<h2>Acordes de uma tonalidade</h2><p>Sobrepõe terças usando só as notas da escala. Em qualquer tonalidade maior as qualidades são I maior, ii menor, iii menor, IV maior, V maior, vi menor e vii° diminuto. Escreve as três notas e mede as terças entre elas.</p>`,
"tip.mode.deg":`<h2>Os modos como rotações</h2><p>Começa a escala maior na sua 1ª, 2ª, 3ª... nota e obténs {modes}, nessa ordem. Mesmas notas, tónica diferente.</p>`,
"tip.mode.parent":`<h2>Encontrar a tonalidade mãe</h2><p>Descobre que grau de uma escala maior é a tónica do modo (dórico é o 2º, frígio o 3º, lídio o 4º, mixolídio o 5º, eólio o 6º, lócrio o 7º) e conta até essa tonalidade maior.</p>`,
"tip.mode.formula":`<h2>Fórmulas dos modos</h2><p>Compara cada modo com uma escala maior sobre a mesma tónica:</p>{list}`,
"tip.mode.ear":`<h2>Ouvir um modo</h2><p>Primeiro decide se a 3ª soa maior (brilhante) ou menor (escura). Depois ouve a nota que o colore: 4ª elevada no lídio, 7ª baixada no mixolídio, 6ª elevada no dórico, 2ª baixada no frígio.</p>`,
"tip.mode.which":`<h2>Distinguir os modos</h2><p>Ordena-os por cor. Soam maiores: lídio (♯4), jónio, mixolídio (♭7). Soam menores: dórico (6ª elevada), eólio, frígio (♭2), lócrio (♭2 e ♭5).</p>`

"l.intervals":`<h2>Intervalles : la distance entre deux notes</h2><p>Un intervalle se compte en <b>demi-tons</b> (le plus petit pas au piano, d’une touche à la suivante). Chaque intervalle a un nom parce qu’il a son propre caractère. Les connaître permet de lire des mélodies, de construire des accords et de repérer des schémas au lieu d’apprendre les notes par cœur.</p><details><summary>Aide-mémoire</summary><p>{cheat}</p></details>`,
"l.ear":`<h2>Entendre les intervalles</h2><p>La théorie ne sert que si tu l’entends. Chaque intervalle a une sonorité propre. L’astuce est de rattacher chacun à une chanson que tu connais, pour reconnaître la <i>forme</i> du saut plutôt que les hauteurs exactes.</p><p>La première note t’est donnée. Lance la lecture (un casque aide), puis choisis l’intervalle. Après ta réponse, chaque option affiche les notes qu’elle aurait impliquées (première note → deuxième note) et tu peux en toucher une pour l’écouter.</p>`,
"l.scales":`<h2>La gamme majeure</h2><p>Toutes les gammes majeures suivent le même schéma de pas : <b>ton, ton, demi-ton, ton, ton, ton, demi-ton</b> (un ton = 2 demi-tons, un demi-ton = 1). Pars d’une note quelconque, applique le schéma et tu obtiens cette tonalité. Les dièses et bémols d’une tonalité ne sont pas aléatoires : c’est le schéma qui les impose.</p><details><summary>Pourquoi c’est important</summary><p>Comme le schéma est fixe, la gamme sonne « pareil » dans toutes les tonalités. Apprends-le une fois et tu peux en déduire n’importe quelle armure.</p></details>`,
"l.minor":`<h2>La gamme mineure naturelle</h2><p>Le schéma de la mineure naturelle est <b>ton, demi-ton, ton, ton, demi-ton, ton, ton</b>. Par rapport à une gamme majeure sur la même tonique, la 3ce, la 6te et la 7me sont un demi-ton plus bas (♭3, ♭6, ♭7). C’est cette tierce abaissée qui donne au mineur sa couleur plus sombre.</p><details><summary>Mineure harmonique et mélodique</summary><p>Les compositeurs haussent souvent la 7me (mineure harmonique) pour renforcer l’attraction vers la tonique. Cet entraîneur utilise la mineure naturelle.</p></details>`,
"l.relative":`<h2>Relatifs majeur et mineur</h2><p>Chaque tonalité majeure partage toutes ses notes avec une tonalité mineure, sa <b>relative mineure</b>. La relative mineure part de la <b>6te note</b> de la gamme majeure (3 demi-tons sous la tonique majeure). Inversement, la relative majeure d’une tonalité mineure part de la <b>3ce note</b> de la gamme mineure (3 demi-tons au-dessus).</p><p>Exemple : do majeur et la mineur utilisent exactement les mêmes notes, sans dièse ni bémol. Elles sonnent différemment uniquement parce que la note de repos change.</p>`,
"l.triads":`<h2>Construire les triades</h2><p>Une triade est faite de trois notes empilées par tierces : fondamentale, tierce et quinte. La taille de ces tierces détermine la qualité :</p><p><b>{vmaj}</b> 0-4-7 · <b>{vmin}</b> 0-3-7 · <b>{vdim}</b> 0-3-6 · <b>{vaug}</b> 0-4-8 <span style="color:var(--mut)">(demi-tons au-dessus de la fondamentale)</span></p><p>Les mêmes accords en <b>degrés de la gamme</b> (comptés sur une gamme majeure depuis la fondamentale) : <b>{vmaj}</b> 1 – 3 – 5 · <b>{vmin}</b> 1 – ♭3 – 5 · <b>{vdim}</b> 1 – ♭3 – ♭5 · <b>{vaug}</b> 1 – 3 – ♯5. Ici 1 est la fondamentale, 3 la tierce et 5 la quinte ; ♭ abaisse d’un demi-ton et ♯ élève.</p><p>Seules la tierce et la quinte changent, et ce petit écart fait toute la différence entre brillant, triste, tendu et non résolu.</p>`,
"l.harmony":`<h2>Quel accord vit où ?</h2><p>Empile des tierces en n’utilisant que les notes de la gamme et tu obtiens une triade sur chaque degré. Dans toute tonalité majeure, les qualités sont toujours les mêmes : <b>I majeur · ii mineur · iii mineur · IV majeur · V majeur · vi mineur · vii° diminué</b>.</p><p>C’est ainsi que les compositeurs savent quels accords vont ensemble, et pourquoi I–IV–V–vi fonctionne dans toutes les tonalités.</p>`,
"l.modes":`<h2>Les sept modes</h2><p>Un mode est une gamme majeure commencée sur une autre note. Prends do majeur (do ré mi fa sol la si) et pars de ré : c’est ré dorien. Mêmes notes, nouvelle tonique, nouvelle couleur. Le plus simple est de voir comment chaque mode diffère d’une gamme majeure sur la même tonique.</p><details><summary>Formules et caractère</summary>{list}</details>`,
"l.keys":`<h2>Gammes : majeure, mineure et relatives</h2><p>Une tonalité, c’est une note de repos plus la gamme construite sur elle. <b>Majeure :</b> T-T-D-T-T-T-D. <b>Mineure naturelle :</b> T-D-T-T-D-T-T. Chaque tonalité majeure partage ses notes avec une relative mineure (la 6te note de la gamme majeure).</p><p>Cette section mélange tout sur les notes d’une tonalité : la nième note d’une gamme, l’ensemble des notes, des schémas de manche et les relatives.</p>`,
"th.intervals":`<h3>Pourquoi compter les demi-tons</h3><p>Les noms de notes trompent : de do à mi et de do à fa♭, il y a une tierce dans les deux cas, mais de tailles différentes. Les demi-tons sont exacts. Depuis do vers le haut : do♯ 1, ré 2, mi♭ 3, mi 4, fa 5, fa♯ 6, sol 7, la♭ 8, la 9, si♭ 10, si 11, do 12.</p><h3>D’où viennent les noms</h3><p>Le nombre compte les lettres (do ré mi est une tierce). La qualité donne la taille exacte : les 2des, 3ces, 6tes et 7mes sont majeures ou mineures ; les 4tes, 5tes et l’octave sont justes ; le triton coupe l’octave en deux.</p>`,
"th.ear":`<h3>Entraîner son oreille</h3><p>Choisis une chanson repère pour chaque intervalle et chante la première note avant le saut. Les intervalles ascendants sont le point de départ le plus simple. Des séances courtes et régulières valent mieux qu’une longue.</p><p>Remarque aussi le caractère : les secondes sont tendues, les tierces sonnent douces, les quartes et quintes ouvertes et stables, les septièmes demandent à se résoudre.</p>`,
"th.keys":`<h3>Construire une gamme majeure</h3><p>Pars d’une note quelconque et monte T-T-D-T-T-T-D. Pour sol majeur : sol la si do ré mi fa♯ : le fa♯ est obligatoire, car la 7me note doit se trouver un demi-ton sous le sol de l’octave. C’est pourquoi chaque tonalité a ses propres dièses ou bémols.</p><h3>Mineur et relatives</h3><p>La mineure naturelle monte T-D-T-T-D-T-T. Une tonalité majeure et sa relative mineure partagent toutes leurs notes : do majeur et la mineur n’ont ni dièse ni bémol ; sol majeur et mi mineur ont un fa♯. La relative mineure est la 6te note de la gamme majeure.</p><h3>À la guitare</h3><p>Une forme de gamme est le même schéma de pas sur chaque corde, décalé le long du manche. Repère où se trouve la tonique dans la forme et tu peux la déplacer dans n’importe quelle tonalité.</p>`,
"th.triads":`<h3>Trois notes, quatre couleurs</h3><p>Une triade, c’est une fondamentale, une tierce et une quinte. La tierce décide majeur ou mineur (4 ou 3 demi-tons au-dessus de la fondamentale). La quinte est généralement juste (7) ; abaisse-la et tu obtiens un diminué, élève-la et tu obtiens un augmenté.</p><p>Majeur et mineur sont stables et représentent presque tout ce que tu rencontreras. Le diminué est tendu et veut se résoudre ; l’augmenté sonne suspendu et non résolu.</p>`,
"th.harmony":`<h3>Un accord par note de la gamme</h3><p>Empile des tierces en n’utilisant que les notes de la gamme et chaque degré reçoit une triade. En majeur, le schéma ne change jamais : I, IV et V sont majeurs ; ii, iii et vi mineurs ; vii° diminué. En do : do, rém, mim, fa, sol, lam, si°.</p><h3>Pourquoi c’est important</h3><p>Ces accords vont ensemble parce qu’ils partagent les notes de la gamme : c’est pourquoi les enchaînements I-IV-V et I-V-vi-IV fonctionnent dans toutes les tonalités.</p>`,
"th.modes":`<h3>Faire tourner la gamme majeure</h3><p>Joue do majeur (do ré mi fa sol la si) mais prends ré comme tonique et tu entends ré dorien. Chacune des sept rotations est un mode avec sa couleur. Compare toujours un mode avec la gamme majeure ou mineure sur la même tonique et repère les notes qui changent.</p><h3>Comment les utiliser</h3><p>Le dorien fonctionne sur les accords mineurs avec une couleur plus légère, le mixolydien sur les accords de dominante, le lydien sur les accords majeurs pour une impression flottante, le phrygien pour une couleur sombre et espagnole.</p>`,
"th.practice":`<h3>Pourquoi des exercices pratiques</h3><p>Connaître une gamme ou un accord en théorie n’est pas la même chose que le trouver sous ses doigts. Ces exercices réunissent les deux : repérer les notes et les toniques sur le manche, et choisir un mode qui convient à un accord. Les tâches te demandent de jouer, d’écouter, puis de vérifier.</p>`,
"blurb.practice":`Exercices appliqués et tâches à jouer sur ton instrument.`,
"tip.rel.min":`<h2>Relative mineure</h2><p>La relative mineure part de la <b>6te note</b> de la gamme majeure et utilise exactement les mêmes notes. Écris la gamme majeure, compte jusqu’à la 6te note : c’est ta réponse.</p>`,
"tip.rel.maj":`<h2>Relative majeure</h2><p>La relative majeure part de la <b>3ce note</b> de la gamme mineure, 3 demi-tons au-dessus de sa tonique. Écris la gamme mineure et prends la 3ce note.</p>`,
"tip.diagram.scale":`<h2>Lire un schéma de manche</h2><p>La ligne du bas est la 6te corde (mi grave), celle du haut la 1re (mi aigu), et les chiffres en dessous sont les cases (0 = corde à vide). Chaque point est une note de la gamme et les points en évidence sont la tonique.</p><p>Repère d’abord la tonique mise en évidence, puis vérifie les notes autour avec le schéma : la majeure a une 3ce, une 6te et une 7me naturelles, la mineure les a abaissées.</p>`,
"tip.diagram.mode":`<h2>Un mode sur le manche</h2><p>Repère la tonique mise en évidence, puis cherche la note qui donne son caractère au mode : la ♭2 du phrygien, la ♯4 du lydien, la ♭7 du mixolydien. Tous les mauvais schémas partagent la même tonique : seules ces notes caractéristiques les distinguent.</p>`,
"tip.scale.notes":`<h2>Écrire une gamme</h2><p>Utilise chaque nom de note une fois, dans l’ordre, et ajoute # ou ♭ uniquement là où le schéma l’exige. La majeure est T-T-D-T-T-T-D et la mineure T-D-T-T-D-T-T. Les mauvaises réponses changent souvent une ou deux notes parmi la 3ce, la 6te et la 7me : regarde celles-là d’abord.</p>`,
"tip.mode.notes":`<h2>Écrire un mode</h2><p>Prends la gamme majeure parente et pars de la tonique du mode. Les mauvaises options ont souvent une ou deux notes décalées d’un demi-ton : compare chaque option avec la formule du mode.</p>`,
"tip.sc.major":`<h2>Schéma de la gamme majeure</h2><p>Compte depuis la tonique avec <b>T-T-D-T-T-T-D</b> (T = 2 demi-tons, D = 1). Chaque nom de note apparaît une fois : le dièse ou le bémol rencontré est donc imposé par le schéma.</p>`,
"tip.sc.minor":`<h2>Schéma de la mineure naturelle</h2><p>Compte depuis la tonique avec <b>T-D-T-T-D-T-T</b>. Par rapport à la gamme majeure sur la même tonique, la 3ce, la 6te et la 7me sont abaissées d’un demi-ton.</p>`,
"tip.iv.semi":`<h2>Compter un intervalle</h2><p>Compte les demi-tons entre les deux notes (toutes les touches du piano, noires comprises) puis cherche le nombre : {cheat}.</p>`,
"tip.iv.ear":`<h2>Entendre un intervalle</h2><p>Chante mentalement la première note et écoute de combien la deuxième saute. Rattache chaque taille à une chanson : 2de mineure Les Dents de la mer, 2de majeure Joyeux anniversaire, 3ce mineure Greensleeves, 3ce majeure When the Saints, 4te juste La Marche nuptiale, 5te juste Star Wars, octave Somewhere Over the Rainbow. Touche les options après avoir répondu pour les comparer.</p>`,
"tip.tri.deg":`<h2>Les accords en degrés</h2><p>Majeur 1-3-5, mineur 1-♭3-5, diminué 1-♭3-♭5, augmenté 1-3-♯5. Regarde ce qui arrive à la tierce et à la quinte : c’est toute la différence entre les quatre accords.</p>`,
"tip.tri.notes":`<h2>Construire une triade</h2><p>Empile fondamentale, tierce et quinte. Majeur = 0-4-7 demi-tons au-dessus de la fondamentale, mineur 0-3-7, diminué 0-3-6, augmenté 0-4-8. Trouve d’abord la tierce : 4 demi-tons = majeur, 3 = mineur.</p>`,
"tip.harm":`<h2>Les accords d’une tonalité</h2><p>Empile des tierces en n’utilisant que les notes de la gamme. Dans toute tonalité majeure, les qualités sont I majeur, ii mineur, iii mineur, IV majeur, V majeur, vi mineur et vii° diminué. Écris les trois notes, puis mesure les tierces entre elles.</p>`,
"tip.mode.deg":`<h2>Les modes comme rotations</h2><p>Commence la gamme majeure sur sa 1re, 2de, 3ce... note et tu obtiens {modes}, dans cet ordre. Mêmes notes, autre tonique.</p>`,
"tip.mode.parent":`<h2>Trouver la tonalité parente</h2><p>Détermine de quel degré d’une gamme majeure la tonique du mode est issue (dorien 2e, phrygien 3e, lydien 4e, mixolydien 5e, éolien 6e, locrien 7e), puis remonte à cette tonalité majeure.</p>`,
"tip.mode.formula":`<h2>Formules des modes</h2><p>Compare chaque mode avec une gamme majeure sur la même tonique :</p>{list}`,
"tip.mode.ear":`<h2>Entendre un mode</h2><p>Décide d’abord si la 3ce sonne majeure (claire) ou mineure (sombre). Puis écoute la note qui le colore : 4te élevée pour le lydien, 7me abaissée pour le mixolydien, 6te élevée pour le dorien, 2de abaissée pour le phrygien.</p>`,
"tip.mode.which":`<h2>Distinguer les modes</h2><p>Classe-les par couleur. Sonorité majeure : lydien (♯4), ionien, mixolydien (♭7). Sonorité mineure : dorien (6te élevée), éolien, phrygien (♭2), locrien (♭2 et ♭5).</p>`

"l.intervals":`<h2>Intervalle: der Abstand zwischen zwei Tönen</h2><p>Ein Intervall wird in <b>Halbtönen</b> gezählt (der kleinste Schritt am Klavier, von einer Taste zur nächsten). Jedes Intervall hat einen Namen, weil jedes seinen eigenen Charakter hat. Wer sie kennt, liest Melodien, baut Akkorde und erkennt Muster, statt Noten auswendig zu lernen.</p><details><summary>Spickzettel</summary><p>{cheat}</p></details>`,
"l.ear":`<h2>Intervalle hören</h2><p>Theorie nützt nur, wenn du sie hören kannst. Jedes Intervall klingt eigen. Der Trick: Binde jedes an einen Song, den du schon kennst, damit du die <i>Form</i> des Sprungs erkennst und nicht die genauen Töne.</p><p>Der erste Ton wird dir vorgegeben. Drücke Abspielen (mit Kopfhörern ist es leichter) und wähle dann das Intervall. Nach der Antwort zeigt jede Option die Noten, die sie bedeutet hätte (erster Ton → zweiter Ton), und du kannst jede antippen, um sie zu hören.</p>`,
"l.scales":`<h2>Die Durtonleiter</h2><p>Jede Durtonleiter nutzt dasselbe Schrittmuster: <b>Ganzton, Ganzton, Halbton, Ganzton, Ganzton, Ganzton, Halbton</b> (ein Ganzton = 2 Halbtöne, ein Halbton = 1). Beginne auf einer beliebigen Note, wende das Muster an und du erhältst diese Tonart. Vorzeichen einer Tonart sind nicht zufällig: Das Muster erzwingt sie.</p><details><summary>Warum das wichtig ist</summary><p>Weil das Muster fest ist, klingt die Tonleiter in jeder Tonart „gleich“. Lerne es einmal und du kannst jede Vorzeichnung ableiten.</p></details>`,
"l.minor":`<h2>Die natürliche Molltonleiter</h2><p>Das Muster der natürlichen Molltonleiter ist <b>Ganzton, Halbton, Ganzton, Ganzton, Halbton, Ganzton, Ganzton</b>. Gegenüber einer Durtonleiter auf demselben Grundton liegen die 3., 6. und 7. Stufe je einen Halbton tiefer (♭3, ♭6, ♭7). Diese erniedrigte Terz gibt Moll seine dunklere Farbe.</p><details><summary>Harmonisch und melodisch Moll</summary><p>Komponisten erhöhen oft die 7. Stufe (harmonisch Moll), um stärker zur Tonika zu ziehen. Dieser Trainer nutzt natürliches Moll.</p></details>`,
"l.relative":`<h2>Dur- und Moll-Parallele</h2><p>Jede Durtonart teilt alle ihre Noten mit einer Molltonart, ihrer <b>Moll-Parallele</b>. Die Moll-Parallele beginnt auf der <b>6. Note</b> der Durtonleiter (3 Halbtöne unter der Dur-Tonika). Umgekehrt beginnt die Dur-Parallele einer Molltonart auf der <b>3. Note</b> der Molltonleiter (3 Halbtöne darüber).</p><p>Beispiel: C-Dur und A-Moll nutzen genau dieselben Noten, ohne Vorzeichen. Sie klingen nur anders, weil sich der Ruheton ändert.</p>`,
"l.triads":`<h2>Dreiklänge bauen</h2><p>Ein Dreiklang besteht aus drei in Terzen geschichteten Tönen: Grundton, Terz und Quinte. Die Größe dieser Terzen bestimmt die Qualität:</p><p><b>{vmaj}</b> 0-4-7 · <b>{vmin}</b> 0-3-7 · <b>{vdim}</b> 0-3-6 · <b>{vaug}</b> 0-4-8 <span style="color:var(--mut)">(Halbtöne über dem Grundton)</span></p><p>Dieselben Akkorde als <b>Stufen der Tonleiter</b> (gezählt gegen eine Durtonleiter vom Grundton): <b>{vmaj}</b> 1 – 3 – 5 · <b>{vmin}</b> 1 – ♭3 – 5 · <b>{vdim}</b> 1 – ♭3 – ♭5 · <b>{vaug}</b> 1 – 3 – ♯5. Dabei ist 1 der Grundton, 3 die Terz, 5 die Quinte; ♭ senkt einen Ton um einen Halbton, ♯ erhöht ihn.</p><p>Nur Terz und Quinte ändern sich, und dieser kleine Unterschied macht alles aus zwischen hell, traurig, spannungsreich und unaufgelöst.</p>`,
"l.harmony":`<h2>Welcher Akkord gehört wohin?</h2><p>Schichte Terzen nur aus den Noten der Tonleiter und du erhältst auf jeder Stufe einen Dreiklang. In jeder Durtonart sind die Qualitäten immer gleich: <b>I Dur · ii Moll · iii Moll · IV Dur · V Dur · vi Moll · vii° vermindert</b>.</p><p>So wissen Songwriter, welche Akkorde zusammenpassen, und deshalb funktioniert I–IV–V–vi in jeder Tonart.</p>`,
"l.modes":`<h2>Die sieben Modi</h2><p>Ein Modus ist eine Durtonleiter, die auf einer anderen Note beginnt. Nimm C-Dur (C D E F G A B) und beginne auf D: Das ist D-Dorisch. Dieselben Noten, neuer Grundton, neuer Klang. Am einfachsten denkst du bei jedem Modus daran, wie er sich von einer Durtonleiter auf demselben Grundton unterscheidet.</p><details><summary>Formeln und Charakter</summary>{list}</details>`,
"l.keys":`<h2>Tonleitern: Dur, Moll und Parallelen</h2><p>Eine Tonart ist ein Grundton plus die darauf gebaute Tonleiter. <b>Dur:</b> G-G-H-G-G-G-H. <b>Natürliches Moll:</b> G-H-G-G-H-G-G. Jede Durtonart teilt ihre Noten mit einer Moll-Parallele (der 6. Note der Durtonleiter).</p><p>Dieser Abschnitt mischt alles über die Noten einer Tonart: die n-te Note einer Tonleiter, den vollständigen Notenvorrat, Griffbrettdiagramme und Parallelen.</p>`,
"th.intervals":`<h3>Warum Halbtöne zählen</h3><p>Nur Notennamen täuschen: Von C nach E und von C nach F♭ ist es beides eine Art Terz, aber unterschiedlich groß. Halbtöne sind exakt. Von C aufwärts: C♯ 1, D 2, E♭ 3, E 4, F 5, F♯ 6, G 7, A♭ 8, A 9, B♭ 10, B 11, C 12.</p><h3>Woher die Namen kommen</h3><p>Die Zahl zählt Buchstaben (C D E ist eine Terz). Die Qualität gibt die genaue Größe: Sekunden, Terzen, Sexten und Septimen sind groß oder klein; Quarten, Quinten und Oktaven sind rein; der Tritonus teilt die Oktave in zwei Hälften.</p>`,
"th.ear":`<h3>Das Gehör trainieren</h3><p>Wähle für jedes Intervall einen Anker-Song und singe den ersten Ton vor dem Sprung. Aufwärtsintervalle sind der einfachste Einstieg. Kurze, regelmäßige Übungen bringen mehr als eine lange Einheit.</p><p>Achte auch auf den Charakter: Sekunden sind spannungsreich, Terzen klingen süß, Quarten und Quinten offen und stabil, Septimen wollen sich auflösen.</p>`,
"th.keys":`<h3>Eine Durtonleiter bauen</h3><p>Beginne auf einer beliebigen Note und steige G-G-H-G-G-G-H. Für G-Dur ergibt das G A B C D E F♯: Das F♯ ist zwingend, weil die 7. Note einen Halbton unter dem Oktav-G liegen muss. Deshalb hat jede Tonart ihre eigenen Vorzeichen.</p><h3>Moll und Parallelen</h3><p>Natürliches Moll steigt G-H-G-G-H-G-G. Eine Durtonart und ihre Moll-Parallele teilen alle Noten: C-Dur und A-Moll haben keine Vorzeichen; G-Dur und E-Moll haben ein F♯. Die Moll-Parallele ist die 6. Note der Durtonleiter.</p><h3>Auf der Gitarre</h3><p>Eine Skalenform ist dasselbe Schrittmuster auf jeder Saite, verschoben entlang des Griffbretts. Lerne, wo der Grundton in der Form liegt, und du kannst sie in jede Tonart verschieben.</p>`,
"th.triads":`<h3>Drei Töne, vier Farben</h3><p>Ein Dreiklang ist Grundton, Terz und Quinte. Die Terz entscheidet Dur oder Moll (4 oder 3 Halbtöne über dem Grundton). Die Quinte ist meist rein (7); senkst du sie, wird der Akkord vermindert, erhöhst du sie, übermäßig.</p><p>Dur und Moll sind stabil und machen fast alles aus, was dir begegnet. Vermindert klingt spannungsreich und will sich auflösen; übermäßig klingt schwebend und unaufgelöst.</p>`,
"th.harmony":`<h3>Ein Akkord pro Tonleiterton</h3><p>Schichte Terzen nur aus den Noten der Tonleiter und jede Stufe bekommt einen Dreiklang. In Dur ändert sich das Muster nie: I, IV und V sind Dur; ii, iii und vi Moll; vii° vermindert. In C ist das C, Dm, Em, F, G, Am, B°.</p><h3>Warum das wichtig ist</h3><p>Diese Akkorde passen zusammen, weil sie die Noten der Tonleiter teilen – deshalb funktionieren I-IV-V und I-V-vi-IV in jeder Tonart.</p>`,
"th.modes":`<h3>Die Durtonleiter rotieren</h3><p>Spiele C-Dur (C D E F G A B), aber mache D zum Grundton – du hörst D-Dorisch. Jede der sieben Drehungen ist ein Modus mit eigener Farbe. Vergleiche einen Modus immer mit der Dur- oder Molltonleiter auf demselben Grundton und achte darauf, welche Noten sich ändern.</p><h3>Wie man sie einsetzt</h3><p>Dorisch passt über Mollakkorde mit leichterem Klang, Mixolydisch über Dominantakkorde, Lydisch über Durakkorde für ein schwebendes Gefühl, Phrygisch für einen dunklen, spanischen Klang.</p>`,
"th.practice":`<h3>Warum praktische Übungen</h3><p>Eine Tonleiter oder einen Akkord theoretisch zu kennen ist nicht dasselbe, wie ihn unter den Fingern zu finden. Diese Übungen verbinden beides: Noten und Grundtöne auf dem Griffbrett finden und einen Modus wählen, der zu einem Akkord passt. Die Aufgaben verlangen Spielen, Hören und Selbstkontrolle.</p>`,
"blurb.practice":`Angewandte Übungen und Aufgaben zum Spielen auf deinem Instrument.`,
"tip.rel.min":`<h2>Moll-Parallele</h2><p>Die Moll-Parallele beginnt auf der <b>6. Note</b> der Durtonleiter und nutzt genau dieselben Noten. Schreibe die Durtonleiter auf, zähle bis zur 6. Note – das ist die Antwort.</p>`,
"tip.rel.maj":`<h2>Dur-Parallele</h2><p>Die Dur-Parallele beginnt auf der <b>3. Note</b> der Molltonleiter, 3 Halbtöne über ihrem Grundton. Schreibe die Molltonleiter auf und nimm die 3. Note.</p>`,
"tip.diagram.scale":`<h2>Ein Griffbrettdiagramm lesen</h2><p>Die untere Linie ist die tiefe E-Saite, die obere die hohe E-Saite, und die Zahlen darunter sind die Bünde (0 = leere Saite). Jeder Punkt ist eine Note der Tonleiter, die hervorgehobenen Punkte sind der Grundton.</p><p>Suche zuerst den hervorgehobenen Grundton und prüfe dann die Noten ringsum mit dem Muster: Dur hat eine natürliche 3., 6. und 7. Stufe, Moll hat sie erniedrigt.</p>`,
"tip.diagram.mode":`<h2>Ein Modus auf dem Griffbrett</h2><p>Suche den hervorgehobenen Grundton und dann die Note, die dem Modus seinen Charakter gibt: die ♭2 bei Phrygisch, die ♯4 bei Lydisch, die ♭7 bei Mixolydisch. Alle falschen Diagramme haben denselben Grundton – nur diese charakteristischen Noten unterscheiden sie.</p>`,
"tip.scale.notes":`<h2>Eine Tonleiter schreiben</h2><p>Nutze jeden Notennamen einmal, der Reihe nach, und setze # oder ♭ nur dort, wo das Muster es verlangt. Dur ist G-G-H-G-G-G-H, Moll G-H-G-G-H-G-G. Falsche Antworten ändern meist eine oder zwei der 3., 6. und 7. Stufe – prüfe die zuerst.</p>`,
"tip.mode.notes":`<h2>Einen Modus schreiben</h2><p>Nimm die Mutter-Durtonleiter und beginne auf dem Grundton des Modus. Falsche Optionen haben meist eine oder zwei um einen Halbton verschobene Noten: Vergleiche jede Option mit der Formel des Modus.</p>`,
"tip.sc.major":`<h2>Dur-Muster</h2><p>Zähle vom Grundton mit <b>G-G-H-G-G-G-H</b> (G = 2 Halbtöne, H = 1). Jeder Notenname kommt einmal vor, das Vorzeichen, das du triffst, erzwingt also das Muster.</p>`,
"tip.sc.minor":`<h2>Muster des natürlichen Moll</h2><p>Zähle vom Grundton mit <b>G-H-G-G-H-G-G</b>. Gegenüber der Durtonleiter auf demselben Grundton sind die 3., 6. und 7. Stufe um einen Halbton tiefer.</p>`,
"tip.iv.semi":`<h2>Ein Intervall zählen</h2><p>Zähle die Halbtöne zwischen den beiden Noten (jede Klaviertaste, auch die schwarzen) und ordne die Zahl zu: {cheat}.</p>`,
"tip.iv.ear":`<h2>Ein Intervall hören</h2><p>Singe die erste Note im Kopf und höre, wie weit die zweite springt. Binde jede Größe an einen Song: kleine Sekunde Der weiße Hai, große Sekunde Happy Birthday, kleine Terz Greensleeves, große Terz When the Saints, reine Quarte Der Hochzeitsmarsch, reine Quinte Star Wars, Oktave Somewhere Over the Rainbow. Tippe nach der Antwort die Optionen an, um sie zu vergleichen.</p>`,
"tip.tri.deg":`<h2>Akkorde als Stufen</h2><p>Dur 1-3-5, Moll 1-♭3-5, vermindert 1-♭3-♭5, übermäßig 1-3-♯5. Achte darauf, was mit Terz und Quinte passiert: Genau das unterscheidet die vier Akkorde.</p>`,
"tip.tri.notes":`<h2>Einen Dreiklang bauen</h2><p>Schichte Grundton, Terz und Quinte. Dur = 0-4-7 Halbtöne über dem Grundton, Moll 0-3-7, vermindert 0-3-6, übermäßig 0-4-8. Finde zuerst die Terz: 4 Halbtöne = Dur, 3 = Moll.</p>`,
"tip.harm":`<h2>Akkorde einer Tonart</h2><p>Schichte Terzen nur aus den Noten der Tonleiter. In jeder Durtonart sind die Qualitäten I Dur, ii Moll, iii Moll, IV Dur, V Dur, vi Moll und vii° vermindert. Schreibe die drei Noten auf und miss dann die Terzen dazwischen.</p>`,
"tip.mode.deg":`<h2>Modi als Rotationen</h2><p>Beginne die Durtonleiter auf ihrer 1., 2., 3. ... Note und du erhältst {modes}, in dieser Reihenfolge. Dieselben Noten, anderer Grundton.</p>`,
"tip.mode.parent":`<h2>Die Muttertonart finden</h2><p>Finde heraus, welche Stufe einer Durtonleiter der Grundton des Modus ist (Dorisch die 2., Phrygisch die 3., Lydisch die 4., Mixolydisch die 5., Äolisch die 6., Lokrisch die 7.), und zähle bis zu dieser Durtonart.</p>`,
"tip.mode.formula":`<h2>Modus-Formeln</h2><p>Vergleiche jeden Modus mit einer Durtonleiter auf demselben Grundton:</p>{list}`,
"tip.mode.ear":`<h2>Einen Modus hören</h2><p>Entscheide zuerst, ob die 3. Stufe groß (hell) oder klein (dunkel) klingt. Höre dann auf die Note, die ihn färbt: erhöhte 4. bei Lydisch, erniedrigte 7. bei Mixolydisch, erhöhte 6. bei Dorisch, erniedrigte 2. bei Phrygisch.</p>`,
"tip.mode.which":`<h2>Modi unterscheiden</h2><p>Sortiere sie nach Klangfarbe. Dur-artig: Lydisch (♯4), Ionisch, Mixolydisch (♭7). Moll-artig: Dorisch (erhöhte 6.), Äolisch, Phrygisch (♭2), Lokrisch (♭2 und ♭5).</p>`

[/relative minor of/,'<h2>Relative minor</h2><p>The relative minor starts on the <b>6th note</b> of the major scale and uses exactly the same notes. Write the major scale out, count to the 6th note, and that is your answer.</p>'],
[/relative major of/,'<h2>Relative major</h2><p>The relative major starts on the <b>3rd note</b> of the minor scale, 3 semitones above its root. Write the minor scale out and take the 3rd note.</p>'],
[/Which diagram shows the .* scale/,'<h2>Reading a fretboard diagram</h2><p>The bottom line is the low E string, the top line the high E, and the numbers underneath are frets (0 is the open string). Every dot is a note of the scale and the highlighted dots are the root.</p><p>Find the highlighted root first, then check the notes around it against the pattern: a major scale has a natural 3rd, 6th and 7th, a minor scale has them lowered.</p>'],
[/Which diagram shows/,'<h2>A mode on the fretboard</h2><p>Locate the highlighted root, then look for the note that gives the mode its character: the \u266d2 of Phrygian, the \u266f4 of Lydian, the \u266d7 of Mixolydian. All the wrong diagrams share the same root, so only those characteristic notes tell them apart.</p>'],
[/What are the notes of \S+ (major|minor)\?/,'<h2>Spelling a scale</h2><p>Use each letter name once, in order, and add # or b only where the step pattern needs it. Major is W-W-H-W-W-W-H and minor is W-H-W-W-H-W-W. The wrong answers usually change one or two of the 3rd, 6th and 7th, so check those first.</p>'],
[/What are the notes of/,'<h2>Spelling a mode</h2><p>Take the parent major scale and start from the mode\u2019s root. The wrong options usually have one or two notes shifted by a semitone, so compare each option with the mode\u2019s formula.</p>'],
[/note of the .* major/,'<h2>Major scale pattern</h2><p>Count up from the root using <b>W-W-H-W-W-W-H</b> (W = 2 semitones, H = 1). Each letter name appears once, so the sharp or flat you meet is the note the pattern forces.</p>'],
[/note of the .* minor/,'<h2>Natural minor pattern</h2><p>Count up from the root using <b>W-H-W-W-H-W-W</b>. Compared with the major scale on the same root, the 3rd, 6th and 7th are lowered by a semitone.</p>'],
[/What interval is/,'<h2>Counting an interval</h2><p>Count the semitones between the two notes (every piano key, black ones too), then match the number: 1 minor 2nd, 2 major 2nd, 3 minor 3rd, 4 major 3rd, 5 perfect 4th, 6 tritone, 7 perfect 5th, 8 minor 6th, 9 major 6th, 10 minor 7th, 11 major 7th, 12 octave.</p>'],
[/first note is/,'<h2>Hearing an interval</h2><p>Sing the first note in your head and listen for how far the second one jumps. Tie each size to a song: m2 Jaws, M2 Happy Birthday, m3 Greensleeves, M3 When the Saints, P4 Here Comes the Bride, P5 Star Wars, octave Somewhere Over the Rainbow. Tap the options after answering to compare them.</p>'],
[/Which chord has the degrees/,'<h2>Chords as degrees</h2><p>Major 1-3-5, minor 1-\u266d3-5, diminished 1-\u266d3-\u266d5, augmented 1-3-\u266f5. Look at what happens to the third and the fifth: that is the whole difference between the four chords.</p>'],
[/Which notes make the/,'<h2>Building a triad</h2><p>Stack root, third and fifth. Major is 0-4-7 semitones above the root, minor 0-3-7, diminished 0-3-6, augmented 0-4-8. Find the third first: 4 semitones is major, 3 is minor.</p>'],
[/what is the chord/,'<h2>Chords in a key</h2><p>Stack thirds using only the notes of the scale. In every major key the qualities are I major, ii minor, iii minor, IV major, V major, vi minor and vii\u00b0 diminished. Spell the three notes, then measure the thirds between them.</p>'],
[/What mode do you get/,'<h2>Modes as rotations</h2><p>Start the major scale on its 1st, 2nd, 3rd... note and you get Ionian, Dorian, Phrygian, Lydian, Mixolydian, Aeolian and Locrian, in that order. Same notes, different home.</p>'],
[/same notes as/,'<h2>Finding the parent key</h2><p>Work out which degree of a major scale the mode\u2019s root is (Dorian is the 2nd, Phrygian the 3rd, Lydian the 4th, Mixolydian the 5th, Aeolian the 6th, Locrian the 7th), then count back to that major key.</p>'],

[/Listen to this scale/,'<h2>Hearing a mode</h2><p>First decide whether the 3rd sounds major (bright) or minor (dark). Then listen for the one note that colours it: raised 4th for Lydian, lowered 7th for Mixolydian, raised 6th for Dorian, lowered 2nd for Phrygian.</p>'],
[/Which mode is/,'<h2>Telling modes apart</h2><p>Sort them by colour. Major-sounding: Lydian (\u266f4), Ionian, Mixolydian (\u266d7). Minor-sounding: Dorian (raised 6th), Aeolian, Phrygian (\u266d2), Locrian (\u266d2 and \u266d5).</p>'],[/fret|standard tuning/,'<h2>Notes on the guitar</h2><p>Standard tuning, low to high, is E A D G B E. Each fret is one semitone, so to name a note start from the open string and count up. The low E string is the easiest place to find a root.</p>'],[/Which mode of .* fits/,'<h2>Matching a mode to a chord</h2><p>A mode that shares the chord key will fit it. A minor 7 chord takes Dorian, a dominant 7 takes Mixolydian, and a major 7 takes Ionian or Lydian.</p>']],
