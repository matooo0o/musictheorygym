const CX2={en:{
"t.0":{guitar:["Play the C major scale on the low E string starting at fret 8, naming each note aloud as you go.","<b>C major:</b> C D E F G A B C. Fret 8 on the low E string is C. Climb the pattern W-W-H-W-W-W-H (8 → 10 → 12 gives C, D, E)."],bass:["Play the C major scale on the A string starting at fret 3, naming each note aloud as you go.","<b>C major:</b> C D E F G A B C. Fret 3 on the A string is C. Climb the pattern W-W-H-W-W-W-H (3 → 5 → 7 gives C, D, E)."],uke:["Play the C major scale on the C string starting from the open string, naming each note aloud as you go.","<b>C major:</b> C D E F G A B C. Your C string is already C, so start on the open string and climb the pattern W-W-H-W-W-W-H."],piano:["Play the C major scale on the white keys from C to C, naming each note aloud as you go.","<b>C major:</b> C D E F G A B C. Start on any C and use only the white keys: the steps are W-W-H-W-W-W-H, which is why no black key sits between E-F or between B-C."]},
"cap.0":"C major = C D E F G A B",
"t.1":["Play a I - V - vi - IV progression in G major. Name each chord before you play it.","<b>G major:</b> I = G, V = D, vi = Em, IV = C, so the loop is <b>G - D - Em - C</b>."],
"t.2":["Play a minor 3rd up from your lowest E, then a major 3rd up from the same note. Listen to the difference.","Minor 3rd above E = G (3 semitones). Major 3rd above E = G# (4 semitones). The major 3rd sounds brighter."],
"t.3":["Play the root, 3rd and 5th of D minor, then raise the 3rd by one semitone. What chord do you get?","D minor = D F A. Raise F to F# and you get D F# A = <b>D major</b>. That one semitone is the whole difference."],
"cap.3a":"D minor = D F A","cap.3b":"D major = D F# A",
"t.4":{guitar:["Find every C on the fretboard within 12 frets. How many can you find?","<b>Six</b>, one per string: low E fret 8, A fret 3, D fret 10, G fret 5, B fret 1, high E fret 8.","Every C on the neck"],bass:["Find every C on the fretboard within 12 frets. How many can you find?","<b>Four</b>, one per string: E fret 8, A fret 3, D fret 10, G fret 5.","Every C on the neck"],uke:["Find every C on the fretboard within 12 frets. How many can you find?","<b>Four</b>: G string fret 5, C string open, E string fret 8, A string fret 3.","Every C on the neck"],piano:["Find every C on the keyboard shown here. How many can you find?","<b>Three</b> in these two octaves: one at the start of each octave, plus the top C. Every C sits just left of a group of two black keys.","Every C sits left of the two black keys"]},
"t.5":["Play A natural minor, then C major. Notice that they use exactly the same notes.","A natural minor = A B C D E F G, the same notes as C major. Only the home note changes."],
"cap.5a":"A natural minor = A B C D E F G","cap.5b":"C major = the very same notes",
"t.6":["Play a perfect 5th up from A, then a tritone up from A. Sing each one before you play it.","Perfect 5th above A = E (7 semitones). Tritone above A = D#/Eb (6 semitones)."],
"t.7":["Loop four bars over a Dm7 chord using D Dorian, landing on the chord tones.","D Dorian = D E F G A B C. Chord tones of Dm7 are D F A C, so aim for those on the strong beats."],
"t.8":{guitar:["Play the natural notes on the low E string from the open string up to fret 12, naming each one as you go.","<b>E</b> open, then F (1), G (3), A (5), B (7), C (8), D (10), E (12). There is no sharp between E and F or between B and C, so each of those pairs sits one fret apart."],bass:["Play the natural notes on the A string from fret 3 up to fret 15, naming each one as you go.","<b>C</b> at fret 3, then D (5), E (7), F (8), G (10), A (12), B (14), C (15). There is no sharp between E and F or between B and C, so each of those pairs sits one fret apart."],uke:["Play the natural notes on the E string from the open string up to fret 12, naming each one as you go.","<b>E</b> open, then F (1), G (3), A (5), B (7), C (8), D (10), E (12). There is no sharp between E and F or between B and C, so each of those pairs sits one fret apart."],piano:["Play the white keys from E up to the next E, naming each one as you go.","<b>E</b>, F, G, A, B, C, D, E. There is no black key between E and F or between B and C, so those pairs sit right next to each other."]},
"cap.8":"The natural notes from E: E F G A B C D",
"t.9":{guitar:["Find every A on the neck within 12 frets and play them from the lowest to the highest.","Low E fret 5, A open, D fret 7, G fret 2, B fret 10 and high E fret 5 — <b>six</b> in all.","Every A on the neck"],bass:["Find every A on the neck within 12 frets and play them from the lowest to the highest.","E fret 5, A open, D fret 7, G fret 2 — <b>four</b> in all.","Every A on the neck"],uke:["Find every A on the neck within 12 frets and play them from the lowest to the highest.","G fret 2, C fret 9, E fret 5 and the open A string — <b>four</b> in all.","Every A on the neck"],piano:["Find every A on the keyboard shown here and play them from the lowest to the highest.","<b>Two</b> in these two octaves. A is the white key between the two black keys of the group of three.","A sits inside the group of three black keys"]},
"t.10":{guitar:["Play a G major scale in one position, then play the same notes starting from D.","G major = G A B C D E F#. Starting on D gives D E F# G A B C, which is D Mixolydian: the same notes with a new home."],piano:["Play a G major scale starting on G, then play the same notes starting from D.","G major = G A B C D E F#. Starting on D gives D E F# G A B C, which is D Mixolydian: the same notes with a new home."]},
"t.11":["Play an A major triad, then lower its third by one semitone and name the chord you get.","A major = A C# E. Lower C# to C and you get A C E, which is <b>A minor</b>."],
"cap.11a":"A major = A C# E","cap.11b":"A minor = A C E",
"t.12":["Play a ii - V - I progression in C major, saying each chord before you play it.","In C: ii = Dm, V = G, I = C. Dm - G - C is the strongest cadence in tonal music."],
"t.13":["Play D Dorian, then D Aeolian, and listen for the note that changes.","D Dorian = D E F G A B C. D Aeolian = D E F G A B♭ C. Only the 6th moves: B becomes B♭."],
"tk.0":["Play every C on the keyboard from the lowest to the highest you can reach, saying the octave number each time.","Every C is the white key just left of a group of two black keys. The octave number changes each time you pass a new C: C3, C4, C5 ..."],
"cap.tk0":"Every C is the white key left of the two black keys",
"tk.1":["Play the white keys from C to C and name each note as you go: that is the C major scale.","C D E F G A B C. The white keys are the natural notes; the black keys are the sharps and flats."],
"cap.tk1":"C major on the white keys = C D E F G A B",
"tk.2":["Find every E on the keyboard and play them in order.","E is the white key to the right of the group of two black keys, so once you spot a C the E is two white keys to its right."],
"cap.tk2":"Every E sits right of the two black keys"
},es:{
"t.0":{guitar:["Toca la escala de do mayor en la 6ª cuerda (mi grave) empezando en el traste 8, diciendo cada nota en voz alta.","<b>Do mayor:</b> do re mi fa sol la si do. El traste 8 de la 6ª cuerda es do; sube con el patrón de la escala mayor (8 → 10 → 12 da do, re, mi)."],bass:["Toca la escala de do mayor en la cuerda la empezando en el traste 3, diciendo cada nota en voz alta.","<b>Do mayor:</b> do re mi fa sol la si do. El traste 3 de la cuerda la es do; sube con el patrón de la escala mayor (3 → 5 → 7 da do, re, mi)."],uke:["Toca la escala de do mayor en la cuerda do empezando al aire, diciendo cada nota en voz alta.","<b>Do mayor:</b> do re mi fa sol la si do. Tu cuerda do ya es do, así que empieza al aire y sube con el patrón de la escala mayor."],piano:["Toca la escala de do mayor en las teclas blancas de do a do, diciendo cada nota en voz alta.","<b>Do mayor:</b> do re mi fa sol la si do. Empieza en cualquier do y usa solo las teclas blancas: el patrón de la escala mayor explica por qué no hay tecla negra entre mi-fa ni entre si-do."]},
"cap.0":"Do mayor = do re mi fa sol la si",
"t.1":["Toca una progresión I - V - vi - IV en sol mayor. Nombra cada acorde antes de tocarlo.","<b>Sol mayor:</b> I = sol, V = re, vi = mim, IV = do, así que el bucle es <b>sol - re - mim - do</b>."],
"t.2":["Toca una 3ª menor ascendente desde tu mi más grave y luego una 3ª mayor desde la misma nota. Escucha la diferencia.","3ª menor sobre mi = sol (3 semitonos). 3ª mayor sobre mi = sol♯ (4 semitonos). La 3ª mayor suena más brillante."],
"t.3":["Toca la fundamental, la 3ª y la 5ª de re menor, y después sube la 3ª un semitono. ¿Qué acorde obtienes?","Re menor = re fa la. Sube fa a fa♯ y tienes re fa♯ la = <b>re mayor</b>. Ese semitono es toda la diferencia."],
"cap.3a":"Re menor = re fa la","cap.3b":"Re mayor = re fa♯ la",
"t.4":{guitar:["Encuentra todos los do del mástil hasta el traste 12. ¿Cuántos hay?","<b>Seis</b>, uno por cuerda: mi grave traste 8, la 3, re 10, sol 5, si 1 y mi agudo 8.","Todos los do del mástil"],bass:["Encuentra todos los do del mástil hasta el traste 12. ¿Cuántos hay?","<b>Cuatro</b>, uno por cuerda: mi 8, la 3, re 10 y sol 5.","Todos los do del mástil"],uke:["Encuentra todos los do del mástil hasta el traste 12. ¿Cuántos hay?","<b>Cuatro</b>: cuerda sol traste 5, cuerda do al aire, cuerda mi traste 8 y cuerda la traste 3.","Todos los do del mástil"],piano:["Encuentra todos los do del teclado que ves. ¿Cuántos hay?","<b>Tres</b> en estas dos octavas: uno al principio de cada octava y el do de arriba. Cada do está justo a la izquierda de un grupo de dos teclas negras.","Cada do está a la izquierda de las dos teclas negras"]},
"t.5":["Toca la menor natural y luego do mayor. Fíjate en que usan exactamente las mismas notas.","La menor natural = la si do re mi fa sol, las mismas notas que do mayor. Solo cambia la nota de reposo."],
"cap.5a":"La menor natural = la si do re mi fa sol","cap.5b":"Do mayor = exactamente las mismas notas",
"t.6":["Toca una 5ª justa ascendente desde la y luego un tritono desde la. Canta cada uno antes de tocarlo.","5ª justa sobre la = mi (7 semitonos). Tritono sobre la = re♯/mi♭ (6 semitonos)."],
"t.7":["Repite cuatro compases sobre un acorde rem7 usando re dórico y cae en las notas del acorde.","Re dórico = re mi fa sol la si do. Las notas de rem7 son re fa la do, así que busca esas en los tiempos fuertes."],
"t.8":{guitar:["Toca las notas naturales de la 6ª cuerda desde al aire hasta el traste 12, nombrando cada una.","<b>Mi</b> al aire, luego fa (1), sol (3), la (5), si (7), do (8), re (10), mi (12). No hay sostenido entre mi-fa ni entre si-do, por eso esos pares quedan a un traste."],bass:["Toca las notas naturales de la cuerda la desde el traste 3 hasta el 15, nombrando cada una.","<b>Do</b> en el traste 3, luego re (5), mi (7), fa (8), sol (10), la (12), si (14), do (15). No hay sostenido entre mi-fa ni entre si-do, por eso esos pares quedan a un traste."],uke:["Toca las notas naturales de la cuerda mi desde al aire hasta el traste 12, nombrando cada una.","<b>Mi</b> al aire, luego fa (1), sol (3), la (5), si (7), do (8), re (10), mi (12). No hay sostenido entre mi-fa ni entre si-do, por eso esos pares quedan a un traste."],piano:["Toca las teclas blancas de mi al siguiente mi, nombrando cada una.","<b>Mi</b>, fa, sol, la, si, do, re, mi. No hay tecla negra entre mi-fa ni entre si-do, así que esos pares están uno al lado del otro."]},
"cap.8":"Las notas naturales desde mi: mi fa sol la si do re",
"t.9":{guitar:["Encuentra todos los la del mástil hasta el traste 12 y tócalos del más grave al más agudo.","Mi grave traste 5, la al aire, re 7, sol 2, si 10 y mi agudo 5: <b>seis</b> en total.","Todos los la del mástil"],bass:["Encuentra todos los la del mástil hasta el traste 12 y tócalos del más grave al más agudo.","Mi 5, la al aire, re 7 y sol 2: <b>cuatro</b> en total.","Todos los la del mástil"],uke:["Encuentra todos los la del mástil hasta el traste 12 y tócalos del más grave al más agudo.","Sol 2, do 9, mi 5 y la al aire: <b>cuatro</b> en total.","Todos los la del mástil"],piano:["Encuentra todos los la del teclado que ves y tócalos del más grave al más agudo.","<b>Dos</b> en estas dos octavas. La es la tecla blanca entre las dos teclas negras del grupo de tres.","La está dentro del grupo de tres teclas negras"]},
"t.10":{guitar:["Toca una escala de sol mayor en una posición y luego las mismas notas empezando en re.","Sol mayor = sol la si do re mi fa♯. Empezando en re sale re mi fa♯ sol la si do, que es re mixolidio: las mismas notas con otra tónica."],piano:["Toca una escala de sol mayor empezando en sol y luego las mismas notas empezando en re.","Sol mayor = sol la si do re mi fa♯. Empezando en re sale re mi fa♯ sol la si do, que es re mixolidio: las mismas notas con otra tónica."]},
"t.11":["Toca la tríada de la mayor y después baja su tercera un semitono. ¿Qué acorde obtienes?","La mayor = la do♯ mi. Baja do♯ a do y tienes la do mi, que es <b>la menor</b>."],
"cap.11a":"La mayor = la do♯ mi","cap.11b":"La menor = la do mi",
"t.12":["Toca una progresión ii - V - I en do mayor, diciendo cada acorde antes de tocarlo.","En do: ii = rem, V = sol, I = do. Rem - sol - do es la cadencia más fuerte de la música tonal."],
"t.13":["Toca re dórico y luego re eólico, y escucha qué nota cambia.","Re dórico = re mi fa sol la si do. Re eólico = re mi fa sol la si♭ do. Solo se mueve la 6ª: si pasa a si♭."],
"tk.0":["Toca todos los do del teclado del más grave al más agudo que alcances, diciendo el número de octava cada vez.","Cada do es la tecla blanca justo a la izquierda de un grupo de dos teclas negras. El número de octava cambia cada vez que pasas un do nuevo: do3, do4, do5..."],
"cap.tk0":"Cada do es la tecla blanca a la izquierda de las dos negras",
"tk.1":["Toca las teclas blancas de do a do y nombra cada nota: esa es la escala de do mayor.","Do re mi fa sol la si do. Las teclas blancas son las notas naturales; las negras son los sostenidos y bemoles."],
"cap.tk1":"Do mayor en las teclas blancas = do re mi fa sol la si",
"tk.2":["Encuentra todos los mi del teclado y tócalos en orden.","Mi es la tecla blanca a la derecha del grupo de dos teclas negras, así que si localizas un do, el mi está dos teclas blancas a su derecha."],
"cap.tk2":"Cada mi está a la derecha de las dos teclas negras"
},it:{
"t.0":{guitar:["Suona la scala di do maggiore sulla 6ª corda (mi grave) partendo dal tasto 8, dicendo ogni nota ad alta voce.","<b>Do maggiore:</b> do re mi fa sol la si do. Il tasto 8 della 6ª corda è do; sali con lo schema della scala maggiore (8 → 10 → 12 dà do, re, mi)."],bass:["Suona la scala di do maggiore sulla corda la partendo dal tasto 3, dicendo ogni nota ad alta voce.","<b>Do maggiore:</b> do re mi fa sol la si do. Il tasto 3 della corda la è do; sali con lo schema della scala maggiore (3 → 5 → 7 dà do, re, mi)."],uke:["Suona la scala di do maggiore sulla corda do partendo dalla corda a vuoto, dicendo ogni nota ad alta voce.","<b>Do maggiore:</b> do re mi fa sol la si do. La tua corda do è già do: parti a vuoto e sali con lo schema della scala maggiore."],piano:["Suona la scala di do maggiore sui tasti bianchi da do a do, dicendo ogni nota ad alta voce.","<b>Do maggiore:</b> do re mi fa sol la si do. Parti da un do qualsiasi e usa solo i tasti bianchi: è per questo che non c’è nessun tasto nero tra mi-fa né tra si-do."]},
"cap.0":"Do maggiore = do re mi fa sol la si",
"t.1":["Suona una progressione I - V - vi - IV in sol maggiore. Nomina ogni accordo prima di suonarlo.","<b>Sol maggiore:</b> I = sol, V = re, vi = mim, IV = do, quindi il giro è <b>sol - re - mim - do</b>."],
"t.2":["Suona una 3ª minore ascendente dal tuo mi più grave, poi una 3ª maggiore dalla stessa nota. Ascolta la differenza.","3ª minore sopra mi = sol (3 semitoni). 3ª maggiore sopra mi = sol♯ (4 semitoni). La 3ª maggiore suona più luminosa."],
"t.3":["Suona fondamentale, 3ª e 5ª di re minore, poi alza la 3ª di un semitono. Che accordo ottieni?","Re minore = re fa la. Alza fa a fa♯ e ottieni re fa♯ la = <b>re maggiore</b>. Quel semitono è tutta la differenza."],
"cap.3a":"Re minore = re fa la","cap.3b":"Re maggiore = re fa♯ la",
"t.4":{guitar:["Trova tutti i do sul manico entro 12 tasti. Quanti sono?","<b>Sei</b>, uno per corda: mi grave tasto 8, la 3, re 10, sol 5, si 1, mi acuto 8.","Tutti i do sul manico"],bass:["Trova tutti i do sul manico entro 12 tasti. Quanti sono?","<b>Quattro</b>, uno per corda: mi 8, la 3, re 10, sol 5.","Tutti i do sul manico"],uke:["Trova tutti i do sul manico entro 12 tasti. Quanti sono?","<b>Quattro</b>: corda sol tasto 5, corda do a vuoto, corda mi tasto 8, corda la tasto 3.","Tutti i do sul manico"],piano:["Trova tutti i do sulla tastiera qui mostrata. Quanti sono?","<b>Tre</b> in queste due ottave: uno all’inizio di ogni ottava, più il do in alto. Ogni do sta appena a sinistra di un gruppo di due tasti neri.","Ogni do sta a sinistra dei due tasti neri"]},
"t.5":["Suona la minore naturale, poi do maggiore. Nota che usano esattamente le stesse note.","La minore naturale = la si do re mi fa sol, le stesse note di do maggiore. Cambia solo la nota di riposo."],
"cap.5a":"La minore naturale = la si do re mi fa sol","cap.5b":"Do maggiore = esattamente le stesse note",
"t.6":["Suona una 5ª giusta ascendente da la, poi un tritono da la. Cantali prima di suonarli.","5ª giusta sopra la = mi (7 semitoni). Tritono sopra la = re♯/mi♭ (6 semitoni)."],
"t.7":["Ripeti quattro battute su un accordo rem7 usando re dorico, fermandoti sulle note dell’accordo.","Re dorico = re mi fa sol la si do. Le note di rem7 sono re fa la do: cerca quelle sui tempi forti."],
"t.8":{guitar:["Suona le note naturali sulla 6ª corda dalla corda a vuoto fino al tasto 12, nominandole una per una.","<b>Mi</b> a vuoto, poi fa (1), sol (3), la (5), si (7), do (8), re (10), mi (12). Non c’è nessun diesis tra mi-fa né tra si-do: per questo quei gruppi stanno a un tasto di distanza."],bass:["Suona le note naturali sulla corda la dal tasto 3 al tasto 15, nominandole una per una.","<b>Do</b> al tasto 3, poi re (5), mi (7), fa (8), sol (10), la (12), si (14), do (15). Non c’è nessun diesis tra mi-fa né tra si-do: per questo quei gruppi stanno a un tasto di distanza."],uke:["Suona le note naturali sulla corda mi dalla corda a vuoto fino al tasto 12, nominandole una per una.","<b>Mi</b> a vuoto, poi fa (1), sol (3), la (5), si (7), do (8), re (10), mi (12). Non c’è nessun diesis tra mi-fa né tra si-do: per questo quei gruppi stanno a un tasto di distanza."],piano:["Suona i tasti bianchi da mi al mi successivo, nominandoli uno per uno.","<b>Mi</b>, fa, sol, la, si, do, re, mi. Non c’è nessun tasto nero tra mi-fa né tra si-do, quindi quei gruppi stanno uno accanto all’altro."]},
"cap.8":"Le note naturali da mi: mi fa sol la si do re",
"t.9":{guitar:["Trova tutti i la sul manico entro 12 tasti e suonali dal più grave al più acuto.","Mi grave tasto 5, la a vuoto, re 7, sol 2, si 10 e mi acuto 5: <b>sei</b> in tutto.","Tutti i la sul manico"],bass:["Trova tutti i la sul manico entro 12 tasti e suonali dal più grave al più acuto.","Mi 5, la a vuoto, re 7, sol 2: <b>quattro</b> in tutto.","Tutti i la sul manico"],uke:["Trova tutti i la sul manico entro 12 tasti e suonali dal più grave al più acuto.","Sol 2, do 9, mi 5 e la a vuoto: <b>quattro</b> in tutto.","Tutti i la sul manico"],piano:["Trova tutti i la sulla tastiera qui mostrata e suonali dal più grave al più acuto.","<b>Due</b> in queste due ottave. La è il tasto bianco tra i due tasti neri del gruppo di tre.","La sta dentro il gruppo di tre tasti neri"]},
"t.10":{guitar:["Suona una scala di sol maggiore in una posizione, poi le stesse note partendo da re.","Sol maggiore = sol la si do re mi fa♯. Partendo da re ottieni re mi fa♯ sol la si do, cioè re misolidio: le stesse note con un’altra casa."],piano:["Suona una scala di sol maggiore partendo da sol, poi le stesse note partendo da re.","Sol maggiore = sol la si do re mi fa♯. Partendo da re ottieni re mi fa♯ sol la si do, cioè re misolidio: le stesse note con un’altra casa."]},
"t.11":["Suona la triade di la maggiore, poi abbassa la terza di un semitono. Che accordo ottieni?","La maggiore = la do♯ mi. Abbassa do♯ a do e ottieni la do mi, cioè <b>la minore</b>."],
"cap.11a":"La maggiore = la do♯ mi","cap.11b":"La minore = la do mi",
"t.12":["Suona una progressione ii - V - I in do maggiore, dicendo ogni accordo prima di suonarlo.","In do: ii = rem, V = sol, I = do. Rem - sol - do è la cadenza più forte della musica tonale."],
"t.13":["Suona re dorico, poi re eolico, e ascolta quale nota cambia.","Re dorico = re mi fa sol la si do. Re eolico = re mi fa sol la si♭ do. Si muove solo la 6ª: si diventa si♭."],
"tk.0":["Suona tutti i do della tastiera dal più grave al più acuto che raggiungi, dicendo il numero di ottava ogni volta.","Ogni do è il tasto bianco appena a sinistra di un gruppo di due tasti neri. Il numero di ottava cambia ogni volta che passi un nuovo do: do3, do4, do5..."],
"cap.tk0":"Ogni do è il tasto bianco a sinistra dei due tasti neri",
"tk.1":["Suona i tasti bianchi da do a do e nomina ogni nota: è la scala di do maggiore.","Do re mi fa sol la si do. I tasti bianchi sono le note naturali; quelli neri sono i diesis e i bemolli."],
"cap.tk1":"Do maggiore sui tasti bianchi = do re mi fa sol la si",
"tk.2":["Trova tutti i mi sulla tastiera e suonali in ordine.","Mi è il tasto bianco a destra del gruppo di due tasti neri: se trovi un do, il mi è due tasti bianchi alla sua destra."],
"cap.tk2":"Ogni mi sta a destra dei due tasti neri"
},pt:{
"t.0":{guitar:["Toque a escala de dó maior na 6ª corda (mi grave) começando na casa 8, dizendo cada nota em voz alta.","<b>Dó maior:</b> dó ré mi fá sol lá si dó. A casa 8 da 6ª corda é dó; suba com o padrão da escala maior (8 → 10 → 12 dá dó, ré, mi)."],bass:["Toque a escala de dó maior na corda lá começando na casa 3, dizendo cada nota em voz alta.","<b>Dó maior:</b> dó ré mi fá sol lá si dó. A casa 3 da corda lá é dó; suba com o padrão da escala maior (3 → 5 → 7 dá dó, ré, mi)."],uke:["Toque a escala de dó maior na corda dó começando na corda solta, dizendo cada nota em voz alta.","<b>Dó maior:</b> dó ré mi fá sol lá si dó. Sua corda dó já é dó: comece solta e suba com o padrão da escala maior."],piano:["Toque a escala de dó maior nas teclas brancas de dó a dó, dizendo cada nota em voz alta.","<b>Dó maior:</b> dó ré mi fá sol lá si dó. Comece em qualquer dó e use só as teclas brancas: é por isso que não há tecla preta entre mi-fá nem entre si-dó."]},
"cap.0":"Dó maior = dó ré mi fá sol lá si",
"t.1":["Toque uma progressão I - V - vi - IV em sol maior. Nomeie cada acorde antes de tocar.","<b>Sol maior:</b> I = sol, V = ré, vi = mim, IV = dó, então o ciclo é <b>sol - ré - mim - dó</b>."],
"t.2":["Toque uma 3ª menor acima do seu mi mais grave e depois uma 3ª maior a partir da mesma nota. Escute a diferença.","3ª menor acima de mi = sol (3 semitons). 3ª maior acima de mi = sol♯ (4 semitons). A 3ª maior soa mais brilhante."],
"t.3":["Toque a fundamental, a 3ª e a 5ª de ré menor e depois suba a 3ª um semitom. Que acorde você obtém?","Ré menor = ré fá lá. Suba fá para fá♯ e você tem ré fá♯ lá = <b>ré maior</b>. Esse semitom é toda a diferença."],
"cap.3a":"Ré menor = ré fá lá","cap.3b":"Ré maior = ré fá♯ lá",
"t.4":{guitar:["Encontre todos os dó no braço até a casa 12. Quantos são?","<b>Seis</b>, um por corda: mi grave casa 8, lá 3, ré 10, sol 5, si 1, mi agudo 8.","Todos os dó no braço"],bass:["Encontre todos os dó no braço até a casa 12. Quantos são?","<b>Quatro</b>, um por corda: mi 8, lá 3, ré 10, sol 5.","Todos os dó no braço"],uke:["Encontre todos os dó no braço até a casa 12. Quantos são?","<b>Quatro</b>: corda sol casa 5, corda dó solta, corda mi casa 8, corda lá casa 3.","Todos os dó no braço"],piano:["Encontre todos os dó no teclado mostrado. Quantos são?","<b>Três</b> nestas duas oitavas: um no início de cada oitava, mais o dó de cima. Todo dó fica logo à esquerda de um grupo de duas teclas pretas.","Todo dó fica à esquerda das duas teclas pretas"]},
"t.5":["Toque lá menor natural e depois dó maior. Repare que usam exatamente as mesmas notas.","Lá menor natural = lá si dó ré mi fá sol, as mesmas notas de dó maior. Só muda a nota de repouso."],
"cap.5a":"Lá menor natural = lá si dó ré mi fá sol","cap.5b":"Dó maior = exatamente as mesmas notas",
"t.6":["Toque uma 5ª justa acima de lá e depois um trítono acima de lá. Cante cada um antes de tocar.","5ª justa acima de lá = mi (7 semitons). Trítono acima de lá = ré♯/mi♭ (6 semitons)."],
"t.7":["Repita quatro compassos sobre um acorde rém7 usando ré dórico, caindo nas notas do acorde.","Ré dórico = ré mi fá sol lá si dó. As notas de rém7 são ré fá lá dó, então mire nelas nos tempos fortes."],
"t.8":{guitar:["Toque as notas naturais na 6ª corda da corda solta até a casa 12, nomeando cada uma.","<b>Mi</b> solta, depois fá (1), sol (3), lá (5), si (7), dó (8), ré (10), mi (12). Não há sustenido entre mi-fá nem entre si-dó, por isso esses pares ficam a uma casa."],bass:["Toque as notas naturais na corda lá da casa 3 até a 15, nomeando cada uma.","<b>Dó</b> na casa 3, depois ré (5), mi (7), fá (8), sol (10), lá (12), si (14), dó (15). Não há sustenido entre mi-fá nem entre si-dó, por isso esses pares ficam a uma casa."],uke:["Toque as notas naturais na corda mi da corda solta até a casa 12, nomeando cada uma.","<b>Mi</b> solta, depois fá (1), sol (3), lá (5), si (7), dó (8), ré (10), mi (12). Não há sustenido entre mi-fá nem entre si-dó, por isso esses pares ficam a uma casa."],piano:["Toque as teclas brancas de mi até o próximo mi, nomeando cada uma.","<b>Mi</b>, fá, sol, lá, si, dó, ré, mi. Não há tecla preta entre mi-fá nem entre si-dó, então esses pares ficam lado a lado."]},
"cap.8":"As notas naturais a partir de mi: mi fá sol lá si dó ré",
"t.9":{guitar:["Encontre todos os lá no braço até a casa 12 e toque do mais grave ao mais agudo.","Mi grave casa 5, lá solta, ré 7, sol 2, si 10 e mi agudo 5: <b>seis</b> no total.","Todos os lá no braço"],bass:["Encontre todos os lá no braço até a casa 12 e toque do mais grave ao mais agudo.","Mi 5, lá solta, ré 7, sol 2: <b>quatro</b> no total.","Todos os lá no braço"],uke:["Encontre todos os lá no braço até a casa 12 e toque do mais grave ao mais agudo.","Sol 2, dó 9, mi 5 e lá solta: <b>quatro</b> no total.","Todos os lá no braço"],piano:["Encontre todos os lá no teclado mostrado e toque do mais grave ao mais agudo.","<b>Dois</b> nestas duas oitavas. Lá é a tecla branca entre as duas teclas pretas do grupo de três.","Lá fica dentro do grupo de três teclas pretas"]},
"t.10":{guitar:["Toque uma escala de sol maior numa posição e depois as mesmas notas começando em ré.","Sol maior = sol lá si dó ré mi fá♯. Começando em ré sai ré mi fá♯ sol lá si dó, que é ré mixolídio: as mesmas notas com outra tônica."],piano:["Toque uma escala de sol maior começando em sol e depois as mesmas notas começando em ré.","Sol maior = sol lá si dó ré mi fá♯. Começando em ré sai ré mi fá♯ sol lá si dó, que é ré mixolídio: as mesmas notas com outra tônica."]},
"t.11":["Toque a tríade de lá maior e depois baixe a terça um semitom. Que acorde você obtém?","Lá maior = lá dó♯ mi. Baixe dó♯ para dó e você tem lá dó mi, que é <b>lá menor</b>."],
"cap.11a":"Lá maior = lá dó♯ mi","cap.11b":"Lá menor = lá dó mi",
"t.12":["Toque uma progressão ii - V - I em dó maior, dizendo cada acorde antes de tocar.","Em dó: ii = rém, V = sol, I = dó. Rém - sol - dó é a cadência mais forte da música tonal."],
"t.13":["Toque ré dórico e depois ré eólio, escutando qual nota muda.","Ré dórico = ré mi fá sol lá si dó. Ré eólio = ré mi fá sol lá si♭ dó. Só a 6ª se move: si vira si♭."],
"tk.0":["Toque todos os dó do teclado do mais grave ao mais agudo que alcançar, dizendo o número da oitava a cada um.","Todo dó é a tecla branca logo à esquerda de um grupo de duas teclas pretas. O número da oitava muda sempre que você passa por um novo dó: dó3, dó4, dó5..."],
"cap.tk0":"Todo dó é a tecla branca à esquerda das duas pretas",
"tk.1":["Toque as teclas brancas de dó a dó e nomeie cada nota: é a escala de dó maior.","Dó ré mi fá sol lá si dó. As teclas brancas são as notas naturais; as pretas são os sustenidos e bemóis."],
"cap.tk1":"Dó maior nas teclas brancas = dó ré mi fá sol lá si",
"tk.2":["Encontre todos os mi no teclado e toque em ordem.","Mi é a tecla branca à direita do grupo de duas teclas pretas, então se você achar um dó, o mi está duas teclas brancas à direita."],
"cap.tk2":"Todo mi fica à direita das duas teclas pretas"
},fr:{
"t.0":{guitar:["Joue la gamme de do majeur sur la 6e corde (mi grave) à partir de la case 8, en nommant chaque note à voix haute.","<b>Do majeur :</b> do ré mi fa sol la si do. La case 8 de la 6e corde est un do ; monte avec le schéma de la gamme majeure (8 → 10 → 12 donne do, ré, mi)."],bass:["Joue la gamme de do majeur sur la corde de la à partir de la case 3, en nommant chaque note à voix haute.","<b>Do majeur :</b> do ré mi fa sol la si do. La case 3 de la corde de la est un do ; monte avec le schéma de la gamme majeure (3 → 5 → 7 donne do, ré, mi)."],uke:["Joue la gamme de do majeur sur la corde de do à partir de la corde à vide, en nommant chaque note à voix haute.","<b>Do majeur :</b> do ré mi fa sol la si do. Ta corde de do est déjà un do : pars à vide et monte avec le schéma de la gamme majeure."],piano:["Joue la gamme de do majeur sur les touches blanches de do à do, en nommant chaque note à voix haute.","<b>Do majeur :</b> do ré mi fa sol la si do. Pars de n’importe quel do et n’utilise que les touches blanches : c’est pourquoi aucune touche noire ne sépare mi-fa ni si-do."]},
"cap.0":"Do majeur = do ré mi fa sol la si",
"t.1":["Joue une progression I - V - vi - IV en sol majeur. Nomme chaque accord avant de le jouer.","<b>Sol majeur :</b> I = sol, V = ré, vi = mim, IV = do, donc la boucle est <b>sol - ré - mim - do</b>."],
"t.2":["Joue une 3ce mineure au-dessus de ton mi le plus grave, puis une 3ce majeure depuis la même note. Écoute la différence.","3ce mineure au-dessus de mi = sol (3 demi-tons). 3ce majeure au-dessus de mi = sol♯ (4 demi-tons). La 3ce majeure sonne plus claire."],
"t.3":["Joue la fondamentale, la 3ce et la 5te de ré mineur, puis monte la 3ce d’un demi-ton. Quel accord obtiens-tu ?","Ré mineur = ré fa la. Monte fa en fa♯ et tu obtiens ré fa♯ la = <b>ré majeur</b>. Ce demi-ton fait toute la différence."],
"cap.3a":"Ré mineur = ré fa la","cap.3b":"Ré majeur = ré fa♯ la",
"t.4":{guitar:["Trouve tous les do du manche jusqu’à la case 12. Combien y en a-t-il ?","<b>Six</b>, un par corde : mi grave case 8, la 3, ré 10, sol 5, si 1, mi aigu 8.","Tous les do du manche"],bass:["Trouve tous les do du manche jusqu’à la case 12. Combien y en a-t-il ?","<b>Quatre</b>, un par corde : mi 8, la 3, ré 10, sol 5.","Tous les do du manche"],uke:["Trouve tous les do du manche jusqu’à la case 12. Combien y en a-t-il ?","<b>Quatre</b> : corde de sol case 5, corde de do à vide, corde de mi case 8, corde de la case 3.","Tous les do du manche"],piano:["Trouve tous les do du clavier affiché. Combien y en a-t-il ?","<b>Trois</b> dans ces deux octaves : un au début de chaque octave, plus le do du haut. Chaque do se trouve juste à gauche d’un groupe de deux touches noires.","Chaque do est à gauche des deux touches noires"]},
"t.5":["Joue la mineure naturelle de la, puis do majeur. Remarque qu’elles utilisent exactement les mêmes notes.","La mineur naturel = la si do ré mi fa sol, les mêmes notes que do majeur. Seule la note de repos change."],
"cap.5a":"La mineur naturel = la si do ré mi fa sol","cap.5b":"Do majeur = exactement les mêmes notes",
"t.6":["Joue une 5te juste au-dessus de la, puis un triton au-dessus de la. Chante-les avant de les jouer.","5te juste au-dessus de la = mi (7 demi-tons). Triton au-dessus de la = ré♯/mi♭ (6 demi-tons)."],
"t.7":["Boucle quatre mesures sur un accord rém7 en ré dorien, en retombant sur les notes de l’accord.","Ré dorien = ré mi fa sol la si do. Les notes de rém7 sont ré fa la do : vise-les sur les temps forts."],
"t.8":{guitar:["Joue les notes naturelles sur la 6e corde de la corde à vide jusqu’à la case 12, en les nommant une à une.","<b>Mi</b> à vide, puis fa (1), sol (3), la (5), si (7), do (8), ré (10), mi (12). Il n’y a pas de dièse entre mi-fa ni entre si-do : ces couples ne sont donc séparés que d’une case."],bass:["Joue les notes naturelles sur la corde de la de la case 3 à la case 15, en les nommant une à une.","<b>Do</b> case 3, puis ré (5), mi (7), fa (8), sol (10), la (12), si (14), do (15). Il n’y a pas de dièse entre mi-fa ni entre si-do : ces couples ne sont donc séparés que d’une case."],uke:["Joue les notes naturelles sur la corde de mi de la corde à vide jusqu’à la case 12, en les nommant une à une.","<b>Mi</b> à vide, puis fa (1), sol (3), la (5), si (7), do (8), ré (10), mi (12). Il n’y a pas de dièse entre mi-fa ni entre si-do : ces couples ne sont donc séparés que d’une case."],piano:["Joue les touches blanches de mi au mi suivant, en les nommant une à une.","<b>Mi</b>, fa, sol, la, si, do, ré, mi. Il n’y a pas de touche noire entre mi-fa ni entre si-do : ces couples sont donc côte à côte."]},
"cap.8":"Les notes naturelles depuis mi : mi fa sol la si do ré",
"t.9":{guitar:["Trouve tous les la du manche jusqu’à la case 12 et joue-les du plus grave au plus aigu.","Mi grave case 5, la à vide, ré 7, sol 2, si 10 et mi aigu 5 : <b>six</b> en tout.","Tous les la du manche"],bass:["Trouve tous les la du manche jusqu’à la case 12 et joue-les du plus grave au plus aigu.","Mi 5, la à vide, ré 7, sol 2 : <b>quatre</b> en tout.","Tous les la du manche"],uke:["Trouve tous les la du manche jusqu’à la case 12 et joue-les du plus grave au plus aigu.","Sol 2, do 9, mi 5 et la à vide : <b>quatre</b> en tout.","Tous les la du manche"],piano:["Trouve tous les la du clavier affiché et joue-les du plus grave au plus aigu.","<b>Deux</b> dans ces deux octaves. La est la touche blanche entre les deux touches noires du groupe de trois.","La se trouve dans le groupe de trois touches noires"]},
"t.10":{guitar:["Joue une gamme de sol majeur dans une position, puis les mêmes notes en partant de ré.","Sol majeur = sol la si do ré mi fa♯. En partant de ré on obtient ré mi fa♯ sol la si do, soit ré mixolydien : les mêmes notes avec une nouvelle tonique."],piano:["Joue une gamme de sol majeur en partant de sol, puis les mêmes notes en partant de ré.","Sol majeur = sol la si do ré mi fa♯. En partant de ré on obtient ré mi fa♯ sol la si do, soit ré mixolydien : les mêmes notes avec une nouvelle tonique."]},
"t.11":["Joue la triade de la majeur, puis abaisse sa tierce d’un demi-ton. Quel accord obtiens-tu ?","La majeur = la do♯ mi. Abaisse do♯ en do et tu obtiens la do mi, soit <b>la mineur</b>."],
"cap.11a":"La majeur = la do♯ mi","cap.11b":"La mineur = la do mi",
"t.12":["Joue une progression ii - V - I en do majeur, en nommant chaque accord avant de le jouer.","En do : ii = rém, V = sol, I = do. Rém - sol - do est la cadence la plus forte de la musique tonale."],
"t.13":["Joue ré dorien, puis ré éolien, et écoute la note qui change.","Ré dorien = ré mi fa sol la si do. Ré éolien = ré mi fa sol la si♭ do. Seule la 6te bouge : si devient si♭."],
"tk.0":["Joue tous les do du clavier du plus grave au plus aigu que tu peux atteindre, en disant le numéro d’octave à chaque fois.","Chaque do est la touche blanche juste à gauche d’un groupe de deux touches noires. Le numéro d’octave change à chaque nouveau do : do3, do4, do5..."],
"cap.tk0":"Chaque do est la touche blanche à gauche des deux touches noires",
"tk.1":["Joue les touches blanches de do à do et nomme chaque note : c’est la gamme de do majeur.","Do ré mi fa sol la si do. Les touches blanches sont les notes naturelles ; les noires sont les dièses et les bémols."],
"cap.tk1":"Do majeur sur les touches blanches = do ré mi fa sol la si",
"tk.2":["Trouve tous les mi du clavier et joue-les dans l’ordre.","Mi est la touche blanche à droite du groupe de deux touches noires : si tu repères un do, le mi est deux touches blanches à sa droite."],
"cap.tk2":"Chaque mi est à droite des deux touches noires"
},de:{
"t.0":{guitar:["Spiele die C-Dur-Tonleiter auf der tiefen E-Saite ab dem 8. Bund und benenne dabei jede Note laut.","<b>C-Dur:</b> C D E F G A B C. Der 8. Bund der tiefen E-Saite ist C. Steige mit dem Dur-Muster auf (8 → 10 → 12 ergibt C, D, E)."],bass:["Spiele die C-Dur-Tonleiter auf der A-Saite ab dem 3. Bund und benenne dabei jede Note laut.","<b>C-Dur:</b> C D E F G A B C. Der 3. Bund der A-Saite ist C. Steige mit dem Dur-Muster auf (3 → 5 → 7 ergibt C, D, E)."],uke:["Spiele die C-Dur-Tonleiter auf der C-Saite von der leeren Saite an und benenne dabei jede Note laut.","<b>C-Dur:</b> C D E F G A B C. Deine C-Saite ist schon C, beginne also leer und steige mit dem Dur-Muster auf."],piano:["Spiele die C-Dur-Tonleiter auf den weißen Tasten von C bis C und benenne dabei jede Note laut.","<b>C-Dur:</b> C D E F G A B C. Beginne auf einem beliebigen C und nutze nur die weißen Tasten: deshalb liegt zwischen E-F und zwischen B-C keine schwarze Taste."]},
"cap.0":"C-Dur = C D E F G A B",
"t.1":["Spiele eine I - V - vi - IV-Progression in G-Dur. Benenne jeden Akkord, bevor du ihn spielst.","<b>G-Dur:</b> I = G, V = D, vi = Em, IV = C, die Schleife ist also <b>G - D - Em - C</b>."],
"t.2":["Spiele eine kleine Terz über deinem tiefsten E und dann eine große Terz über derselben Note. Höre den Unterschied.","Kleine Terz über E = G (3 Halbtöne). Große Terz über E = G♯ (4 Halbtöne). Die große Terz klingt heller."],
"t.3":["Spiele Grundton, Terz und Quinte von D-Moll und erhöhe dann die Terz um einen Halbton. Welcher Akkord entsteht?","D-Moll = D F A. Erhöhe F zu F♯ und du erhältst D F♯ A = <b>D-Dur</b>. Dieser eine Halbton ist der ganze Unterschied."],
"cap.3a":"D-Moll = D F A","cap.3b":"D-Dur = D F♯ A",
"t.4":{guitar:["Finde alle C auf dem Griffbrett bis zum 12. Bund. Wie viele sind es?","<b>Sechs</b>, eines pro Saite: tiefe E-Saite 8. Bund, A 3, D 10, G 5, B 1, hohe E 8.","Alle C auf dem Griffbrett"],bass:["Finde alle C auf dem Griffbrett bis zum 12. Bund. Wie viele sind es?","<b>Vier</b>, eines pro Saite: E 8, A 3, D 10, G 5.","Alle C auf dem Griffbrett"],uke:["Finde alle C auf dem Griffbrett bis zum 12. Bund. Wie viele sind es?","<b>Vier</b>: G-Saite 5. Bund, C-Saite leer, E-Saite 8. Bund, A-Saite 3. Bund.","Alle C auf dem Griffbrett"],piano:["Finde alle C auf der gezeigten Tastatur. Wie viele sind es?","<b>Drei</b> in diesen zwei Oktaven: eines am Anfang jeder Oktave und das obere C. Jedes C liegt direkt links neben einer Gruppe aus zwei schwarzen Tasten.","Jedes C liegt links neben den zwei schwarzen Tasten"]},
"t.5":["Spiele A-Moll natürlich und dann C-Dur. Beachte, dass beide genau dieselben Noten haben.","A-Moll natürlich = A B C D E F G, dieselben Noten wie C-Dur. Nur der Ruheton ändert sich."],
"cap.5a":"A-Moll natürlich = A B C D E F G","cap.5b":"C-Dur = genau dieselben Noten",
"t.6":["Spiele eine reine Quinte über A und dann einen Tritonus über A. Singe beides, bevor du es spielst.","Reine Quinte über A = E (7 Halbtöne). Tritonus über A = D♯/E♭ (6 Halbtöne)."],
"t.7":["Wiederhole vier Takte über einem Dm7-Akkord in D-Dorisch und lande auf den Akkordtönen.","D-Dorisch = D E F G A B C. Die Akkordtöne von Dm7 sind D F A C, ziele auf den schweren Zählzeiten darauf."],
"t.8":{guitar:["Spiele die Stammtöne auf der tiefen E-Saite von der leeren Saite bis zum 12. Bund und benenne jeden.","<b>E</b> leer, dann F (1), G (3), A (5), B (7), C (8), D (10), E (12). Zwischen E-F und zwischen B-C gibt es kein Kreuz, deshalb liegen diese Paare nur einen Bund auseinander."],bass:["Spiele die Stammtöne auf der A-Saite vom 3. bis zum 15. Bund und benenne jeden.","<b>C</b> im 3. Bund, dann D (5), E (7), F (8), G (10), A (12), B (14), C (15). Zwischen E-F und zwischen B-C gibt es kein Kreuz, deshalb liegen diese Paare nur einen Bund auseinander."],uke:["Spiele die Stammtöne auf der E-Saite von der leeren Saite bis zum 12. Bund und benenne jeden.","<b>E</b> leer, dann F (1), G (3), A (5), B (7), C (8), D (10), E (12). Zwischen E-F und zwischen B-C gibt es kein Kreuz, deshalb liegen diese Paare nur einen Bund auseinander."],piano:["Spiele die weißen Tasten von E bis zum nächsten E und benenne jede.","<b>E</b>, F, G, A, B, C, D, E. Zwischen E-F und zwischen B-C liegt keine schwarze Taste, diese Paare liegen also direkt nebeneinander."]},
"cap.8":"Die Stammtöne ab E: E F G A B C D",
"t.9":{guitar:["Finde alle A auf dem Griffbrett bis zum 12. Bund und spiele sie vom tiefsten zum höchsten.","Tiefe E-Saite 5. Bund, A leer, D 7, G 2, B 10 und hohe E 5: insgesamt <b>sechs</b>.","Alle A auf dem Griffbrett"],bass:["Finde alle A auf dem Griffbrett bis zum 12. Bund und spiele sie vom tiefsten zum höchsten.","E 5, A leer, D 7, G 2: insgesamt <b>vier</b>.","Alle A auf dem Griffbrett"],uke:["Finde alle A auf dem Griffbrett bis zum 12. Bund und spiele sie vom tiefsten zum höchsten.","G 2, C 9, E 5 und die leere A-Saite: insgesamt <b>vier</b>.","Alle A auf dem Griffbrett"],piano:["Finde alle A auf der gezeigten Tastatur und spiele sie vom tiefsten zum höchsten.","<b>Zwei</b> in diesen zwei Oktaven. A ist die weiße Taste zwischen den zwei schwarzen Tasten der Dreiergruppe.","A liegt in der Dreiergruppe der schwarzen Tasten"]},
"t.10":{guitar:["Spiele eine G-Dur-Tonleiter in einer Lage und dann dieselben Noten ab D.","G-Dur = G A B C D E F♯. Ab D ergibt das D E F♯ G A B C, also D-Mixolydisch: dieselben Noten mit einem neuen Grundton."],piano:["Spiele eine G-Dur-Tonleiter ab G und dann dieselben Noten ab D.","G-Dur = G A B C D E F♯. Ab D ergibt das D E F♯ G A B C, also D-Mixolydisch: dieselben Noten mit einem neuen Grundton."]},
"t.11":["Spiele einen A-Dur-Dreiklang und senke dann die Terz um einen Halbton. Welcher Akkord entsteht?","A-Dur = A C♯ E. Senke C♯ zu C und du erhältst A C E, also <b>A-Moll</b>."],
"cap.11a":"A-Dur = A C♯ E","cap.11b":"A-Moll = A C E",
"t.12":["Spiele eine ii - V - I-Progression in C-Dur und sage jeden Akkord, bevor du ihn spielst.","In C: ii = Dm, V = G, I = C. Dm - G - C ist die stärkste Kadenz der tonalen Musik."],
"t.13":["Spiele D-Dorisch und dann D-Äolisch und höre, welche Note sich ändert.","D-Dorisch = D E F G A B C. D-Äolisch = D E F G A B♭ C. Nur die 6. Stufe wandert: B wird B♭."],
"tk.0":["Spiele alle C der Tastatur vom tiefsten bis zum höchsten, das du erreichst, und nenne jedes Mal die Oktavzahl.","Jedes C ist die weiße Taste direkt links neben einer Gruppe aus zwei schwarzen Tasten. Die Oktavzahl ändert sich bei jedem neuen C: C3, C4, C5 ..."],
"cap.tk0":"Jedes C ist die weiße Taste links der zwei schwarzen",
"tk.1":["Spiele die weißen Tasten von C bis C und benenne jede Note: das ist die C-Dur-Tonleiter.","C D E F G A B C. Die weißen Tasten sind die Stammtöne, die schwarzen die Kreuze und Bes."],
"cap.tk1":"C-Dur auf den weißen Tasten = C D E F G A B",
"tk.2":["Finde alle E auf der Tastatur und spiele sie der Reihe nach.","E ist die weiße Taste rechts neben der Gruppe aus zwei schwarzen Tasten: Wenn du ein C gefunden hast, liegt das E zwei weiße Tasten rechts davon."],
"cap.tk2":"Jedes E liegt rechts der zwei schwarzen Tasten"
}};

"q.iv.semi":`What interval is <span class="big">{a} \u2192 {u}</span> (going up)?`,
"w.iv.semi":`Count the semitones from {a} up to {u}: {s}. {s} semitones is a <b>{ans}</b>. The \u201cquality\u201d (major/minor/perfect) is just a label for how many semitones the distance spans, so memorise the semitone count and the name follows.`,
"q.iv.ear":`The first note is <span class="big">{r}</span>. Listen to the second note: what interval is it?`,
"w.iv.ear":`It was <b>{ans}</b> ({s} {unit}). Memory hook: <i>{song}</i>. Songs work because they lock the interval to a melody you already carry in your head. Try singing the hook, then the interval you just heard.`,
"q.sc.degree":`What is the {d} note of the <span class="big">{kn}</span> scale?`,
"w.sc.degree":`{kn} = {sc}. Apply W-W-H-W-W-W-H starting on {k}. Each letter name is used once, which is why it is spelled {ans} and not an enharmonic twin: the {d} degree must be a \u201c{letter}\u201d note.`,
"q.min.degree":`What is the {d} note of the <span class="big">{kn}</span> scale?`,
"w.min.degree":`{kn} = {sc}. Apply W-H-W-W-H-W-W starting on {k}; each letter is used once, so the {d} note is spelled with \u201c{letter}\u201d.`,
"w.min.low":` The {d} degree is lowered (\u266d{n}) compared with the major scale, which is a typical minor sound.`,
"q.rel.min":`What is the relative minor of <span class="big">{kk}</span>?`,
"w.rel.min":`{kk} = {sc}. Its 6th note is {n}, so the relative minor is <b>{ans}</b>, and it uses the same notes: {cyc}. Careful: {kx} (same root) is the <i>parallel</i> minor, a different key with different notes.`,
"q.rel.maj":`What is the relative major of <span class="big">{kk}</span>?`,
"w.rel.maj":`{kk} = {sc}. Its 3rd note is {n} (3 semitones above {k}), so the relative major is <b>{ans}</b>, with the same notes: {cyc}. {kx} (same root) would be the <i>parallel</i> major, a different key.`,
"q.tri.deg":`Which chord has the degrees <span class="big">{deg}</span> (root, third, fifth)?`,
"w.tri.deg":`<b>{q}</b> = {deg}: the root, {exp}. On {r} that gives {ans}.`,
"q.tri.notes":`Which notes make the <span class="big">{kn}</span> triad?`,
"w.tri.notes":`{kn} has the degrees {deg}: root {r}, {exp}. That means the third is {th} ({ts} semitones up) and the fifth is {fi} ({fs} semitones up).`,
"q.harm":`In <span class="big">{kk}</span>, what is the chord built on the {d} note ({rom})?`,
"w.harm":`Take every other scale note from {t0}: {t}. The thirds are {a} then {b} semitones, giving <b>{ans}</b> ({rom}). The scale's own notes decide the quality, which is why the pattern is identical in every major key.`,
"q.scale.notes":`What are the notes of <span class="big">{kn}</span>?`,
"w.scale.notes":`{kn} = {ans}. Start on {k} and follow {pat}. Each letter is used once (the 8th note repeats the root), with # or b added only where the pattern needs it. Check the 3rd, 6th and 7th first: they are what separate major from minor.`,
"q.diagram.scale":`Which diagram shows the <span class="big">{kn}</span> scale across {rg}?<br><small style="color:var(--mut);font:13px system-ui,sans-serif">{tune}. The highlighted dots are the root.</small>`,
"w.diagram.scale":`{kn} = {sc}. Each diagram marks every scale note across {rg}; the root is highlighted. Find the root first, then check the pattern ({pat}): the {q} shape has {ch}. {rep}The captions now show which key and mode each wrong diagram really was.`,
"w.diagram.ch.maj":`a natural 3rd, 6th and 7th`,"w.diagram.ch.min":`a lowered 3rd, 6th and 7th`,

"w.iv.semi":`Compte les demi-tons de {a} \u00e0 {u} : {s}. {s} demi-tons, c\u2019est une <b>{ans}</b>. La \u00ab qualit\u00e9 \u00bb (majeure/mineure/juste) indique seulement combien de demi-tons l\u2019\u00e9cart couvre : retiens le nombre, le nom suit.`,
"q.iv.ear":`La premi\u00e8re note est <span class="big">{r}</span>. \u00c9coute la deuxi\u00e8me note : quel est l\u2019intervalle ?`,
"w.iv.ear":`C\u2019\u00e9tait une <b>{ans}</b> ({s} {unit}). Moyen mn\u00e9motechnique : <i>{song}</i>. Les chansons marchent parce qu\u2019elles accrochent l\u2019intervalle \u00e0 une m\u00e9lodie que tu as d\u00e9j\u00e0 en t\u00eate. Chante le d\u00e9but, puis l\u2019intervalle que tu viens d\u2019entendre.`,
"q.sc.degree":`Quelle est la {d} note de la gamme <span class="big">{kn}</span> ?`,
"w.sc.degree":`{kn} = {sc}. Applique le sch\u00e9ma de la gamme majeure en partant de {k}. Chaque nom de note sert une fois : c\u2019est pourquoi on \u00e9crit {ans} et non son \u00e9quivalent enharmonique. La {d} note doit \u00eatre une \u00ab {letter} \u00bb.`,
"q.min.degree":`Quelle est la {d} note de la gamme <span class="big">{kn}</span> ?`,
"w.min.degree":`{kn} = {sc}. Applique le sch\u00e9ma de la mineure naturelle en partant de {k} ; chaque nom sert une fois, donc la {d} note s\u2019\u00e9crit avec \u00ab {letter} \u00bb.`,
"w.min.low":` La {d} note est abaiss\u00e9e (\u266d{n}) par rapport \u00e0 la gamme majeure : c\u2019est le son typique du mineur.`,
"q.rel.min":`Quelle est la relative mineure de <span class="big">{kk}</span> ?`,
"w.rel.min":`{kk} = {sc}. Sa 6te note est {n}, donc la relative mineure est <b>{ans}</b> et utilise les m\u00eames notes : {cyc}. Attention : {kx} (m\u00eame tonique) est la relative <i>parall\u00e8le</i>, une autre tonalit\u00e9 avec d\u2019autres notes.`,
"q.rel.maj":`Quelle est la relative majeure de <span class="big">{kk}</span> ?`,
"w.rel.maj":`{kk} = {sc}. Sa 3ce note est {n} (3 demi-tons au-dessus de {k}), donc la relative majeure est <b>{ans}</b>, avec les m\u00eames notes : {cyc}. {kx} (m\u00eame tonique) serait la relative <i>parall\u00e8le</i>, une autre tonalit\u00e9.`,
"q.tri.deg":`Quel accord a les degr\u00e9s <span class="big">{deg}</span> (fondamentale, tierce et quinte) ?`,
"w.tri.deg":`<b>{q}</b> = {deg} : la fondamentale, {exp}. Sur {r}, cela donne {ans}.`,
"q.tri.notes":`Quelles notes forment l\u2019accord <span class="big">{kn}</span> ?`,
"w.tri.notes":`{kn} a les degr\u00e9s {deg} : fondamentale {r}, {exp}. La tierce est donc {th} ({ts} demi-tons) et la quinte {fi} ({fs} demi-tons).`,
"q.harm":`En <span class="big">{kk}</span>, comment est l\u2019accord construit sur la {d} note ({rom}) ?`,
"w.harm":`Prends une note sur deux \u00e0 partir de {t0} : {t}. Les tierces valent {a} puis {b} demi-tons, ce qui donne <b>{ans}</b> ({rom}). Ce sont les notes de la gamme qui d\u00e9cident de la qualit\u00e9 : c\u2019est pourquoi le sch\u00e9ma est identique dans toutes les tonalit\u00e9s majeures.`,
"q.scale.notes":`Quelles sont les notes de <span class="big">{kn}</span> ?`,
"w.scale.notes":`{kn} = {ans}. Pars de {k} et suis {pat}. Chaque lettre sert une fois (la 8te r\u00e9p\u00e8te la tonique), avec # ou \u266d uniquement l\u00e0 o\u00f9 le sch\u00e9ma l\u2019exige. Regarde d\u2019abord la 3ce, la 6te et la 7me : ce sont elles qui s\u00e9parent majeur et mineur.`,
"q.diagram.scale":`Quel sch\u00e9ma montre la gamme <span class="big">{kn}</span> sur {rg} ?<br><small style="color:var(--mut);font:13px system-ui,sans-serif">{tune}. Les points mis en \u00e9vidence sont la tonique.</small>`,
"w.diagram.scale":`{kn} = {sc}. Chaque sch\u00e9ma marque toutes les notes de la gamme sur {rg} ; la tonique est mise en \u00e9vidence. Rep\u00e8re d\u2019abord la tonique, puis v\u00e9rifie le sch\u00e9ma ({pat}) : la forme {q} a {ch}. {rep}Les l\u00e9gendes indiquent d\u00e9sormais quelle tonalit\u00e9 et quel mode \u00e9taient r\u00e9ellement les mauvais sch\u00e9mas.`,
"w.diagram.ch.maj":`une 3ce, une 6te et une 7me naturelles`,"w.diagram.ch.min":`une 3ce, une 6te et une 7me abaiss\u00e9es`,
"w.diagram.rep":`Sur tout le manche, les m\u00eames formes se r\u00e9p\u00e8tent tous les 12 cases : la case 12 ressemble donc aux cordes \u00e0 vide. `

"q.sc.degree":`Welche ist die {d} Note der Tonleiter <span class="big">{kn}</span>?`,
"w.sc.degree":`{kn} = {sc}. Wende das Dur-Muster ab {k} an. Jeder Notenname wird einmal verwendet, deshalb schreibt man {ans} und nicht den enharmonischen Zwilling: Die {d} Stufe muss ein \u201e{letter}\u201c-Ton sein.`,
"q.min.degree":`Welche ist die {d} Note der Tonleiter <span class="big">{kn}</span>?`,

"w.min.low":` Die {d} Stufe ist gegen\u00fcber Dur um einen Halbton erniedrigt (\u266d{n}) \u2013 das typische Moll-Klangbild.`,

"w.rel.min":`{kk} = {sc}. Die 6. Note ist {n}, also ist die Moll-Parallele <b>{ans}</b>, mit denselben Noten: {cyc}. Achtung: {kx} (gleicher Grundton) ist die <i>gleichnamige</i> Molltonart, eine andere Tonart mit anderen Noten.`,

"w.rel.maj":`{kk} = {sc}. Die 3. Note ist {n} (3 Halbt\u00f6ne \u00fcber {k}), also ist die Dur-Parallele <b>{ans}</b>, mit denselben Noten: {cyc}. {kx} (gleicher Grundton) w\u00e4re die <i>gleichnamige</i> Durtonart, eine andere Tonart.`,
"q.tri.deg":`Welcher Akkord hat die Stufen <span class="big">{deg}</span> (Grundton, Terz und Quinte)?`,
"w.tri.deg":`<b>{q}</b> = {deg}: der Grundton, {exp}. Auf {r} ergibt das {ans}.`,
"q.tri.notes":`Welche Noten bilden den Dreiklang <span class="big">{kn}</span>?`,
"w.tri.notes":`{kn} hat die Stufen {deg}: Grundton {r}, {exp}. Die Terz ist also {th} ({ts} Halbt\u00f6ne) und die Quinte {fi} ({fs} Halbt\u00f6ne).`,
"q.harm":`In <span class="big">{kk}</span>: Welcher Akkord liegt auf der {d} Note ({rom})?`,
"w.harm":`Nimm jeden zweiten Ton von {t0}: {t}. Die Terzen sind {a} und {b} Halbt\u00f6ne, das ergibt <b>{ans}</b> ({rom}). Die Noten der Tonleiter bestimmen die Qualit\u00e4t \u2013 deshalb ist das Muster in jeder Durtonart gleich.`,
"q.scale.notes":`Welche Noten hat <span class="big">{kn}</span>?`,

"q.diagram.scale":`Welches Diagramm zeigt die Tonleiter <span class="big">{kn}</span> \u00fcber {rg}?<br><small style="color:var(--mut);font:13px system-ui,sans-serif">{tune}. Die hervorgehobenen Punkte sind der Grundton.</small>`,
"w.diagram.scale":`{kn} = {sc}. Jedes Diagramm markiert alle Noten der Tonleiter \u00fcber {rg}; der Grundton ist hervorgehoben. Suche zuerst den Grundton und pr\u00fcfe dann das Muster ({pat}): Die {q}-Form hat {ch}. {rep}Die Beschriftungen zeigen jetzt, welche Tonart und welcher Modus die falschen Diagramme wirklich waren.`,

const CX5={en:{
"l.intervals":`<h2>Intervals: the distance between two notes</h2><p>An interval is counted in <b>semitones</b> (the smallest step on a piano, one key to the next). Every interval has a name because each one has its own character. Knowing them lets you read melodies, build chords and spot patterns instead of memorising notes.</p><details><summary>Cheat sheet</summary><p>{cheat}</p></details>`,
"l.ear":`<h2>Hearing intervals</h2><p>Theory is only useful if you can hear it. Each interval has a distinct sound. The trick is to tie each one to a song you already know, so you recognise the <i>shape</i> of the leap rather than the exact pitches.</p><p>You’re told the first note. Press play (headphones help), then pick the interval. After answering, every option button shows the notes it would have meant (first note → second note), and you can tap any of them to hear it.</p>`,
"l.scales":`<h2>The major scale</h2><p>Every major scale uses the same pattern of steps: <b>Whole, Whole, Half, Whole, Whole, Whole, Half</b> (a whole step = 2 semitones, a half step = 1). Start on any note, apply the pattern, and you get that key. The sharps and flats in a key aren’t random: they are what the pattern forces.</p><details><summary>Why this matters</summary><p>Because the pattern is fixed, the scale sounds “the same” in every key. Learn the pattern once and you can derive any key signature.</p></details>`,
"l.minor":`<h2>The natural minor scale</h2><p>The natural minor pattern is <b>Whole, Half, Whole, Whole, Half, Whole, Whole</b>. Compared with a major scale on the same root, the 3rd, 6th and 7th notes are each a semitone lower (♭3, ♭6, ♭7). That lowered third is what gives minor its darker colour.</p><details><summary>Harmonic and melodic minor</summary><p>Composers often raise the 7th note (harmonic minor) to create a stronger pull back to the tonic. This trainer uses natural minor.</p></details>`,
"l.relative":`<h2>Relative major and minor</h2><p>Every major key shares all of its notes with one minor key, its <b>relative minor</b>. The relative minor starts on the <b>6th note</b> of the major scale (3 semitones below the major tonic). Going the other way, the relative major of a minor key starts on the minor scale’s <b>3rd note</b> (3 semitones above).</p><p>Example: C major and A minor use exactly the same notes, with no sharps or flats. They sound different only because the “home” note changes.</p>`,
"l.triads":`<h2>Building triads</h2><p>A triad is three notes stacked in thirds: root, third, fifth. The size of those thirds sets the quality:</p><p><b>{vmaj}</b> 0-4-7 · <b>{vmin}</b> 0-3-7 · <b>{vdim}</b> 0-3-6 · <b>{vaug}</b> 0-4-8 <span style="color:var(--mut)">(semitones above the root)</span></p><p>The same chords as <b>scale degrees</b> (counted against a major scale from the root): <b>{vmaj}</b> 1 – 3 – 5 · <b>{vmin}</b> 1 – ♭3 – 5 · <b>{vdim}</b> 1 – ♭3 – ♭5 · <b>{vaug}</b> 1 – 3 – ♯5. Here 1 is the root, 3 the third, 5 the fifth; ♭ lowers a note by a semitone and ♯ raises it.</p><p>Only the third and fifth change, and that small shift is the entire difference between bright, sad, tense and unresolved.</p>`,
"l.harmony":`<h2>Which chord lives where?</h2><p>Stack thirds using only the notes of the scale, and you get one triad on every degree. In any major key the qualities are always the same: <b>I major · ii minor · iii minor · IV major · V major · vi minor · vii° diminished</b>.</p><p>This is how songwriters know which chords “belong” together, and why I–IV–V–vi works in every key.</p>`,
"l.modes":`<h2>The seven modes</h2><p>A mode is a major scale started from a different note. Take C major (C D E F G A B) and start on D: that is D Dorian. Same notes, new home note, new sound. The easiest way to think about each mode is how it differs from a major scale on the same root.</p><details><summary>Formulas and character</summary>{list}</details>`,
"l.keys":`<h2>Scales: major, minor and relatives</h2><p>A key is a home note plus the scale built on it. <b>Major:</b> W-W-H-W-W-W-H. <b>Natural minor:</b> W-H-W-W-H-W-W. Every major key shares its notes with a relative minor (the 6th note of the major scale).</p><p>This section mixes everything about the notes of a key: the nth note of a scale, the full set of notes, fretboard diagrams and relative keys.</p>`,
"th.intervals":`<h3>Why count semitones</h3><p>Letter names alone mislead: C to E and C to F♭ are both a kind of 3rd, but they are different sizes. Semitones are exact. From C going up: C♯ 1, D 2, E♭ 3, E 4, F 5, F♯ 6, G 7, A♭ 8, A 9, B♭ 10, B 11, C 12.</p><h3>Where the names come from</h3><p>The number counts letters (C D E is a 3rd). The quality gives the exact size: 2nds, 3rds, 6ths and 7ths are major or minor; 4ths, 5ths and octaves are perfect; the tritone splits the octave in half.</p>`,
"th.ear":`<h3>Training your ear</h3><p>Choose one anchor song for every interval and sing the first note before the jump. Ascending intervals are the easiest place to start. Short, regular sessions beat one long one.</p><p>Notice the character too: seconds are tense, thirds sound sweet, fourths and fifths sound open and stable, sevenths want to resolve.</p>`,
"th.keys":`<h3>Building a major scale</h3><p>Start on any note and climb W-W-H-W-W-W-H. For G major that gives G A B C D E F♯: the F♯ is forced, because the 7th note has to sit a half step under the octave G. This is why every key has its own sharps or flats.</p><h3>Minor and relative keys</h3><p>Natural minor climbs W-H-W-W-H-W-W. A major key and its relative minor share every note: C major and A minor have no sharps or flats, G major and E minor both have one F♯. The relative minor is the 6th note of the major scale.</p><h3>On the guitar</h3><p>A scale shape is the same step pattern on every string, shifted along the neck. Learn where the root sits inside a shape and you can move it to any key.</p>`,
"th.triads":`<h3>Three notes, four colours</h3><p>A triad is a root, a third and a fifth. The third decides major or minor (4 or 3 semitones above the root). The fifth is usually perfect (7); lower it and you get diminished, raise it and you get augmented.</p><p>Major and minor are stable and make up most of what you will meet. Diminished is tense and wants to resolve; augmented sounds suspended and unresolved.</p>`,
"th.harmony":`<h3>One chord per scale note</h3><p>Stack thirds using only the notes of the scale and every degree gets a triad. In major the pattern never changes: I, IV and V are major, ii, iii and vi are minor, and vii° is diminished. In C that is C, Dm, Em, F, G, Am, B°.</p><h3>Why it matters</h3><p>Those chords belong together because they share the scale’s notes, which is why I-IV-V and I-V-vi-IV progressions work in every key.</p>`,
"th.modes":`<h3>Rotating the major scale</h3><p>Play C major (C D E F G A B) but make D the home note and you hear D Dorian. Each of the seven rotations is a mode with its own colour. Always compare a mode with the major or minor scale on the same root and notice which notes change.</p><h3>Using them</h3><p>Dorian works over minor chords with a lighter sound, Mixolydian over dominant chords, Lydian over major chords for a floating feel, Phrygian for a dark, Spanish sound.</p>`,
"th.practice":`<h3>Why practical exercises</h3><p>Knowing a scale or a chord in theory is not the same as finding it under your fingers. These drills join the two: locating notes and roots on the fretboard, and choosing a mode that fits a chord. The hands-on tasks ask you to play, listen, then check yourself.</p>`,
"blurb.practice":`Applied drills plus hands-on tasks to play on your instrument.`,
"tip.rel.min":`<h2>Relative minor</h2><p>The relative minor starts on the <b>6th note</b> of the major scale and uses exactly the same notes. Write the major scale out, count to the 6th note, and that is your answer.</p>`,
"tip.rel.maj":`<h2>Relative major</h2><p>The relative major starts on the <b>3rd note</b> of the minor scale, 3 semitones above its root. Write the minor scale out and take the 3rd note.</p>`,
"tip.diagram.scale":`<h2>Reading a fretboard diagram</h2><p>The bottom line is the low E string, the top line the high E, and the numbers underneath are frets (0 is the open string). Every dot is a note of the scale and the highlighted dots are the root.</p><p>Find the highlighted root first, then check the notes around it against the pattern: a major scale has a natural 3rd, 6th and 7th, a minor scale has them lowered.</p>`,
"tip.diagram.mode":`<h2>A mode on the fretboard</h2><p>Locate the highlighted root, then look for the note that gives the mode its character: the ♭2 of Phrygian, the ♯4 of Lydian, the ♭7 of Mixolydian. All the wrong diagrams share the same root, so only those characteristic notes tell them apart.</p>`,
"tip.scale.notes":`<h2>Spelling a scale</h2><p>Use each letter name once, in order, and add # or b only where the step pattern needs it. Major is W-W-H-W-W-W-H and minor is W-H-W-W-H-W-W. The wrong answers usually change one or two of the 3rd, 6th and 7th, so check those first.</p>`,
"tip.mode.notes":`<h2>Spelling a mode</h2><p>Take the parent major scale and start from the mode’s root. The wrong options usually have one or two notes shifted by a semitone, so compare each option with the mode’s formula.</p>`,
"tip.sc.major":`<h2>Major scale pattern</h2><p>Count up from the root using <b>W-W-H-W-W-W-H</b> (W = 2 semitones, H = 1). Each letter name appears once, so the sharp or flat you meet is the note the pattern forces.</p>`,
"tip.sc.minor":`<h2>Natural minor pattern</h2><p>Count up from the root using <b>W-H-W-W-H-W-W</b>. Compared with the major scale on the same root, the 3rd, 6th and 7th are lowered by a semitone.</p>`,
"tip.iv.semi":`<h2>Counting an interval</h2><p>Count the semitones between the two notes (every piano key, black ones too), then match the number: {cheat}.</p>`,
"tip.iv.ear":`<h2>Hearing an interval</h2><p>Sing the first note in your head and listen for how far the second one jumps. Tie each size to a song: m2 Jaws, M2 Happy Birthday, m3 Greensleeves, M3 When the Saints, P4 Here Comes the Bride, P5 Star Wars, octave Somewhere Over the Rainbow. Tap the options after answering to compare them.</p>`,
"tip.tri.deg":`<h2>Chords as degrees</h2><p>Major 1-3-5, minor 1-♭3-5, diminished 1-♭3-♭5, augmented 1-3-♯5. Look at what happens to the third and the fifth: that is the whole difference between the four chords.</p>`,
"tip.tri.notes":`<h2>Building a triad</h2><p>Stack root, third and fifth. Major is 0-4-7 semitones above the root, minor 0-3-7, diminished 0-3-6, augmented 0-4-8. Find the third first: 4 semitones is major, 3 is minor.</p>`,
"tip.harm":`<h2>Chords in a key</h2><p>Stack thirds using only the notes of the scale. In every major key the qualities are I major, ii minor, iii minor, IV major, V major, vi minor and vii° diminished. Spell the three notes, then measure the thirds between them.</p>`,
"tip.mode.deg":`<h2>Modes as rotations</h2><p>Start the major scale on its 1st, 2nd, 3rd... note and you get {modes}, in that order. Same notes, different home.</p>`,
"tip.mode.parent":`<h2>Finding the parent key</h2><p>Work out which degree of a major scale the mode’s root is (Dorian is the 2nd, Phrygian the 3rd, Lydian the 4th, Mixolydian the 5th, Aeolian the 6th, Locrian the 7th), then count back to that major key.</p>`,
"tip.mode.formula":`<h2>Mode formulas</h2><p>Compare each mode with a major scale on the same root:</p>{list}`,
"tip.mode.ear":`<h2>Hearing a mode</h2><p>First decide whether the 3rd sounds major (bright) or minor (dark). Then listen for the one note that colours it: raised 4th for Lydian, lowered 7th for Mixolydian, raised 6th for Dorian, lowered 2nd for Phrygian.</p>`,
"tip.mode.which":`<h2>Telling modes apart</h2><p>Sort them by colour. Major-sounding: Lydian (♯4), Ionian, Mixolydian (♭7). Minor-sounding: Dorian (raised 6th), Aeolian, Phrygian (♭2), Locrian (♭2 and ♭5).</p>`
