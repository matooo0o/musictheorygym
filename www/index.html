 if(pq.task){prepPrac();const missed=pq.tseq?mWrong:pMiss;const ch=pq.chips?pq.chips.map(g=>'<div class="chips">'+g.map(n=>'<span class="chip">'+n+'</span>').join('')+'</div>').join(''):'';body='<p class="q">'+pq.q+'</p><p class="hs">'+T('hint.task')+'</p>'+(ch?'<div id="mChips">'+ch+'</div>':'')+(pq.tseq?micSeqBox():micFreeBox())+(pdone?('<div class="fb '+(missed?'no':'ok')+'"><b>'+T('check')+'</b> '+pq.reveal+(missed?'<div style="margin-top:6px">'+T(missed>1?'mic.donen':'mic.done1',{n:missed})+'</div>':'')+'</div>'+nx+pReport()):'<div class="row"><button class="btn" onclick="revealPrac()">'+T('btn.reveal')+'</button><span class="stat">'+T('tryfirst')+'</span></div>')}
 else if(pq.mic){body='<p class="q">'+pq.q+'</p><p class="hs">'+(pq.hint||'')+'</p>'+(pq.noChips?'':'<div class="chips" id="mChips">'+pq.labels.map((l,i)=>'<span class="chip" data-i="'+i+'">'+T(l)+'</span>').join('')+'</div>')+'<div class="micbox"><div class="micnote" id="mNote">—</div><div class="miccents" id="mCents">'+T('mic.pressstart')+'</div><div class="micbar"><span id="mNeedle"></span></div></div><div class="row"><button class="btn" onclick="micStartSeq()">'+T('btn.start')+'</button>'+(pq.replay?'<button class="btn alt" onclick="hearPrac()">'+T(pq.replay)+'</button>':'')+'<button class="btn alt" onclick="stopMic()">'+T('btn.stop')+'</button><span class="stat" id="mStat">'+T('score',{c:0,t:pq.seq.length})+'</span></div><div id="mDia"></div><p class="micro" id="mMsg"></p>'}
 else{body='<p class="q">'+pq.q+'</p><div class="opts'+(pq.wide?' w1':'')+'">'+pq.opts.map((o,i)=>'<button class="'+(pdone?(o==pq.ans?'ok':(o==pdone?'no':'')):'')+'" onclick="'+(pdone?'':'pickPrac('+i+')')+'">'+o+(pdone&&pq.labels?'<br><small>'+pq.labels[o]+'</small>':'')+'</button>').join('')+'</div>'+(pdone?'<div class="fb '+(pdone==pq.ans?'ok':'no')+'"><b>'+(pdone==pq.ans?T('correct'):T('notquite'))+'</b> '+pq.why+(pq.extra?'<div style="margin-top:8px">'+pq.extra+'</div>':'')+'</div>':'')+nx}
 $('pracRun').innerHTML='<button class="btn alt" onclick="closeCat()">\u2190 '+T('btn.back')+'</button><h2 class="ht">'+cn(pcat)+'</h2>'+body+'<div class="row"><button class="btn" onclick="nextPrac()">'+T('btn.another')+'</button><span class="stat" id="pStat">'+T('score',{c:pst.c,t:pst.t})+'</span></div><div class="card" id="pstats"></div>';renderStats()}
function taskReset(){pMiss=0;mWrong=0;mOk=[];mI=0}
function prepPrac(){if(!pq||!pq.task)return;
 if(pq.chips&&!pq.tseq){const s=[],l=[];let cur=null;
  pq.chips.forEach(function(g){g.forEach(function(n){const p=pc(n);if(cur===null)s.push(60+p);else{let d=(((p-(cur%12))%12)+12)%12;if(!d)d=12;s.push(cur+d)}cur=s[s.length-1];l.push(n)})});
  pq.tseq=s;pq.tlab=l}
 if(!pq.expect&&pq.tseq)pq.expect=pq.tseq.map(function(m){return ((m%12)+12)%12})}
function pReport(){return pself===null?'<div class="row"><button class="btn" onclick="pscore(true)">'+T('gotit')+'</button><button class="btn alt" onclick="pscore(false)">'+T('missedit')+'</button></div>':'<div class="row"><span class="stat">'+T('score',{c:pst.c,t:pst.t})+'</span></div>'}
function micSeqBox(){return '<div class="micbox"><div class="micnote" id="mNote">\u2014</div><div class="miccents" id="mCents">'+T('mic.pressstart')+'</div><div class="micbar"><span id="mNeedle"></span></div></div><div class="row"><button class="btn" onclick="micStartSeq()">'+T('btn.start')+'</button><button class="btn alt" onclick="hearPrac()">'+T('btn.hear')+'</button><button class="btn alt" onclick="stopMic()">'+T('btn.stop')+'</button><span class="stat" id="mStat">'+T('score',{c:0,t:(pq.tseq||pq.seq).length})+'</span></div><div id="mDia"></div><p class="micro" id="mMsg"></p>'}
function pracMiss(midi){pMiss++;micMsg(T('mic.notin',{n:N[((midi%12)+12)%12],c:pMiss}))}
function micFreeBox(){return '<div class="micbox"><div class="micnote" id="mNote">—</div><div class="miccents" id="mCents">'+T('mic.pressstart')+'</div><div class="micbar"><span id="mNeedle"></span></div></div><div class="row"><button class="btn" onclick="micFree()">'+T('btn.start')+'</button><button class="btn alt" onclick="stopMic()">'+T('btn.stop')+'</button></div><p class="micro" id="mMsg"></p>'}
/* ===== microphone listening ===== */
let mCtx=null,mStream=null,mAn=null,mBuf=null,mRAF=0,mTick=0,micMode=null,mSeq=[],mLabels=[],mI=0,mOk=[],mWrong=0,mLast=null,mStable=0,pMiss=0;
function micMsg(t){const e=$('mMsg');if(e)e.innerHTML=t}
async function micOn(){if(typeof navigator==='undefined'||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){micMsg(T('mic.nosupport'));return false}
 micOff();
 try{mStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}catch(e){micMsg(T('mic.blocked'));return false}
 mCtx=mCtx||new (window.AudioContext||window.webkitAudioContext)();
 if(mCtx.state=='suspended')await mCtx.resume();
 const src=mCtx.createMediaStreamSource(mStream);mAn=mCtx.createAnalyser();mAn.fftSize=2048;mBuf=new Float32Array(mAn.fftSize);src.connect(mAn);
 if(typeof requestAnimationFrame!=='undefined')mRAF=requestAnimationFrame(micLoop);
 return true}
function micFree(){micMode='free';mSeq=[];mLabels=[];mI=0;mOk=[];mWrong=0;mLast=null;mStable=0;pMiss=0;mCooldown=0;mCooldownMidi=null;micOn().then(ok=>{if(ok)micMsg(T('mic.listen'))})}
function micStartSeq(){micMode='seq';const S=pq.tseq||pq.seq,L=pq.tlab||pq.labels;mSeq=S.slice();mLabels=L.slice();mI=0;mOk=[];mWrong=0;mLast=null;mStable=0;pMiss=0;mCooldown=0;mCooldownMidi=null;chipUpdate();micOn().then(ok=>{if(ok)micMsg(T('mic.listenSeq'))})}
function hearPrac(){stopMic();const S=pq.tseq||pq.seq,L=pq.tlab||pq.labels;mSeq=S.slice();mLabels=L.slice();mI=0;mOk=[];mWrong=0;chipUpdate();playSeq(S);micMsg(T('mic.hear'))}
function micOff(){if(mRAF&&typeof cancelAnimationFrame!=='undefined')cancelAnimationFrame(mRAF);mRAF=0;if(mStream){try{mStream.getTracks().forEach(t=>t.stop())}catch(e){}mStream=null}mAn=null}
function stopMic(){micOff();micMode=null;mCooldown=0;mCooldownMidi=null;const n=$('mNote'),c=$('mCents');if(n)n.textContent='—';if(c)c.textContent=T('mic.stopped')}
let mYin=null,mCmnd=null,mEnergyBuf=null,mEnergyIdx=0,mCooldown=0,mCooldownMidi=null;
function detectPitch(buf,sr){const L=buf.length;
 let rms=0;for(let i=0;i<L;i++)rms+=buf[i]*buf[i];rms=Math.sqrt(rms/L);if(rms<0.008)return 0;
 if(!mEnergyBuf) mEnergyBuf=new Float32Array(16);
 mEnergyBuf[mEnergyIdx=(mEnergyIdx+1)%16]=rms;
 let energyAvg=0;for(let i=0;i<16;i++)energyAvg+=mEnergyBuf[i];energyAvg/=16;
 // Softer energy gate - allow sustained notes
 if(rms<energyAvg*0.3) return 0;
 const tauMax=Math.min(Math.floor(sr/70),L-2);
 if(!mYin||mYin.length<tauMax+1){mYin=new Float32Array(tauMax+1);mCmnd=new Float32Array(tauMax+1)}
 const y=mYin,c=mCmnd;
 for(let tau=1;tau<=tauMax;tau++){let s=0;for(let i=0;i<L-tau;i++){const d=buf[i]-buf[i+tau];s+=d*d}y[tau]=s}
 let run=0;c[0]=1;
 for(let tau=1;tau<=tauMax;tau++){run+=y[tau];c[tau]=run?y[tau]*tau/run:1}
 let tau=-1;const thr=0.10;
 for(let t=2;t<tauMax;t++){if(c[t]<thr){while(t+1<tauMax&&c[t+1]<c[t])t++;tau=t;break}}
 if(tau<0){let m=Infinity;for(let t=2;t<tauMax;t++)if(c[t]<m){m=c[t];tau=t}if(m>0.6)return 0}
 const x0=c[tau-1]||c[tau],x2=c[tau+1]||c[tau],den=x0+x2-2*c[tau];let T=tau;if(den)T=tau-(x2-x0)/(2*den);
 const f=sr/T;
 // Harmonic check only for higher frequencies
 if(f>400 && f<1000){const tau2=Math.round(sr/(f*2)); if(tau2>2 && tau2<tauMax && c[tau2]<thr*1.5) return 0;}
 return(f>=65&&f<=1500)?f:0}
function micLoop(){if(typeof requestAnimationFrame!=='undefined')mRAF=requestAnimationFrame(micLoop);if(!mAn||!mBuf||!mCtx)return;
 if((mTick=(mTick||0)+1)%2)return;
 mAn.getFloatTimeDomainData(mBuf);const f=detectPitch(mBuf,mCtx.sampleRate);const nEl=$('mNote'),cEl=$('mCents'),nd=$('mNeedle');
 if(!f){if(nEl)nEl.textContent='—';if(cEl)cEl.textContent=T('mic.waiting');mLast=null;mStable=0;mStableMidi=-1;return}
 const rf=refHz(),midi=Math.round(69+12*Math.log2(f/rf)),dev=1200*Math.log2(f/(rf*Math.pow(2,(midi-69)/12)));
 if(nEl)nEl.textContent=N[((midi%12)+12)%12]+(Math.floor(midi/12)-1);
 if(cEl)cEl.textContent=(dev>0?'+':'')+dev.toFixed(0)+T('mic.cents')+(Math.abs(dev)<=15?' \u00b7 '+T('mic.intune')+'':'');
 if(nd)nd.style.left=(50+Math.max(-45,Math.min(45,dev*0.9)))+'%';
 if(midi===mLast && Math.abs(dev)<50) mStable++; else {mLast=midi; mStable=1;}
 // Cooldown: ignore same pitch for ~400ms after note registration
 if(mCooldown>0){ mCooldown--; if(mCooldown===0) mCooldownMidi=null; }
 if(micMode==='seq'&&mStable===6){
   if(mCooldown===0 || midi!==mCooldownMidi){
     registerNote(midi);
     mCooldown=8; // ~400ms at 50fps (every 2 frames = 20fps, 8*50ms = 400ms)
     mCooldownMidi=midi;
   }
 }else if(micMode==='free'&&mStable===6&&!tunerOn&&pq&&pq.expect&&pq.expect.indexOf(((midi%12)+12)%12)<0){
   pracMiss(midi)
 }}
function chipUpdate(){const c=$('mChips');if(c&&c.querySelectorAll)c.querySelectorAll('.chip').forEach((el,i)=>{el.className='chip'+(mOk[i]?' '+mOk[i]:'')+(i===mI&&mI<mSeq.length?' now':'')});const st=$('mStat');if(st)st.textContent=T('score',{c:mI,t:mSeq.length})}
function registerNote(midi){if(mI>=mSeq.length)return;mCooldown=8;mCooldownMidi=midi;const p=((midi%12)+12)%12,tgt=((mSeq[mI]%12)+12)%12;
 if(p===tgt){mOk[mI]='ok';mI++;chipUpdate();if(mI>=mSeq.length)finishSeq();return}
 if(!(pq&&pq.strict))for(let j=mI+1;j<mSeq.length;j++)if(((mSeq[j]%12)+12)%12===p){for(let z=mI;z<j;z++)if(!mOk[z]){mOk[z]='skip';mWrong++}mOk[j]='ok';mI=j+1;chipUpdate();if(mI>=mSeq.length)finishSeq();return}
 mWrong++;if(!mOk[mI])mOk[mI]='bad';chipUpdate();micMsg(T('mic.wrong',{n:N[p],want:T(mLabels[mI])}))}
function finishSeq(){pst.t++;if(!mWrong)pst.c++;record(!mWrong);pStatUpd();pself=!mWrong;micMode='done';micMsg((mWrong?(mWrong>1?T('mic.donen',{n:mWrong}):T('mic.done1')):T('mic.done'))+(pq&&pq.doneMsg?'<br>'+pq.doneMsg:''));const dd=document.getElementById('mDia');if(dd)dd.innerHTML=pracDia()}
let cur='intervals',st={},q=null,done=false,exPicked=false,pself=null;
const EXIC={intervals:'🎵',ear:'👂',keys:'🎼',triads:'🎹',harmony:'🔗',modes:'✨'};
const $=id=>document.getElementById(id);
function tabs(){const h=$('nh');
 if(view=='prac'){if(h)h.textContent=T('nav.categories');$('tabs').innerHTML=Object.keys(PRAC).map(k=>'<button class="'+(k==pcat?'on':'')+'" onclick="openCat(\''+k+'\')">'+cn(k)+'</button>').join('');return}
 if(h)h.textContent=T('nav.sections');
 $('tabs').innerHTML=Object.keys(MODS).map(k=>'<button class="'+((exPicked&&k==cur)?'on':'')+'" onclick="go(\''+k+'\')">'+mn(k)+'</button>').join('')}
function drawEx(){const c=$('exCats'),r=$('exRun');if(!c||!r)return;document.body.classList.toggle('navon',exPicked);
 if(exPicked){c.style.display='none';r.style.display=''}
 else{r.style.display='none';c.style.display='';
  c.innerHTML='<h2 class="ht">'+T('ex.title')+'</h2><p class="hs">'+T('ex.sub')+'</p>'+Object.keys(MODS).map(k=>'<button class="pcard" onclick="openEx(\''+k+'\')"><b><span class="ic">'+(EXIC[k]||'🎵')+'</span>'+mn(k)+'</b><span>'+blurb(k)+'</span></button>').join('')}}
function openEx(k){show('ex');go(k)}
function go(k){cur=k;exPicked=true;tabs();document.body.classList.remove('open');$('ttl').textContent=mn(k);next();drawEx()}
function tog(){document.body.classList.toggle('open')}
function next(){q=MODS[cur].gen();done=false;$('lesson').innerHTML=tipFor(q);draw()}
function reveal(){done=true;draw()}
function draw(){if(q.task){$('quiz').innerHTML=`<p class="q">${q.q}</p>${done?`<div class="fb ok"><b>${T('check')}</b> ${q.reveal}</div>${notationFor(q)}<div class="row"><button class="btn" onclick="next()">${T('btn.next')}</button><span class="stat">${T('hands')}</span></div>`:`<div class="row"><button class="btn" onclick="reveal()">${T('btn.reveal')}</button><span class="stat">${T('tryfirst')}</span></div>`}`;return}const s=st[cur]||{c:0,t:0};
$('quiz').innerHTML=`<p class="q">${q.q}</p>${q.audio?`<div class="row" style="margin:0 0 12px"><button class="btn" onclick="play(${q.audio[0]},${q.audio[1]},false)">${T('btn.play')}</button><button class="btn alt" onclick="play(${q.audio[0]},${q.audio[1]},true)">${T('btn.together')}</button></div>`:''}
${q.seq?'<div class="row" style="margin:0 0 12px"><button class="btn" onclick="playSeq(['+q.seq+'])">\u25b6 '+T('btn.playscale')+'</button></div>':''}<div class="opts${q.wide?' w1':''}">${q.opts.map((o,i)=>`<button ${done&&!q.labels?'disabled':''} class="${done?(o==q.ans?'ok':(o==done?'no':'')):''}" onclick="${done?'hear('+i+')':'pick('+i+')'}">${o}${done&&q.labels?'<br><small>'+q.labels[o]+(q.pl?' · tap to hear':'')+'</small>':''}</button>`).join('')}</div>
${done?`<div class="fb ${done==q.ans?'ok':'no'}"><b>${done==q.ans?T('correct'):T('notquite')}</b> ${q.why}${q.extra?'<div style="margin-top:8px">'+q.extra+'</div>':''}</div>${notationFor(q)}<div class="row"><button class="btn" onclick="next()">${T('btn.nextq')}</button><span class="stat">${T('score',{c:s.c,t:s.t})}</span></div>`:`<div class="row"><span class="stat">${T('score',{c:s.c,t:s.t})}</span></div>`}`}
function pick(i){if(done)return;done=q.opts[i];const s=st[cur]=st[cur]||{c:0,t:0};s.t++;if(done==q.ans)s.c++;record(done==q.ans);draw()}
function hear(i){const p=q.pl&&q.pl[q.opts[i]];if(p)play(p[0],p[1],false)}
const KEY='theorygym.v1',ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let store={days:{},cust:{c:0,t:0,since:ds(new Date())}},ses={c:0,t:0},canSave=true;
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.days&&s.cust){store=s;if(!store.cust.since)store.cust.since=ds(new Date())}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));canSave=true}catch(e){canSave=false}}
function record(ok){const d=ds(new Date()),b=store.days[d]=store.days[d]||{c:0,t:0};b.t++;store.cust.t++;ses.t++;if(ok){b.c++;store.cust.c++;ses.c++}
const cut=ds(new Date(Date.now()-60*864e5));Object.keys(store.days).forEach(k=>{if(k<cut)delete store.days[k]});save();renderStats()}
function month(){const cut=ds(new Date(Date.now()-29*864e5));let c=0,t=0;Object.entries(store.days).forEach(([k,v])=>{if(k>=cut){c+=v.c;t+=v.t}});return{c,t}}
const pct=(c,t)=>t?Math.round(100*c/t)+'%':'–';
const box=(l,c,t)=>'<div style="text-align:center"><div style="font:12px system-ui;color:var(--mut)">'+l+'</div><div class="big">'+pct(c,t)+'</div><div style="font:12px system-ui;color:var(--mut)">'+c+' / '+t+'</div></div>';
function renderStats(){const m=month();const html='<div class="sg">'+box(T('stat.session'),ses.c,ses.t)+box(T('stat.month'),m.c,m.t)+box(T('stat.since'),store.cust.c,store.cust.t)+'</div><div class="row"><span class="stat" style="margin-left:0">'+T('stat.sinceV',{d:store.cust.since})+'</span><button class="btn alt" style="margin-left:auto" onclick="resetCustom()">'+T('stat.reset')+'</button></div>'+(canSave?'':'<p style="font:12px system-ui;color:var(--mut);margin:8px 0 0">'+T('stat.nosave')+'</p>');const f=function(id){const e=$(id);if(e)e.innerHTML=html};f('stats');f('pstats')}
function resetCustom(){store.cust={c:0,t:0,since:ds(new Date())};save();renderStats()}
load();applySet();drawHome();renderStats();go('intervals');show('home');
</script></body></html>
